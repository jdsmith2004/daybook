# Every push and pull request: everything typechecks and passes its tests (the golden tests among them),
# the web app and the Lambda build, and the Terraform is valid. Nothing here touches AWS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Core, app and API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build the Lambda
        run: npm run build -w @daybook/api
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for d in infra/bootstrap infra/app; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
