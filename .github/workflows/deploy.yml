# Deploys the sync API and the web app to AWS.
#
# Safe by design:
# - It does nothing until the AWS secrets are set (see infra/README.md).
# - AWS trusts only workflows running on main (OpenID Connect, no stored keys), and the account is locked: the role must
#   belong to AWS_ACCOUNT_ID, the sign-in must land in it, and Terraform itself refuses any other account.
# - The account details are secrets, so they are masked in the public logs.
# - Only the two jobs that talk to AWS can get an AWS token, and neither runs npm: the code that installs and builds
#   packages never has a way into AWS.
#
# When it runs: a push to main deploys only when its last commit's message has [deploy] in it, so a batch of small
# changes goes out once. Actions > Deploy > Run workflow deploys main at any time.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ready:
    name: Set up?
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$ACCOUNT$ROLE$BUCKET" ] || [ -z "$REGION" ]; then
            echo "AWS is not set up for this repository yet (see infra/README.md). Nothing to deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Deploys run only from main."; exit 1; }
          case "$ROLE" in
            "arn:aws:iam::$ACCOUNT:role/daybook-deploy") ;;
            *) echo "::error::AWS_DEPLOY_ROLE_ARN is not the daybook-deploy role in AWS_ACCOUNT_ID. Stopping."; exit 1 ;;
          esac
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build the Lambda
    needs: ready
    if: needs.ready.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @daybook/api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda
          path: |
            services/api/dist/sync.zip
            services/api/dist/signup.zip
            services/api/dist/pulse.zip
            services/api/dist/apple-auth.zip
          retention-days: 3

  infra:
    name: Terraform
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: '1'
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      # the one account that may read the opt-in counts and feedback (the Stats page in the app shows it); empty: no one
      TF_VAR_owner_sub: ${{ secrets.DAYBOOK_OWNER_SUB }}
      # Sign in with Apple (docs/plan.md, "Sign in with Apple"): repository variables, none of them secret. The key itself is
      # only ever in Parameter Store, put there by the owner
      TF_VAR_apple_sign_in: ${{ vars.APPLE_SIGN_IN || 'false' }}
      TF_VAR_apple_services_id: ${{ vars.APPLE_SERVICES_ID }}
      TF_VAR_apple_team_id: ${{ vars.APPLE_TEAM_ID }}
      TF_VAR_apple_key_id: ${{ vars.APPLE_KEY_ID }}
      ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
    outputs:
      sync_url: ${{ steps.out.outputs.sync_url }}
      pulse_url: ${{ steps.out.outputs.pulse_url }}
      apple: ${{ steps.out.outputs.apple }}
      apple_services_id: ${{ steps.out.outputs.apple_services_id }}
      auth_domain: ${{ steps.out.outputs.auth_domain }}
      client_id: ${{ steps.out.outputs.client_id }}
      web_url: ${{ steps.out.outputs.web_url }}
      web_bucket: ${{ steps.out.outputs.web_bucket }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda
          path: services/api/dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Signed in to the Daybook account, and only that one
        run: |
          got=$(aws sts get-caller-identity --query Account --output text)
          [ "$got" = "$ACCOUNT" ] || { echo "::error::Signed in to the wrong AWS account. Stopping."; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Apply
        working-directory: infra/app
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve
      - id: out
        name: Outputs
        working-directory: infra/app
        run: |
          for k in sync_url pulse_url auth_domain client_id web_url web_bucket distribution_id apple apple_services_id; do
            echo "$k=$(terraform output -raw $k)" >> "$GITHUB_OUTPUT"
          done

  web:
    name: Build the web app
    needs: infra
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SYNC_URL: ${{ needs.infra.outputs.sync_url }}
      EXPO_PUBLIC_PULSE_URL: ${{ needs.infra.outputs.pulse_url }}
      EXPO_PUBLIC_AUTH_DOMAIN: ${{ needs.infra.outputs.auth_domain }}
      EXPO_PUBLIC_CLIENT_ID: ${{ needs.infra.outputs.client_id }}
      EXPO_PUBLIC_WEB_URL: ${{ needs.infra.outputs.web_url }}
      EXPO_PUBLIC_APPLE_SERVICES_ID: ${{ needs.infra.outputs.apple_services_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/mobile/dist
          retention-days: 3

  publish:
    name: Publish the web app
    needs: [infra, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      WEB_BUCKET: ${{ needs.infra.outputs.web_bucket }}
      DISTRIBUTION_ID: ${{ needs.infra.outputs.distribution_id }}
      WEB_URL: ${{ needs.infra.outputs.web_url }}
      SYNC_URL: ${{ needs.infra.outputs.sync_url }}
      PULSE_URL: ${{ needs.infra.outputs.pulse_url }}
      AUTH_DOMAIN: ${{ needs.infra.outputs.auth_domain }}
      CLIENT_ID: ${{ needs.infra.outputs.client_id }}
      APPLE: ${{ needs.infra.outputs.apple }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload
        working-directory: dist
        run: |
          # files with a hash in their name never change, so browsers may keep them. Old ones are left in place, so a tab
          # that is already open can still load them. The page itself goes last, and is always checked for a newer copy.
          # the public pages (about, support, privacy, terms, testers, tipped, llms.txt, robots.txt, sitemap.xml) change in place too, so they are always checked for a newer copy,
          # and so do the Home Screen app's manifest and icons, and the guides
          aws s3 sync . "s3://$WEB_BUCKET" --exclude index.html --exclude metadata.json --exclude favicon.ico \
            --exclude support.html --exclude privacy.html --exclude terms.html --exclude about.html --exclude testers.html --exclude tipped.html --exclude tipped.js --exclude llms.txt --exclude robots.txt --exclude sitemap.xml --exclude site.css --exclude site-icon.png \
            --exclude manifest.json --exclude apple-touch-icon.png --exclude icon-192.png --exclude icon-512.png --exclude "guides/*" \
            --cache-control "public,max-age=31536000,immutable"
          for f in metadata.json favicon.ico support.html privacy.html terms.html about.html testers.html tipped.html tipped.js llms.txt robots.txt sitemap.xml site.css site-icon.png manifest.json apple-touch-icon.png icon-192.png icon-512.png index.html; do
            if [ -f "$f" ]; then aws s3 cp "$f" "s3://$WEB_BUCKET/$f" --cache-control "no-cache"; fi
          done
          if [ -d guides ]; then aws s3 sync guides "s3://$WEB_BUCKET/guides" --cache-control "no-cache"; fi
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/" "/index.html" > /dev/null
          echo "### Deployed: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          # what a phone build needs to sync (apps/mobile/.env.example). These are public: the web app carries them too.
          {
            echo ""
            echo "For phone builds (apps/mobile/.env.local, or EAS environment variables):"
            echo '```'
            echo "EXPO_PUBLIC_SYNC_URL=$SYNC_URL"
            echo "EXPO_PUBLIC_PULSE_URL=$PULSE_URL"
            echo "EXPO_PUBLIC_AUTH_DOMAIN=$AUTH_DOMAIN"
            echo "EXPO_PUBLIC_CLIENT_ID=$CLIENT_ID"
            echo "EXPO_PUBLIC_APPLE=$APPLE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
