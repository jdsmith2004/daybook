# The Android app: checks everything, then builds it on Expo's servers (EAS Build) and sends it to Google Play (EAS Submit)
# as a draft on the internal testing track. Run it from the Actions tab on any computer or phone (Actions > Google Play >
# Run workflow). The one-time setup it needs, and the first upload Google asks to be done by hand, are in docs/launch.md,
# under "Google Play". The free Expo plan gives 15 Android builds a month and never charges for more.
name: Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  android:
    name: Build and send to Google Play
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY }}
    steps:
      - name: Set up?
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is not set yet. See docs/launch.md, step 2."
            exit 1
          fi
          if [ -z "$PLAY_KEY" ]; then
            echo "::error::The GOOGLE_PLAY_KEY secret is not set yet. See docs/launch.md, Google Play, step 3."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # As on the iPhone run: the build is queued without waiting, then watched every 30 seconds, so the run page and its
      # summary show where it is.
      - name: Queue the build on Expo
        id: queue
        working-directory: apps/mobile
        run: |
          npx --yes eas-cli@24.10.0 build --platform android --profile production --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")
          url="https://expo.dev/accounts/jeffspresso/projects/daybook/builds/$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "$(date -u +%H:%M) UTC: build queued: $url"
          { echo "## Android build"; echo; echo "- $(date -u +%H:%M) UTC: queued on Expo ([see it there]($url))"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the build (status every 30 seconds)
        working-directory: apps/mobile
        run: |
          start=$(date +%s); last=''
          while true; do
            b=$(npx --yes eas-cli@24.10.0 build:view ${{ steps.queue.outputs.id }} --json 2>/dev/null || echo '{}')
            status=$(echo "$b" | jq -r '.status // "UNKNOWN"')
            place=$(echo "$b" | jq -r '.queuePosition // empty')
            left=$(echo "$b" | jq -r 'if .estimatedWaitTimeLeftSeconds then (.estimatedWaitTimeLeftSeconds / 60 | ceil | tostring) else empty end')
            mins=$(( ($(date +%s) - start) / 60 ))
            line="$status"
            [ -n "$place" ] && line="$line, place $place in the queue"
            [ -n "$left" ] && line="$line, about $left min to start"
            echo "$(date -u +%H:%M) UTC, $mins min: $line"
            if [ "$status" != "$last" ]; then echo "- $(date -u +%H:%M) UTC ($mins min): $status" >> "$GITHUB_STEP_SUMMARY"; last=$status; fi
            case "$status" in
              FINISHED) exit 0 ;;
              ERRORED | CANCELED)
                echo "::error::The build $status after $mins min. The Expo link in the summary has its logs."
                exit 1
                ;;
            esac
            sleep 30
          done
      # The Play key lives only in the GitHub secret. It is written to a file for this one step (play-key.json is in
      # .gitignore, and eas.json points at it), and removed again whatever happens.
      - name: Send to Google Play (internal testing, as a draft)
        working-directory: apps/mobile
        run: |
          trap 'rm -f play-key.json' EXIT
          (umask 077 && printf '%s' "$PLAY_KEY" > play-key.json)
          echo "- $(date -u +%H:%M) UTC: sending to Google Play" >> "$GITHUB_STEP_SUMMARY"
          npx --yes eas-cli@24.10.0 submit --platform android --profile production --id ${{ steps.queue.outputs.id }} --non-interactive --wait
          { echo "- $(date -u +%H:%M) UTC: sent. It is a draft on the internal testing track in the Play Console, ready to roll out to testers."; } >> "$GITHUB_STEP_SUMMARY"
