# Every push to main: builds the web app and publishes it to GitHub Pages, a free preview at
# https://jdsmith2004.github.io/daybook/ so each change can be seen right away. It needs no AWS and costs nothing.
# It has no sync (that lives in AWS), so each browser keeps its own log, as the app always does before sync is on.
# One-time setup by the owner: repository Settings > Pages > Source: GitHub Actions.
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export for the web, under /daybook
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /daybook
        run: |
          npx expo export --platform web --output-dir dist
          # the Home Screen links in public/index.html start at the site's root; here the root is /daybook
          sed -i 's#href="/manifest.json"#href="/daybook/manifest.json"#; s#href="/apple-touch-icon.png"#href="/daybook/apple-touch-icon.png"#' dist/index.html
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/mobile/dist

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: pages
