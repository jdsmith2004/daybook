# The iPhone app: checks everything, then builds it on Expo's servers (EAS Build) and sends it to TestFlight (EAS Submit).
# Nothing here needs a Mac or any one computer: run it from the Actions tab on github.com, on any computer or phone
# (Actions > App Store > Run workflow). The one-time setup it needs is in docs/launch.md. The free Expo plan gives 15 iOS
# builds a month and never charges for more: past that, builds wait for the next month.
name: App Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  ios:
    name: Build and send to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Set up?
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is not set yet. See docs/launch.md, step 2."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build is queued without waiting, then watched every 30 seconds, so the run page and its summary show where it
      # is (in the queue and at what place, building, done) instead of one silent step.
      - name: Queue the build on Expo
        id: queue
        working-directory: apps/mobile
        run: |
          npx --yes eas-cli@24.10.0 build --platform ios --profile production --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")
          url="https://expo.dev/accounts/jeffspresso/projects/daybook/builds/$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "$(date -u +%H:%M) UTC: build queued: $url"
          { echo "## iPhone build"; echo; echo "- $(date -u +%H:%M) UTC: queued on Expo ([see it there]($url))"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the build (status every 30 seconds)
        working-directory: apps/mobile
        run: |
          start=$(date +%s); last=''
          while true; do
            b=$(npx --yes eas-cli@24.10.0 build:view ${{ steps.queue.outputs.id }} --json 2>/dev/null || echo '{}')
            status=$(echo "$b" | jq -r '.status // "UNKNOWN"')
            place=$(echo "$b" | jq -r '.queuePosition // empty')
            left=$(echo "$b" | jq -r 'if .estimatedWaitTimeLeftSeconds then (.estimatedWaitTimeLeftSeconds / 60 | ceil | tostring) else empty end')
            mins=$(( ($(date +%s) - start) / 60 ))
            line="$status"
            [ -n "$place" ] && line="$line, place $place in the queue"
            [ -n "$left" ] && line="$line, about $left min to start"
            echo "$(date -u +%H:%M) UTC, $mins min: $line"
            if [ "$status" != "$last" ]; then echo "- $(date -u +%H:%M) UTC ($mins min): $status" >> "$GITHUB_STEP_SUMMARY"; last=$status; fi
            case "$status" in
              FINISHED) exit 0 ;;
              ERRORED | CANCELED)
                echo "::error::The build $status after $mins min. The Expo link in the summary has its logs."
                exit 1
                ;;
            esac
            sleep 30
          done
      - name: Send to TestFlight
        working-directory: apps/mobile
        run: |
          echo "- $(date -u +%H:%M) UTC: sending to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          npx --yes eas-cli@24.10.0 submit --platform ios --profile production --id ${{ steps.queue.outputs.id }} --non-interactive --wait
          { echo "- $(date -u +%H:%M) UTC: sent. Apple now processes it (often 10 to 30 minutes); it then shows as Ready to test in TestFlight."; } >> "$GITHUB_STEP_SUMMARY"
