}
/* the moment, when nothing was said about it: late at night counts as "late"; otherwise what usually sets it off around this hour */
function urCtxTrig(sc){
 if(sc.trigger)return urTrigKey(sc.trigger);
 if(urNight())return 'late';
 const h=new Date().getHours(),c={};
 eventsOf(Store.days,addDays(todayKey(),-59)).forEach(e=>{
  if(!e.trigger||!isTime(e.time))return;
  const eh=+e.time.slice(0,2),d=Math.min(Math.abs(eh-h),24-Math.abs(eh-h));
  if(d<=2){const k=urTrigKey(e.trigger);c[k]=(c[k]||0)+1}
 });
 const best=Object.keys(c).filter(k=>k!=='none').sort((a,b)=>c[b]-c[a])[0];

}
function urRank(sc){
 const tk=urCtxTrig(sc),fit=UR_FIT[tk]||UR_FIT.other,sn=UR_STRN[sc.strength]||{},night=urNight();
 const S=urStats(),hb=S.by[tk]||{},pm=urMem(),pass=pm.pass&&typeof pm.pass==='object'?pm.pass:{};
 const pin=Store.settings&&Store.settings.urPin,skip=sc.skip||[];
 return TOOLS.map(t=>{
  const id=t.id,rt=hb[id]&&hb[id].n>=2?hb[id]:null,ra=S.all[id]||null,r=rt||ra;
  let s=(fit[id]||0)+(sn[id]||0);
  if(id==='bed'&&!night)s-=20;
  s+=urLift(r);
  if(id===pin)s+=40;
  if(sc.used.indexOf(id)>=0)s-=30;
  if(skip.indexOf(id)>=0)s-=20;
  s-=Math.min(4,(pass[id]|0)*.8); /* a suggestion you keep passing over slides down */
  /* never offered on its own: a person (only when you pick it), and Breathe on the first screen, where the ring is already breathing with you */
  const off=id!==pin&&(id==='message'||(id==='breathe'&&!sc.again));
  return {id,score:s,r,rt,tk,pin:id===pin,off};
 }).sort((a,b)=>b.score-a.score||UR_PREF.indexOf(a.id)-UR_PREF.indexOf(b.id));

/* the last SOS, if it was under 90 minutes ago: waves often come in sets */
function urLast(){const l=urMem().last;return l&&typeof l==='object'&&typeof l.t==='number'&&Date.now()-l.t<90*60000?l:null}
/* the one suggestion. Your go-to, if you set one. Right after a SOS that ended well, the tool that helped.
   Now and then on the first suggestion, a tool you have not tried yet (it says so). After "Still strong", always what has worked. */
function urPickSug(sc){
 const rank=urRank(sc),skip=sc.skip||[];
 const ok=x=>!x.off&&sc.used.indexOf(x.id)<0&&skip.indexOf(x.id)<0;
 /* Go to bed is never offered alone: putting the phone away leaves you alone with your thoughts, so it always comes after one tool for the thoughts */

 };

 if(best.pin)return pair({top:best,mode:'pin'});

 if(sc.explore==null)sc.explore=!sc.again&&Math.random()<(sc.strength==='low'?.35:sc.strength==='high'?0:.2);
 const last=urLast();
 if(!sc.again&&last&&last.tool){const x=rank.find(y=>y.id===last.tool);if(x&&ok(x))return pair({top:x,mode:'last',last})}
 if(sc.explore){
  const tried=urTried(),x=rank.find(y=>!tried[y.id]&&y.score>=4&&ok(y));

function urWhyTool(x,mode,last){

 if(mode==='last'){const mn=Math.max(1,Math.round((Date.now()-last.t)/60000));return 'It helped '+(mn<60?mn+(mn===1?' minute':' minutes')+' ago':'about an hour ago')+'.'}

 else{pass[sug]=Math.min(6,(pass[sug]|0)+1);if(picked&&pass[picked])pass[picked]=Math.max(0,pass[picked]-1)}

/* ---- the words ---- */
const UR_DO={

/* your own record, kept short: how many you have ridden out, and how long yours usually take (SOS shows these as two small chips) */
function urMedian(){

}

   Lessons are matched by what set the urge off (or by a slip), most fitting first. Only lessons you have not finished are offered, and the same
   one is not offered again within a few hours. When every fitting lesson is finished, one is offered again as a second look, now and then. */
const UR_LPREF={
 slipped:['l3','l6','l5','l21','l17','l12','l18','l22','l31','l32'],
 late:['l4','l10','l9','l17','l20','l23','l30'],
 lonely:['l4','l7','l13','l8','l23'],
 bored:['l23','l15','l10','l20','l9','l13'],

 other:['l2','l16','l13','l18','l9','l19','l1'],
 none:['l2','l19','l16','l9','l13','l1']
};
function urLessonFor(trigger,slipped,hint){
 const L=(typeof LESSONS!=='undefined'&&Array.isArray(LESSONS))?LESSONS:[];
 if(!L.length)return null;
 const done=lessonsDone(),key=slipped?'slipped':urTrigKey(trigger),pref=UR_LPREF[key]||UR_LPREF.other;
 const score=l=>{
  const tags=Array.isArray(l.tags)?l.tags:[],i=pref.indexOf(l.id);
  return (tags.indexOf(key)>=0?6:0)+(!slipped&&tags.indexOf('urge')>=0?2:0)+(i>=0?pref.length-i:0)+(!slipped&&hint&&l.id===hint?9:0);
 };
 const m=urMem(),off=m.off&&typeof m.off==='object'?m.off:{},now=Date.now(),H=3600000;
 const fits=L.filter(l=>score(l)>0).sort((a,b)=>score(b)-score(a));
 const open=fits.filter(l=>!done.has(l.id));
 const fresh=open.filter(l=>!(off[l.id]&&now-off[l.id]<6*H));
 if(fresh.length){off[fresh[0].id]=now;m.off=off;writeJSON(URK,m);return {l:fresh[0],rev:false}}
 if(open.length)return null;
 const rv=m.rv&&typeof m.rv==='object'?m.rv:{};
 const back=fits.filter(l=>done.has(l.id)).sort((a,b)=>(rv[a.id]||0)-(rv[b.id]||0)||score(b)-score(a));
 if(back.length&&(!m.rev||now-m.rev>3*24*H)){m.rev=now;rv[back[0].id]=now;m.rv=rv;writeJSON(URK,m);return {l:back[0],rev:true}}
 return null;
}

const CU_WHERE={chest:'in your chest',stomach:'in your stomach',throat:'in your throat or jaw',hands:'in your hands or arms',head:'in your head',all:'all over'};
const CU_CHG=[['bigger','Bigger'],['same','About the same'],['smaller','Smaller']];
const CU_SAY={bigger:'Waves often build before they fall. Keep watching. You do not have to do anything about it.',same:'Steady is fine. You are watching it, not obeying it.',smaller:'That is the wave going down, and you let it.'};
const CU_MS=90000;
/* the wave: it builds, peaks a little before the middle, and falls back */
const CU_D='M10 96 C 46 96, 62 76, 82 50 S 112 10, 128 10 S 158 38, 178 64 S 220 96, 250 96';
function cuLine(sc){
 const w=CU_WHERE[sc.body],f=CU_FEEL.find(x=>x[0]===sc.feel&&x[0]!=='else');
 if(f&&w)return f[1]+' '+w+'.';
 if(w)return 'You feel it '+w+'.';
 if(f)return 'It feels '+f[1].toLowerCase()+'.';
 return '';
}
function cuProg(sc){
 return `<div class="ls-prog ci-prog" role="img" aria-label="Step ${sc.i+1} of 5">${[0,1,2,3,4].map(j=>`<i class="${j<sc.i?'done':j===sc.i?'now':''}"></i>`).join('')}</div>`;
}
SCENES.curious=function(sc){
 const i=sc.i,anim=sc.anim?(sc.dir==='p'?' in-p':' in-n'):'';
 sc.anim=false;
 const back=i>0?'sc-cu-back':'';
 const next='<button class="btn btn-primary wide go" type="button" data-act="sc-cu-next">Next</button>';
 const skip='<button class="link" type="button" data-act="sc-cu-skip">Skip</button>';
 let body='',foot='';
 if(i===0){
  body=`<p class="eyebrow">Notice it</p><h1 class="sc-h" id="ci-h" tabindex="-1">An urge is here.</h1>
   <p class="sc-p">That is all you have to see right now. Drop your shoulders and unclench your jaw. Take one slow breath.</p>${next}`;
 }else if(i===1){
  body=`<p class="eyebrow">Let it be</p><h1 class="sc-h" id="ci-h" tabindex="-1">Let it be here.</h1>
   <p class="sc-p">You do not have to fight it or obey it. Give it a minute without doing anything about it.</p>${next}`;
 }else if(i===2){
  body=`<p class="eyebrow">Look closer</p><h1 class="sc-h" id="ci-h" tabindex="-1">Where do you feel it?</h1>
   <p class="sc-p">Look inside, like a curious scientist. There is no wrong answer.</p>${ciTiles(CU_BODY,sc.body,'sc-cu-body')}`;
  foot=skip;
 }else if(i===3){
  body=`<p class="eyebrow">Name it</p><h1 class="sc-h" id="ci-h" tabindex="-1">What does it feel like?</h1>
   <p class="sc-p">One word is enough.</p>${ciTiles(CU_FEEL,sc.feel,'sc-cu-feel')}`;
  foot=skip;
 }else{
  if(!sc.w0)sc.w0=Date.now();
  const line=cuLine(sc),left=Math.max(0,sc.w0+CU_MS-Date.now());
  body=`<p class="eyebrow">Watch it</p><h1 class="sc-h" id="ci-h" tabindex="-1">Now just watch it.</h1>
   <div class="cu-wave"><svg viewBox="0 0 260 110" aria-hidden="true"><path class="cu-bg" d="${CU_D}"/><path class="cu-fg" id="cu-fg" d="${CU_D}"/><circle class="cu-dot" id="cu-dot" cx="10" cy="96" r="8"/></svg>
    <span class="cu-t" id="cu-t">${left?fmtMS(left):'Watched'}</span></div>
   <p class="sc-p">${line?esc(line)+' ':''}Breathe slowly and follow the dot. You are not trying to make the urge go away.</p>
   <div class="cu-chg" role="group" aria-labelledby="cu-q"><span id="cu-q">Right now it is</span><div class="sc-row">${CU_CHG.map(x=>`<button class="chip" type="button" aria-pressed="${sc.chg===x[0]}" data-act="sc-cu-chg" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
   ${sc.chg?`<p class="sc-p cu-say" aria-live="polite">${esc(CU_SAY[sc.chg])}</p>`:''}
   <button class="btn btn-primary wide go" type="button" data-act="sc-done" data-v="curious">Done</button>`;
 }
 return ciTop('Get curious',back)+`<div class="ci-wrap">${cuProg(sc)}<div class="ci-card${i===4?' dense':''}${anim}">${body}</div>${foot?`<div class="ci-foot">${foot}</div>`:''}</div>`;
};
function cuGo(sc,i,back){
 sc.dir=back?'p':'n';sc.i=i;sc.anim=true;sc.until=Date.now()+350;
 if(i===4)sc.w0=Date.now();
 renderScene('#ci-h');
}
function cuAction(a,t){
 const sc=ui.scene,v=t.dataset.v;
 if(!sc||sc.id!=='curious')return;
 switch(a){
  case 'sc-cu-next':case 'sc-cu-skip':if(ciBusy(sc))return;cuGo(sc,sc.i+1);return;
  case 'sc-cu-back':if(sc.i>0)cuGo(sc,sc.i-1,true);return;
  case 'sc-cu-body':if(ciBusy(sc))return;sc.body=v;vibe(8);cuGo(sc,3);return;
  case 'sc-cu-feel':if(ciBusy(sc))return;sc.feel=v;vibe(8);cuGo(sc,4);return;
  case 'sc-cu-chg':sc.chg=sc.chg===v?null:v;vibe(8);renderScene(fsel('sc-cu-chg',v));return;
 }
}
/* the first SOS screen always fits the phone without scrolling: when the words, your note and the sheet need the room, the sun gets smaller.
   It runs once after each drawing of the screen (the sun is marked once it has been fitted). */
function svFit(){
 const scn=document.querySelector('#scene-root .scene'),sun=document.querySelector('.sv-sun');
 if(!scn||!sun||sun.dataset.fit)return;
 sun.dataset.fit='1';
 let d=sun.offsetWidth,n=0;
 while(scn.scrollHeight>scn.clientHeight+1&&d>84&&n<24){d-=10;n++;sun.style.setProperty('--d',d+'px')}
 /* still too tall on a very small screen: your record steps aside (your note stays) */
 if(scn.scrollHeight>scn.clientHeight+1){const r=document.querySelector('.sv-rec');if(r)r.style.display='none'}
}
/* the moving parts of the tools: the SOS breathing ring, the Get curious wave, and the Move timer. True when it handled the tick. */
function toolTick(sc,now){
 if(sc.id==='urge'&&sc.step==='now')svFit();
 if(sc.id==='urge'&&sc.step==='now'&&!sc.again){
  if(!sc.r0)sc.r0=now;
  const sec=(now-sc.r0)/1000,left=Math.max(0,60-sec);
  breathTick('calm',sec,'br-phase');
  const tm=document.getElementById('br-time');if(tm)tm.textContent=left>0?fmtMS(left*1000):'Keep going';
  const rg=document.getElementById('pz-ring');
  if(rg){const c=parseFloat(rg.dataset.c);rg.style.strokeDashoffset=(c*left/60).toFixed(1)}
  return true;
 }
 if(sc.id==='curious'&&sc.i===4&&sc.w0){
  const p=Math.min(1,(now-sc.w0)/CU_MS),fg=document.getElementById('cu-fg'),dot=document.getElementById('cu-dot');
  if(fg&&dot&&fg.getTotalLength){
   const L=fg.getTotalLength(),pt=fg.getPointAtLength(L*p);
   fg.style.strokeDasharray=L.toFixed(1);fg.style.strokeDashoffset=(L*(1-p)).toFixed(1);
   dot.setAttribute('cx',pt.x.toFixed(1));dot.setAttribute('cy',pt.y.toFixed(1));
  }
  const t=document.getElementById('cu-t');if(t)t.textContent=p<1?fmtMS(sc.w0+CU_MS-now):'Watched';
  return true;
 }
 if(sc.id==='move'&&sc.pick&&!sc.done){
  const left=sc.m0+MOVE_MS-now;
  if(left<=0){sc.done=true;vibe([40,40,40]);if(sndOn())chime();renderScene('#ci-h');return true}
  const tm=document.getElementById('br-time');if(tm)tm.textContent=fmtMS(left);
  const rg=document.getElementById('pz-ring');
  if(rg){const c=parseFloat(rg.dataset.c);rg.style.strokeDashoffset=(c*left/MOVE_MS).toFixed(1)}
  const mins=Math.ceil(left/60000);
  if(mins!==sc.lastMin){sc.lastMin=mins;const lv=document.getElementById('mv-live');if(lv)lv.textContent=mins+(mins===1?' minute':' minutes')+' left'}
  return true;
 }
 return false;
}

/* ---------- go to bed: at night, sleep is often the strongest move. In the daytime it is practice.

const BED=[['phone','Phone charging outside the bedroom','Or across the room, out of reach.'],['alarm','Alarm set','A clock, or the phone across the room.'],['lights','Lights off','Screens off too.']];
function bedPlans(){
 const note=String((Store.settings&&Store.settings.note)||'').trim();
 return [
  ['breath','Slow breathing','In for 4, out for 6. Count to ten, then start again.'],
  ['shuffle','Picture boring things','One at a time, slowly: a spoon, a tree, a door.'],
  note?['note','Say your note','The words you wrote on a calm day.']:['reason','Say one reason','Why you are doing this, in a few words.'],
  ['up','Get up if still awake','After about 20 minutes, read on paper in another room.']
 ];
}
const bedPlanText=id=>{const x=bedPlans().find(y=>y[0]===id);return x?x[1]+'. '+x[2]:''};

  <div class="ob-chs bed-chs">${BED.map(b=>`<button class="ob-ch" type="button" aria-pressed="${tk.indexOf(b[0])>=0}" data-act="sc-bed-tick" data-v="${b[0]}"><span class="bx">${ic('check')}</span><span class="t"><b>${esc(b[1])}</b><small>${esc(b[2])}</small></span></button>`).join('')}</div>

/* ---------- the ticker: updates numbers in place so nothing flickers ---------- */
function sceneTick(){
 const sc=ui.scene;if(!sc){stopSceneTicker();return}
 const now=Date.now();
 if(toolTick(sc,now))return;
 if(sc.id==='pause'){
  const t=loadTimer();
  const mode=pauseMode();
  if(mode!==sc.mode){renderScene(true);if(mode==='done'){vibe([40,40,40]);if(sndOn())chime()}return}
  if(mode!=='run'||!t)return;
  const left=t.start+t.dur-now;
  const tm=document.getElementById('br-time');if(tm)tm.textContent=fmtMS(left);
  const rg=document.getElementById('pz-ring');
  if(rg){const c=parseFloat(rg.dataset.c);rg.style.strokeDashoffset=(c*Math.max(0,left/t.dur)).toFixed(1)}
  const mins=Math.ceil(left/60000);
  if(mins!==sc.lastMin){sc.lastMin=mins;const lv=document.getElementById('pz-live');if(lv)lv.textContent=mins+(mins===1?' minute':' minutes')+' left'}
  const ph=document.getElementById('br-phase');
  if(sc.guide)breathTick('calm',(now-t.start)/1000,'br-phase');
  else if(ph&&ph.textContent!=='Waiting it out'){ph.textContent='Waiting it out'}
 }else if(sc.id==='breathe'&&sc.run&&!sc.done){
  const sec=(now-sc.startedAt)/1000,total=sc.mins*60;
  if(sec>=total){sc.run=false;sc.done=true;confetti(false);vibe(20);if(sc.snd)chime();renderScene('#ci-h');return}
  const tm=document.getElementById('br-time');if(tm)tm.textContent=fmtMS((total-sec)*1000);
  breathTick(sc.pat,sec,'br-phase',sc.snd);
  const mins=Math.ceil((total-sec)/60);
  if(mins!==sc.lastMin){sc.lastMin=mins;const lv=document.getElementById('br-live');if(lv)lv.textContent=mins+(mins===1?' minute':' minutes')+' left'}
 }
}

/* ===== LESSON STANDARD v2 (Oct 14, 2026). Every new or rewritten lesson follows this; v2 lessons carry v:2. =====
   Reader: someone trying to QUIT PORN, not a scientist. Each lesson does three jobs for ONE idea: understand the habit,
   understand the science (plain words), know how to quit (a concrete move).
   Shape: ask (the one question the lesson answers; shown on the cover and again on Done) and key (the answer).
     hook (Quick+Full)   a moment he recognizes; headline IS the question, no answer yet
     predict (Full)      guess first: 4 beliefs people really hold, one right (choose with a) or a guess slider
     answer (Quick+Full) what is going on in the habit, plain words
     proof x1-2 (Full)   the science as a short plain story + so: "What this means for you" (bridge to porn/quitting)
     move (Quick+Full)   what to do, concrete, doable tonight
     check (Quick+Full)  last card: a realistic moment, 4 real moves, ONE best answer (a)
   Then Done (question + "The answer" + private note np), Put it to work (act), Practiced.
   Questions must check or apply this lesson's idea. NO polls ("Tap one", "which is you"), NO study-detail or
   definition questions, NO "not sure / not ready / none" options, NO joke distractors, NO pointers to other lessons.
   Replies open with a verdict, teach in under 40 words, never shame. Answers stay switchable (tap any choice to read its
   comment). Recall (rc, shown in the next lesson) applies the idea to a NEW scenario, with a comment per choice (cr);
   never asks about a study. Claims match sources; limits go in scope ("Behind this").
   Plain words, no jargon in headlines, no contractions, no hedging in card copy. Lint: node lint_lessons.js */
const LESSONS=[
 /* ---------- unit 1: how it works ---------- */

 {id:'l2',u:0,v:2,title:'Urges are waves',tag:'They rise, peak, and pass. You can ride one out.',ic:'wave',mins:3,
  ask:'What do I do when an urge hits?',
  key:'An urge rises, peaks, and passes. You do not have to fight it or obey it. Notice it, breathe, and outlast this one.',

   {k:'choose',e:'predict',el:'Make a guess',h:'If you do not act on an urge, what do you think it does?',ask:'Make your best guess.',a:2,
    c:[['It keeps getting stronger until you give in','That is how it feels from the inside. But urges do not build forever. They rise, peak, and fall, like a wave.'],
       ['It stays the same until you distract yourself','Distraction can help, but the urge changes without it. Left alone, it rises, peaks, and falls on its own.'],
       ['It rises, peaks, and then passes','Good guess. An urge behaves like a wave. If you can outlast the peak, it passes.'],
       ['It only goes away if you fight it hard','Fighting hard keeps your attention on it. You do not have to fight. You only have to wait it out.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'wind'}],
    h:'Ride the urge out. You do not have to fight it or obey it.',
    b:[bP('Psychologist Alan Marlatt called this **urge surfing**: notice the urge, breathe, and watch it rise and fall. The urge may still be strong. What you build is a gap between the urge and what you do next. That gap is the skill.')]},

    h:'Smokers who learned to ride out urges smoked fewer cigarettes.',

    so:'You do not need weaker urges to quit porn. You need a gap between the urge and what you do.',

    h:'When an urge hits, name it, breathe, and give it ten minutes.',

   {k:'choose',q:1,e:'check',el:'Check it',h:'An urge hits hard while you are home alone. What gives you the best chance?',ask:'Pick the best move.',a:0,
    c:[['Name it, breathe slowly, and wait ten minutes','Yes. You are not fighting it or obeying it. You are outlasting it, and that gap is what changes what you do.'],

  ],

   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'moon'}],
    h:'After a night without sleep, the brain’s reward system overreacted.',
    b:[bP('Researchers kept volunteers up all night, then showed them pictures in a brain scanner. Compared with people who had slept, their reward areas reacted more strongly, and they rated more of the pictures as pleasant.')],
    so:'At 1 AM, porn looks better than it is. Sleep turns that back down.',
    fact:{s:'Lab study · 27 adults · Gujar et al., 2011',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['loop',{n:['Feel lonely','Use porn','Feel cut off','Lonelier'],c:'THE LOOP'}],
    h:'The lonelier people were, the more porn they tended to use.',
    b:[bP('In a survey of 1,247 adults, loneliness and porn use rose together. The researchers think it may run both ways: feel lonely, reach for porn, feel more cut off, feel lonelier.')],
    so:'Porn cannot fix loneliness. A real person, even by text, works on the actual need.',
    fact:{s:'Survey · 1,247 adults · Butler et al., 2018',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'phone'}],
    h:'Meet the need under the urge.',
    b:[bP('When an urge hits late, ask yourself: am I tired, lonely, or both? Then deal with that.'),bL(['**Tired:** put the phone on the charger outside the bedroom and go to sleep.','**Lonely:** send one text to a real person. It does not have to be about this.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'It is 12:40 AM. You are in bed, scrolling, and an urge is building. What helps most?',ask:'Pick the best move.',a:0,
    c:[['Put the phone in another room and go to sleep','Yes. You are tired, so the urge looks bigger than it is. Sleep turns it down, and moving the phone is what makes sleep happen.'],
       ['Keep scrolling something safe until it passes','Common, but it keeps you awake with the phone in your hand. That is the setup for the urge. The need under it is sleep.'],
       ['Grit your teeth and hold out as long as you can','You might make it, but you are fighting with your most tired brain. Ending the night ends the fight.'],
       ['Tell yourself one look will not hurt, then stop','That is the tired brain overrating the reward. The need under the urge is sleep, not one look.']]}
  ],
  act:{h:'Fix one thing tonight.',p:'Which sounds more like you right now: worn out, or lonely? Tap the one that fits. If it is both, start with sleep.',mins:2,
   go:[{t:'Tired: set my screens-off time',a:'tab',v:'settings',open:'s-sched',ic:'moon'},{t:'Lonely: message someone',a:'scene',v:'message',ic:'chat'}],ok:'You met the need, not just the urge.'},
  rc:{q:'It is Saturday night. You are home alone, feeling low, and an urge starts. What helps most?',c:['Scroll your phone until the feeling passes','Tell yourself you should be stronger than this','Reach out to someone, even by text','Keep to yourself until the mood lifts'],a:2,r:'Loneliness makes porn look like comfort. A real person meets the actual need, so the urge has less to offer.',
   cr:['Not quite. Scrolling alone keeps you near the trigger and does nothing for the loneliness under it.','Not quite. Lonely is a need, not a weakness. Being hard on yourself does not meet it.','Right. Loneliness makes porn look like comfort. A real person meets the actual need.','Not quite. Pulling away is the loop: lonely, porn, more cut off. A person breaks it.']},
  scope:'The sleep study was small (27 adults) and kept people awake about 32 hours, longer than one late night. The survey shows loneliness and porn use go together; it cannot show which causes which. Together they point at two needs you can do something about.',
  src:[SRC.gujar,SRC.butler]},

 /* ---------- unit 2: shame and kindness ---------- */
 {id:'l5',u:1,v:2,title:'Name the act, not yourself',tag:'After a slip, say what you did. Do not say who you are.',ic:'sliders',mins:3,
  ask:'After a slip, how should I talk to myself?',
  key:'Describe what you did, not who you are: “I slipped last night,” not “I am a failure.” Then protect your next good move.',
  np:'A harsh sentence I say to myself, written as something that happened',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sliders'}],
    h:'After a slip, what do you say to yourself, and does it matter?',
    b:[bP('“I am disgusting.” “I always ruin everything.” Most people have a harsh line ready after a slip. This lesson is about whether that line helps, and what to say instead.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Which kind of self-talk do you think goes with more problems?',ask:'Make your best guess.',a:1,
    c:[['Feeling bad about what you did','That is guilt, and it was mostly unrelated to problems. Guilt points at an action, and you can learn from an action.'],
       ['Feeling bad about who you are','Good guess. That is shame. People more prone to shame had more alcohol and drug problems.'],
       ['Both kinds, about the same','Many people assume so. But the two pulled apart: shame went with more problems, and guilt mostly did not.'],
       ['It does not matter what you say to yourself','It feels private, but it showed up in the results: people more prone to shame had more problems.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'heart'}],
    h:'Describe what you did, not who you are.',
    b:[bP('Guilt says “I did something.” Shame says “I am something.” Guilt looks at what happened, so there is something to repair or do differently. Shame is a verdict on who you are. It tends to push people to hide, and hiding is where the loop starts again.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Prone to shame','More alcohol and drug problems'],i:['heart','chart']}],
    h:'People prone to shame had more alcohol and drug problems. Guilt mostly did not.',
    b:[bP('Researchers measured how prone people were to shame and to guilt, then asked about alcohol and drug problems. People more prone to shame had more problems. People more prone to guilt mostly did not.')],
    so:'Being harsh with yourself does not keep you on track. Naming the act gives you something to fix.',
    fact:{s:'Comparison · students and jail inmates · Dearing et al., 2005',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'pencil'}],
    h:'Swap “I am” for “I did,” then protect your next good move.',
    b:[bL(['**Shame:** “I am a failure.”','**Swap:** “I slipped last night.”','**Next:** do the next good thing anyway: the log, the check-in, one small move within the hour.']),bP('James Clear’s book Atomic Habits puts it this way: every action is a vote for who you are becoming. One slip is one vote, not the verdict.')],
    fact:{s:'Book · James Clear, Atomic Habits',i:[1,2]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You slipped last night. This morning you think, “I am disgusting.” What helps most?',ask:'Pick the best move.',a:3,
    c:[['Agree with it, so you take it seriously','It feels like taking it seriously, but it is shame: a verdict on you. Shame tends to push people to hide, not to change.'],
       ['Push the thought away and forget last night','Ignoring it skips the useful part. Look at what happened, just not at who you are.'],
       ['Promise yourself a perfect week to make up for it','A big promise after a slip is often shame in disguise. One good next move counts for more.'],
       ['Swap it: “I slipped,” then do your check-in','Yes. You name the act, not yourself, and you protect your next good move. That is how one slip stays one slip.']]}
  ],
  act:{h:'Rewrite one harsh sentence.',p:'Think of the harshest thing you have said to yourself this week. Write it again as something that happened, not something you are. Then add one thing you did this week that you are glad about.',note:true,btn:'Save it',mins:2,ok:'That is a kinder, truer sentence.'},
  rc:{q:'After a slip you catch yourself thinking, “I always ruin everything.” What is a better sentence?',
   c:['“I should be ashamed of myself.”','“I slipped last night, and I can do something about it.”','“It does not matter anyway.”','“Next time I will be perfect.”'],a:1,
   r:'Name what you did, not who you are. Then you have something you can fix.',
   cr:['Not quite. That is still a verdict on you. Shame tends to push people to hide.','Right. It names the act, not you, and it leaves room to act.','Not quite. That is the snowball talking. It does matter, and you can do something about it.','Not quite. Perfect is a promise nobody keeps. Name the act and take the next small step.']},
  scope:'The comparison measured shame-proneness, guilt-proneness, and alcohol and drug problems in three groups of mostly college students and jail inmates. It shows a link, not a cause, and it was not about porn. Atomic Habits is a popular book, not a study; its “votes” idea is a helpful way to think, not a tested result.',
  src:[SRC.dearing,SRC.clearvote,SRC.clearmiss]},

 {id:'l6',u:1,v:2,title:'Kindness after a slip',tag:'Being kind to yourself helped people do better, not worse.',ic:'leaf',mins:2,
  ask:'Will being kind to myself after a slip just make me slip more?',
  key:'No. Kindness did not make people give in more. Talk to yourself the way you would to a friend, then do the next small thing.',
  np:'What I would say to a friend, and to myself',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'leaf'}],
    h:'If you go easy on yourself after a slip, will you just do it again?',
    b:[bP('Many people punish themselves after a slip because they fear kindness would let them off the hook. This lesson is about whether that fear is true.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Strict dieters broke their diet, and some then got a kind message. What do you think happened?',ask:'Make your best guess.',a:2,
    c:[['They ate more, since they felt let off the hook','That is the common fear. In this test, it did not happen. The kind message did not lead to more eating.'],
       ['Nothing changed either way','A fair guess, but there was a difference, and it went the hopeful way.'],
       ['They felt less upset, and ate less afterward','Good guess. Among the strictest eaters, the kind message meant less distress and less eating afterward.'],
       ['They stopped caring about the diet','No. Kindness did not make them stop caring. It made it easier to get back on track.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'heart'}],
    h:'No. Being kind to yourself after a slip does not make you slip more.',
    b:[bP('Kind does not mean pretending it did not matter. It means looking at what happened without attacking yourself. That is when you can actually learn from it, and get back to the next good move.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Broke their diet','Heard a kind message','Less distress, less eating'],i:['bolt','heart','chart']}],
    h:'Strict dieters who got a kind message after a slip ate less, not more.',
    b:[bP('College women who were strict about food ate an unhealthy snack. Some were then given a short, kind way to think about it. Among the strictest eaters, those who got the kind message felt less distress and ate less afterward.')],
    so:'Kindness after a slip is not letting yourself off the hook. It helps you get back on track.',
    fact:{s:'Experiment · college women · Adams & Leary, 2007',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'chat'}],
    h:'After a slip, talk to yourself the way you would to a friend.',
    b:[bQ('That was hard. It happened. What do I need now?'),bP('Then do the next small thing: water, air, sleep, a text. Kind and practical beats harsh and stuck.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'A friend tells you they slipped again and feel awful. What would help them most?',ask:'Pick the best answer.',a:1,
    c:[['“You need to try harder.”','Many people grew up with that voice. It sounds tough, but the experiment points the other way: kindness helps people get back on track.'],
       ['“That happens. Thanks for telling me. What do you need?”','Yes. Kind and practical. Now say the same thing to yourself after a slip.'],
       ['“It is no big deal. Forget about it.”','Kind, but it skips the part where they look at what happened. Kindness looks at it, without attacking.'],
       ['“Maybe you should just give up on quitting.”','That is the snowball thought. You would not say it to a friend, so do not say it to yourself.']]}
  ],
  act:{h:'Say it once.',p:'Copy the sentence and keep it where you will see it. Or say it out loud the next time you need it.',mins:1,
   go:[{t:'Copy the sentence',a:'copy',text:'That was hard. It happened. What do I need now?',ic:'copy'}],ok:'That sentence is yours now.'},
  rc:{q:'You slipped tonight. Your first thought is, “I am pathetic. I deserve to feel awful.” What would help most?',
   c:['Let yourself feel awful so you learn','Say, “That was hard. What do I need now?”','Pretend it did not happen','Plan to be harder on yourself tomorrow'],a:1,
   r:'Kindness after a slip helps you get back on track.',
   cr:['Not quite. Punishing yourself feels like learning, but kindness is what helped people get back on track.','Right. Kind and practical. Then do the next small thing.','Not quite. Kind does not mean ignoring it. Look at what happened, without attacking yourself.','Not quite. Harsher is not safer. Kindness after a slip did not make people slip more.']},
  scope:'This was one small experiment about food, with college women who were strict dieters. It tests the fear that kindness leads to giving in, and in this test that fear did not hold. Treat the exact figures lightly; the direction is the point.',
  src:[SRC.adams]},

 {id:'l7',u:1,v:2,title:'Secrets are heavy',tag:'Carrying it alone costs more than it seems.',ic:'lock',mins:3,
  ask:'Why does keeping this to myself feel so heavy?',
  key:'A secret weighs on you every time it comes to mind, not only when you hide it. One safe person can share the weight.',
  np:'Who could be my safe person, and what I would ask of them',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'lock'}],
    h:'Nobody has asked about it today. So why does it still feel heavy?',
    b:[bP('Keeping something private is normal. But carrying it alone, all the time, can wear you down even when nobody is around. This lesson is about where that weight comes from.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'When do you think a secret weighs on people the most?',ask:'Make your best guess.',a:2,
    c:[['When someone might find out','That is what most people expect. But the bigger cost showed up somewhere else: in the quiet moments.'],
       ['Only right after the thing happened','Secrets do not fade that neatly. They come back to mind again and again.'],
       ['When it keeps coming back to mind, even alone','Good guess. Minds went back to secrets far more often than people had to hide them, and that is what weighed on them.'],
       ['Only when you are around other people','Hiding takes effort, but people had to hide their secrets far less often than they thought about them.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'heart'}],
    h:'The weight is in the carrying, not only in the hiding.',
    b:[bP('A secret takes up space every time it comes to mind, and that happens far more often than any conversation where you have to hide it. One safe person can take some of that weight.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'13,000+',s:'secrets studied'}],
    h:'The more a secret came to mind, the lower people’s well-being.',
    b:[bP('Ten studies covering more than 13,000 secrets found that the more often someone’s mind wandered to a secret, the lower their well-being. People thought about their secrets far more often than they had to hide them.')],
    so:'If keeping this to yourself feels heavy, that weight is real. Sharing it with one safe person is a way to set some of it down.',
    fact:{s:'Ten studies · 13,000+ secrets · Slepian et al., 2017',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'sparkle'}],
    h:'Choose one safe person, and decide how much to tell.',
    b:[bP('Telling one person is not telling everyone. You choose who, and how much.'),bL(['Pick someone likely to respond calmly.','One sentence is enough. A text is fine.','Tell them what you need back, like “Just say thanks for telling me.”','If nobody feels safe yet, a counselor or a group is a place to start.'])]},
   {k:'choose',q:1,e:'turn',el:'Your turn',h:'You want to tell someone, but you fear how they will react. Here are four good first steps.',ask:'Which one would you try first? There is no wrong pick here.',
    c:[['Text one calm person a single sentence','Good pick. Low pressure, and you can word it exactly how you want. Example: “Hey, I have something heavy I have been carrying. Can I tell you? No advice needed.”'],
       ['Ask one safe person for a quiet, private moment','Good pick. A walk or a drive can feel easier than sitting face to face. Example: “Can we talk tonight? It is something personal, and it is not an emergency.”'],
       ['Write it out first, then share just one line','Good pick. Getting the words out on paper makes them easier to say. Example: write three sentences for yourself, then send only the first one.'],
       ['Talk to a counselor or join a support group','Good pick if nobody in your life feels safe yet. These are people trained to listen without judging. Example: “I have been struggling with porn and I want help. Can I book a time?”']]}
  ],
  act:{h:'A sentence you can send.',p:'If you decide to tell your safe person, this is one way to say it. Change anything.',b:[bQ(SCRIPTS[4][1])],mins:1,
   go:[{t:'Copy it',a:'copy',text:SCRIPTS[4][1],ic:'copy'},{t:'See all the scripts',a:'help',v:'say',ic:'chat'}],ok:'You have the words ready.'},
  rc:{q:'You have kept this to yourself for years. A friend you trust asks how you are really doing. What is a good move?',
   c:['Say “fine” and change the subject','Share one honest sentence, and say what you need','Tell them every detail right away','Wait until you have it all fixed'],a:1,
   r:'One safe person can share the weight.',
   cr:['Not quite. That keeps you carrying it alone, and the weight comes back every time it crosses your mind.','Right. One safe person, one sentence. You share the weight on your terms.','Not quite. You choose how much to share. One honest sentence is enough to start.','Not quite. Waiting means carrying it alone the whole way. You can share it while you are still working on it.']},
  scope:'These studies covered secrets of every kind, not porn in particular, and they did not test telling someone. What they show is where much of the cost sits: in the carrying. That is the reason to find one safe person.',
  src:[SRC.slepian]},

 {id:'l8',u:1,v:2,title:'Wanting to be loved',tag:'A habit is not a verdict on whether you can love.',ic:'heart',mins:3,
  ask:'Does this habit mean I cannot have a real relationship?',
  key:'No. A habit is something you do, not a verdict on whether you can love. Honesty and closeness are skills you can start practicing now.',
  np:'One small step toward people',
  cards:[
   {k:'text',q:1,e:'hook',el:'The fear under it',art:['icon',{ic:'heart'}],
    h:'Have you worried that this habit means you cannot love, or be loved?',
    b:[bP('Many people carry this fear: that the habit could block a relationship or a marriage, or that they could never love anyone, let alone be loved. That is heavy, and it makes sense that it hurts. It also points at something good: you want to be loved.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think a habit like this says about your ability to love?',ask:'Make your best guess.',a:3,
    c:[['That something in you is broken','That is what shame says. But a habit is something you do, not a measure of who you are or whether you can love.'],
       ['That you will never have a healthy relationship','Nobody can predict that, and a habit does not decide it. Honesty and closeness are skills you can build.'],
       ['That you should stay away from people until you quit','Pulling away feels safer, but loneliness and porn use tend to go together. People are part of the way out.'],
       ['Nothing final. It is a habit, and habits change','Good guess. A habit is something you do. The skills love needs, like honesty and patience, can be practiced now.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sparkle'}],
    h:'A habit is not a verdict on whether you can love.',
    b:[bP('A habit is something you do. Honesty, patience, and asking for what you need are skills, and skills can be practiced. Nobody can promise how a relationship will go, and this app will not pretend to. You can start practicing now.')]},
   {k:'text',e:'proof',el:'What recovery means',art:['icon',{ic:'compass'}],
    h:'A US definition of recovery counts love and community as part of getting better.',
    b:[bP('A US government definition of recovery names four parts of a healthy life. One is **community**: “relationships and social networks that provide support, friendship, love, and hope.”')],
    so:'Wanting love is not a distraction from quitting. It is part of what quitting is for.',
    fact:{s:'Definition · US SAMHSA, working definition of recovery',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['loop',{n:['Feel lonely','Use porn','Feel cut off','Lonelier'],c:'THE LOOP'}],
    h:'Lonelier people tended to use more porn.',
    b:[bP('In a survey of 1,247 adults, loneliness and porn use rose together, and the researchers think it may run both ways. If so, steps toward people work on the habit from the other side.')],
    so:'A text, a call, a group, or a walk with someone is not a side project. It goes after the loneliness that can feed the habit.',
    fact:{s:'Survey · 1,247 adults · Butler et al., 2018',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'chat'}],
    h:'Take one small step toward people this week.',
    b:[bL(['Text someone you trust. It does not have to be about this.','Look at a free group. At a first meeting you can just listen.','Practice one honest sentence with one safe person.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You like someone, but you think, “I am too broken for this.” What is the best move?',ask:'Pick the best move.',a:2,
    c:[['Pull away before they find out about you','Pulling away feels protective, but it feeds the loneliness that can feed the habit. A habit is not a verdict.'],
       ['Wait until you have fully quit to date anyone','You do not have to be finished to practice honesty and closeness. Those skills grow by using them.'],
       ['Stay in it, go slow, and practice being honest','Yes. A habit is something you do, not who you are. Honesty and patience are skills you can practice now.'],
       ['Count on the relationship to stop the habit','A partner cannot carry this for you. The relationship can grow alongside your own work on the habit.']]}
  ],
  act:{h:'One small step toward people.',p:'Pick the smallest one.',mins:2,
   go:[{t:'Reach a person',a:'scene',v:'message',ic:'chat'},{t:'Look at free groups',a:'help',v:'groups',ic:'dots'},{t:'Read my reasons',a:'sheet',v:'reasons',ic:'star'}],ok:'That is a real step toward people.'},
  rc:{q:'You catch yourself thinking, “Someone with this habit does not deserve love.” What is closer to the truth?',
   c:['A habit is something you do, not a verdict on you','You need to earn love by quitting first','People with this habit cannot be close to anyone','Love should wait until life is in order'],a:0,
   r:'A habit is something you do, not a verdict on whether you can love.',
   cr:['Right. Wanting love is not the problem, and honesty and closeness are skills you can practice now.','Not quite. You do not have to finish first. The skills love needs can be practiced along the way.','Not quite. That is shame talking. A habit does not decide whether you can be close to someone.','Not quite. Nobody gets a perfect life first. People build closeness while they are still working on things.']},
  scope:'The recovery definition comes from a US government agency and covers recovery in general. The loneliness survey shows a link, not a cause. Neither can promise how a relationship will go, and this lesson does not either. They support one point: wanting love belongs to getting better, and the skills can be practiced now.',
  src:[SRC.samhsa,SRC.butler]},

 /* ---------- unit 3: making a plan ---------- */
 {id:'l9',u:2,v:2,title:'If this, then that',tag:'Decide now, so you do not have to decide at 1 AM.',ic:'plug',mins:2,
  ask:'How do I make a good choice when the urge hits late at night?',
  key:'Decide ahead of time with an if-then plan: “If this happens, then I will do that.” At 1 AM you only have to follow it.',
  np:'My strongest if-then',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'moon'}],
    h:'Why is it so hard to make a good choice at 1 AM, even when you meant to?',
    b:[bP('At 8 PM you know what you want. At 1 AM you are tired, the urge is loud, and the decision feels brand new. This lesson is about not having to decide then.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think helps people follow through on a goal the most?',ask:'Make your best guess.',a:2,
    c:[['Wanting it badly enough','Wanting it matters, but plenty of people want a goal and still do not follow through. Planning the moment made the difference.'],
       ['Setting a big, clear goal','A clear goal helps, but people who only set the goal followed through less than people who also planned the moment.'],
       ['Planning exactly what to do when the hard moment comes','Good guess. People who made if-then plans followed through on their goals more than people who only set the goal.'],
       ['Reminding yourself how bad you feel after','Guilt reminders feel motivating, but they do not tell you what to do in the moment. A plan does.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['chain',{n:['If I reach for my phone in bed','Then I get up and drink water'],i:['phone','check']}],
    h:'Decide ahead of time, with an if-then plan.',
    b:[bP('An **if-then plan** moves the decision to a calm moment: “If I am in bed and reach for my phone, then I get up and get a glass of water.” When the moment comes, you are not deciding. You are following the plan you already made.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'People who made if-then plans followed through more.',
    b:[bP('A large review by Gollwitzer and Sheeran pulled together results from many studies, on many kinds of goals. People who made if-then plans followed through on their goals more than people who only set the goal.')],
    so:'Writing your hardest moment as an if-then line gives you a better shot at following through when it comes.',
    fact:{s:'Meta-analysis · many kinds of goals · Gollwitzer & Sheeran, 2006',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'shield'}],
    h:'Write one if-then for your hardest moment.',
    b:[bL(['**Specific:** “If I am in bed and reach for my phone…”','**Small:** “…then I stand up and get a glass of water.”','**Easy:** something you can do even when you are tired.']),bP('Make the “then” so small you could do it half asleep.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Which if-then plan is most likely to work at 1 AM?',ask:'Pick the best plan.',a:1,
    c:[['“If I feel an urge, then I will be strong.”','Being strong is a wish, not an action. A good “then” is a specific thing you can do half asleep.'],
       ['“If I reach for my phone in bed, then I get up for water.”','Yes. Specific, small, and easy. At 1 AM you only have to follow it.'],
       ['“If I slip, then I will quit for good next month.”','That plans for after the slip, not the moment before it. Aim the plan at the hard moment itself.'],
       ['“I will just stay away from porn from now on.”','That is a goal, not a plan. It does not say what to do when the urge hits.']]}
  ],
  act:{h:'Fill in one “if.”',p:'Open your urge plan and change one line so it sounds like you.',mins:2,
   go:[{t:'Open my urge plan',a:'sheet',v:'urge',ic:'shield'}],ok:'Your if-then is ready.'},
  rc:{q:'You keep slipping on Sunday evenings when you are bored. What is the best plan?',
   c:['Promise yourself next Sunday will be different','Decide: “If it is Sunday at 7, I go for a walk”','Wait and see how you feel on Sunday','Stay off your phone all weekend, no matter what'],a:1,
   r:'Decide ahead of time with an if-then plan.',
   cr:['Not quite. A promise is a wish. A plan says exactly what you will do in the moment.','Right. Specific, small, and decided ahead of time. On Sunday you only have to follow it.','Not quite. Deciding in the moment is the hard way. Decide now, while you are calm.','Not quite. That is big and hard to keep. One small if-then for the hard hour works better.']},
  scope:'The review covered many kinds of goals, not this one in particular. What carries over is the mechanism: deciding ahead of time takes the decision out of the hard moment.',
  src:[SRC.gollwitzer]},

 {id:'l10',u:2,v:2,title:'Change the setting',tag:'Habits live in places. Move the cue.',ic:'phone',mins:2,
  ask:'Why does the urge keep showing up in the same places and times?',
  key:'Habits lean on their setting: the room, the device, the hour. Change the setting, and the cue gets weaker.',
  np:'The first setting I will change',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'phone'}],
    h:'Why does the urge seem to wait for the same room, the same hour, the same phone?',
    b:[bP('For many people it is the bed, late, phone in hand. Same scene, same urge. This lesson is about why the setting matters so much, and how to use that.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Students moved to a new university. What do you think happened to their old habits?',ask:'Make your best guess.',a:3,
    c:[['They stayed exactly the same','Where the new place was similar, habits did carry on. But where the setting changed a lot, the old habits broke.'],
       ['They changed only for students with willpower','The study looked at the setting, not willpower. Where the setting changed a lot, the old habits were disrupted.'],
       ['They got stronger from the stress of moving','A fair worry, but habits tied to the old setting were disrupted when the setting changed a lot.'],
       ['They broke where the new setting was very different','Good guess. When the setting changed a lot, habits were disrupted, and what students did followed their intentions more.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'compass'}],
    h:'Habits lean on their setting. Change the setting, and the habit loosens.',
    b:[bP('Strong habits are tied to places and moments: the room, the hour, the device, the mood. When the setting stays the same, a habit keeps running on autopilot. When it changes, the cue gets weaker, and your own intentions get more say.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['A new setting','The old habit breaks','Choices follow intentions'],i:['compass','bolt','star']}],
    h:'When students’ surroundings changed a lot, their old habits broke.',
    b:[bP('Students who transferred to a new university were tracked on everyday habits. When the new setting was similar, habits carried on. When it changed a lot, habits were disrupted, and what students did followed their intentions more.')],
    so:'You do not have to move cities. Changing the small setting around your hardest hour can weaken the cue.',
    fact:{s:'Study · students who transferred · Wood, Tam & Witt, 2005',i:[0]}},
   {k:'text',e:'proof',el:'Health guidance',art:['icon',{ic:'moon'}],
    h:'Health guidance says keep a regular bedtime and put screens away before bed.',
    b:[bP('The CDC suggests the same bedtime and wake time every day, and turning devices off at least 30 minutes before bed.')],
    so:'A fixed screens-off time changes the setting of your hardest hour before it arrives.',
    fact:{s:'Guidance · US CDC, about sleep',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'wind'}],
    h:'Change one small thing about your hardest setting tonight.',
    b:[bL(['Charge the phone outside the bedroom. A cheap alarm clock solves the alarm problem.','Add friction: a filter on every device, logged-out accounts, no saved links.','Change your hard hour: another room, another seat, a walk.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Most of your slips happen in bed, late, on your phone. Which change does the most?',ask:'Pick the best move.',a:0,
    c:[['Charge the phone outside the bedroom at night','Yes. That changes the exact setting the habit leans on. No phone in bed means the cue is gone.'],
       ['Promise yourself to be stronger tonight','Promises leave the setting the same, and the setting is what keeps the habit running.'],
       ['Delete one app, but keep the phone by the bed','Some friction helps, but the phone in bed is the main cue. Move the phone, not just one app.'],
       ['Stay up later so you are too tired to bother','Being more tired makes urges look bigger, not smaller. Change where the phone sleeps instead.']]}
  ],
  act:{h:'Set up the night.',p:'Open the phone and night setup, or set your screens-off time.',mins:2,
   go:[{t:'Phone and night setup',a:'help',v:'phone',sub:'night',ic:'phone'},{t:'Set my screens-off time',a:'tab',v:'settings',open:'s-sched',ic:'moon'}],ok:'Your night has a better setting.'},
  rc:{q:'You notice you only slip when you are alone at your desk after midnight. What is the smartest move?',
   c:['Try harder to resist at your desk','Log off and leave the desk by 11 each night','Only use the computer when you feel strong','Keep a tally of every slip at the desk'],a:1,
   r:'Change the setting, and the cue gets weaker.',
   cr:['Not quite. Resisting in the same setting is the hard way. Change the setting so the cue weakens.','Right. The habit leans on that setting. Change it, and the cue gets weaker.','Not quite. Feelings change by the hour. A fixed change to the setting does not depend on them.','Not quite. Tracking helps you see it, but changing the setting is what weakens the cue.']},
  scope:'The study tracked everyday habits like exercising and watching TV, not porn. What carries over is the mechanism: a habit leans on its setting, so changing the setting weakens the cue. The CDC advice is general sleep guidance.',
  src:[SRC.wood,SRC.cdc]},

 {id:'l11',u:2,v:2,title:'What to call it, and who can help',tag:'No single label fits everyone. Help does not depend on one.',ic:'compass',mins:3,
  ask:'Do I need a label like “addiction” to get help?',
  key:'No. You can use your own words. What counts is what it does to your life, and help is there whatever you call it.',
  np:'The first kind of help I will look into',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'compass'}],
    h:'Is it an addiction, a habit, or something else, and does the name matter?',
    b:[bP('You will hear “porn addiction,” “compulsive use,” and “problematic use.” This lesson is about whether you need to pick the right one before you get help.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think matters most when deciding whether to get help?',ask:'Make your best guess.',a:2,
    c:[['Whether a doctor calls it an addiction','A label can help some people, but experts still debate the name. You do not need one to get help.'],
       ['Whether it is as bad as other people’s','Comparing does not help. What counts is what it does to your life, and whether you want something different.'],
       ['What it does to your life, and whether you want change','Good guess. Sleep, focus, time, relationships, how you feel about yourself: those are the measures that count.'],
       ['Whether you can stop for a week on your own','A week does not settle it either way. What counts is the effect on your life, and what you want.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sparkle'}],
    h:'No. Use your own words. What counts is what it does to your life.',
    b:[bP('Your sleep, focus, time, relationships, and how you feel about yourself are the measures that count, along with whether you want something different. “Problematic” or “compulsive” use is a fair, neutral way to say it. Help does not wait for a label.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'book'}],
    h:'The World Health Organization describes lost control over sexual urges, with real costs.',
    b:[bP('The WHO’s list of conditions includes **compulsive sexual behaviour disorder**: a long-lasting pattern of failing to control intense, repeated sexual urges, with marked distress or real problems in life. It is not specifically about porn.')],
    so:'Lost control with real costs is recognized as something worth getting help for, whatever you call it.',
    fact:{s:'Classification · WHO ICD-11, 6C72',i:[1]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'flag'}],
    h:'The main US psychiatric manual does not list porn addiction. Experts still debate the name.',
    b:[bP('A related idea, hypersexual disorder, was considered for the DSM-5 and left out because the evidence was not strong enough. The debate is about what to call it and how to define it.')],
    so:'The name is still being argued about. The skills and support that help do not wait for it.',
    fact:{s:'Overview · EBSCO Research Starters',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'heart'}],
    h:'Pick one kind of help to look into, whatever you call it.',
    b:[bL(['**A therapist:** there are free and low-cost routes, like an employee assistance program (EAP) at work, Open Path, and community health centers.','**A group:** free, and the first time you can just listen.','**A person you trust:** one honest sentence is a start.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You are not sure if what you have is “addiction.” What is the best next step?',ask:'Pick the best move.',a:3,
    c:[['Wait until a doctor tells you what it is','You do not need a label first. If it is costing you sleep, focus, or peace of mind, help fits now.'],
       ['Find the exact right label before doing anything','Experts still debate the names. Help does not depend on picking the right one.'],
       ['Decide it is not that bad, so skip help','Not needing a label does not mean it does not matter. What counts is what it does to your life.'],
       ['Look into one kind of help, in your own words','Yes. Your words are fine. What counts is what it does to your life, and help is there whatever you call it.']]}
  ],
  act:{h:'Look at one option.',p:'Pick one page. Reading is enough for today.',mins:2,
   go:[{t:'Therapy on a small budget',a:'help',v:'therapy',sub:'start',ic:'heart'},{t:'Free groups',a:'help',v:'groups',ic:'dots'},{t:'What to say',a:'help',v:'say',ic:'chat'}],ok:'You looked at a real option.'},
  rc:{q:'A friend says, “I do not think I am an addict, so groups and therapy are not for me.” What is true?',
   c:['Help is only for people with an addiction','Help fits if it is costing them, whatever they call it','They need a diagnosis before doing anything','They should wait until it gets worse'],a:1,
   r:'Help does not depend on a label.',
   cr:['Not quite. Help does not depend on a label. What counts is what it does to your life.','Right. Their own words are fine. If it costs them sleep, time, or peace of mind, help fits.','Not quite. A diagnosis is not needed to start. Groups are open to anyone who wants to change.','Not quite. You do not need a crisis to get help. If it is costing them now, that is enough.']},
  scope:'The DSM and ICD-11 are classification systems, not treatment guides, and researchers still debate where this fits. Only a licensed professional can say what applies to you. None of that changes what you can do today.',
  src:[SRC.ebsco,SRC.icd]},

 {id:'l12',u:2,v:2,title:'What getting better looks like',tag:'Not a straight line. Not perfect. Real.',ic:'sunrise',mins:2,
  ask:'What does getting better actually look like?',
  key:'Getting better is growth with setbacks, across a whole life: health, home, purpose, and people. A streak is one part, not the whole picture.',
  np:'What getting better would look like for me in a month',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sunrise'}],
    h:'If you slip after a good stretch, does that mean you are back at zero?',
    b:[bP('Many people picture quitting as a straight line: a streak that grows until it is done. When a setback comes, it feels like failure. This lesson is about what getting better really looks like.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think getting better usually looks like?',ask:'Make your best guess.',a:1,
    c:[['A straight line: once you stop, you stay stopped','That is the picture most people start with. Real recovery is usually less tidy than that.'],
       ['Growth over time, sometimes with setbacks','Good guess. A US health agency describes recovery as “non-linear,” with growth that “may involve setbacks.”'],
       ['Starting over every time you slip','Setbacks do not erase what you have built. Growth keeps adding up, even with a slip along the way.'],
       ['A number that hits zero and stays there','A streak can be one part of it, but recovery is about a whole life getting better, not one number.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'chart'}],
    h:'Getting better is growth over time, with setbacks, across your whole life.',
    b:[bP('It is not a straight line, and it is not one number. It looks like better sleep, a steadier home, things that matter to you, and people around you. Setbacks can be part of it without undoing it.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'sunrise'}],
    h:'A US health agency calls recovery “non-linear,” with growth that “may involve setbacks.”',
    b:[bP('Its working definition describes recovery as “non-linear, characterized by continual growth and improved functioning that may involve setbacks.”')],
    so:'A setback does not mean you failed. It can be part of getting better, and it does not erase what you have built.',
    fact:{s:'Definition · US SAMHSA, working definition of recovery',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Health','Home','Purpose','Community'],i:['bolt','compass','flag','heart']}],
    h:'The same definition names four parts of a life that holds.',
    b:[bP('**Health:** healthy choices for body and mind. **Home:** “a stable and safe place to live.” **Purpose:** “meaningful daily activities.” **Community:** “relationships and social networks that provide support, friendship, love, and hope.”')],
    so:'A streak is one part of the picture. Building these four is building the life you are quitting for.',
    fact:{s:'Definition · US SAMHSA, working definition of recovery',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'sparkle'}],
    h:'Measure progress by more than a streak.',
    b:[bP('Count these as real progress:'),bL(['An honest log, even after a slip.','An urge ridden out.','A night with the phone outside the bedroom.','A text to a real person.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You were clean for three weeks, then slipped. What is the most accurate way to see it?',ask:'Pick the best answer.',a:2,
    c:[['You are back at day zero, so nothing counted','That is the straight-line picture. The three weeks still happened, and so did what you learned.'],
       ['Three good weeks, so you were never serious','That is the snowball thought. A setback is part of the process, not a verdict.'],
       ['A setback inside real growth. Keep going','Yes. Getting better is non-linear. Setbacks can be part of it, and the growth you built still counts.'],
       ['A sign to wait until you can be perfect','Perfect is not the bar. Growth with setbacks is what recovery looks like.']]}
  ],
  act:{h:'Look back, then forward.',p:'See how far your flame has come. Then pick one thing to do this week.',mins:2,
   go:[{t:'See how my flame grows',a:'growth',ic:'sparkle'},{t:'Open this week’s review',a:'week',ic:'calendar'}],ok:'You looked back, and you know your next step.'},
  rc:{q:'After a great month, you have a hard week with two slips. How should you read it?',
   c:['The month did not count','A setback inside real progress','Proof that nothing works for you','A reason to start everything from scratch'],a:1,
   r:'Getting better is non-linear: growth that may include setbacks.',
   cr:['Not quite. The month happened, and so did what you learned. Setbacks do not erase growth.','Right. Getting better is not a straight line. Keep going.','Not quite. That is the snowball thought. Two slips are two events, not a verdict.','Not quite. Nothing needs resetting. Growth with setbacks is what recovery looks like.']},
  scope:'The quotes come from SAMHSA’s working definition of recovery, which covers substance use and mental health in general. It describes what getting better means, not a prediction for any one person.',
  src:[SRC.samhsa]},

 /* ---------- unit 4: skills for the moment ---------- */
 {id:'l13',u:3,v:2,title:'Name the feeling',tag:'Putting a word on it can turn the volume down.',ic:'pencil',mins:3,
  ask:'What is going on underneath an urge?',
  key:'Urges often ride in on a feeling. Name it in a word or two, and it loses some of its grip. Then meet that feeling another way.',
  np:'The feeling I most often skip past',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'pencil'}],
    h:'What were you feeling right before your last urge?',
    b:[bP('Stress, boredom, loneliness, a sting of failure. Urges often ride in on a feeling, and most people never stop to name it. This lesson is about why naming it helps.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'People looked at upsetting faces, and some put the emotion into a word. What did that do?',ask:'Make your best guess.',a:0,
    c:[['It calmed the brain’s alarm response','Good guess. When people named the emotion, activity in the brain’s alarm center was lower.'],
       ['It made the feeling stronger','That is a common fear, that naming a feeling feeds it. In this study, naming it went with a quieter alarm.'],
       ['It made no difference at all','There was a difference. Naming the emotion went with less activity in the brain’s alarm center.'],
       ['It only helped people trained in therapy','These were ordinary adults, not therapists. A word or two was enough.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sparkle'}],
    h:'Name the feeling in a word or two, and it loses some of its grip.',
    b:[bP('An urge is often a feeling looking for relief. Naming it, “I notice I feel wound up,” makes a little space between the feeling and what you do next. Then you can meet that feeling another way.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Put the emotion into a word','The alarm center quiets'],i:['pencil','wind']}],
    h:'Putting a feeling into words quieted the brain’s alarm center.',
    b:[bP('In a brain-scan study, 30 adults looked at faces showing strong emotions. When they put the emotion into a word, activity in the amygdala, the brain’s alarm center, was lower, and a part at the front of the brain was more active.')],
    so:'Naming what you feel takes a little of the charge out of it, so the next choice is easier.',
    fact:{s:'Brain-scan study · 30 adults · Lieberman et al., 2007',i:[0,1]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'Bad moods like stress, anger, and boredom came before the most relapses.',
    b:[bP('In relapse research on alcohol and other drugs, negative moods like anger, anxiety, and boredom were tied to the most relapses. Catching the feeling is the first move, and it is a skill you can train.')],
    so:'If you know which feeling comes before your urges, you know where to aim.',
    fact:{s:'Relapse model · Larimer, Palmer & Marlatt, 1999',i:[2]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'chat'}],
    h:'When an urge starts, say “I notice I feel ___.”',
    b:[bL(['**Wound up:** stressed, anxious, tense','**Low:** sad, empty, tired','**Stung:** ashamed, rejected, left out','**Alone:** lonely, cut off','**Stuck:** bored, numb']),bP('A rough guess is fine. Then meet the feeling: a walk for stress, a call for lonely, sleep for tired.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You get home from a rough day and an urge starts. What is the best first move?',ask:'Pick the best move.',a:2,
    c:[['Ignore how you feel and push through it','Pushing past the feeling leaves it running the show. Naming it takes some of its grip away.'],
       ['Give in, since the day was bad anyway','That is the bad day talking. The urge is often the feeling looking for relief, and there are other ways to meet it.'],
       ['Name it: “I notice I feel wound up.”','Yes. Naming the feeling makes a little space. Then meet it another way: a walk, a shower, a call.'],
       ['Scroll until the feeling goes away','Scrolling keeps the trigger in your hand. Name the feeling first, then pick something away from the screen.']]}
  ],
  act:{h:'Try it on a real feeling.',p:'The Curious tool asks where a feeling sits in your body and what to call it. It takes about two minutes. The HALT check asks whether you are hungry, angry, lonely, or tired.',mins:2,
   go:[{t:'Try the Curious tool',a:'scene',v:'curious',ic:'sparkle'},{t:'Do a HALT check',a:'scene',v:'halt',ic:'dots'}],ok:'You named a real feeling.'},
  rc:{q:'You notice an urge right after an argument with someone. What is the best first move?',
   c:['Ask yourself why you are so weak','Name it: “I notice I feel angry and stung.”','Distract yourself on your phone','Decide the argument was all your fault'],a:1,
   r:'Name the feeling, and it loses some of its grip.',
   cr:['Not quite. That is a verdict, not a name for the feeling. Name the feeling instead.','Right. Naming the feeling loosens its grip. Then meet it another way, like a walk.','Not quite. Phone time keeps the trigger close. Name the feeling first.','Not quite. Blame piles on. Naming what you feel is the first move.']},
  scope:'The brain-scan study used pictures of faces, not urges, and the lead researcher described the effect as modest. The relapse research was about alcohol and other drugs. Together they point the same way: a named feeling takes some of the charge out of the next decision.',
  src:[SRC.lieberman,SRC.ucla,SRC.larimer]},

 {id:'l14',u:3,v:2,title:'A longer breath out',tag:'A cheap, quick tool for the wave.',ic:'wind',mins:3,
  ask:'Is there a quick way to calm my body when an urge hits?',
  key:'Yes. A slow breath with a long breath out takes a minute and costs nothing. Practice it when calm, and use it at the first pull of an urge.',
  np:'When I will try a long breath out',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'wind'}],
    h:'When an urge hits, your heart speeds up and your chest gets tight. Can you change that?',
    b:[bP('An urge is partly a body event. Breathing is one of the few body things you can change on purpose. This lesson is about a simple way to do it.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Adults practiced breathing or meditation for 5 minutes a day. What lifted their mood most?',ask:'Make your best guess.',a:3,
    c:[['Mindfulness meditation','It helped, but the breathing patterns did better on good mood, and one of them did best.'],
       ['Box breathing, with equal counts','It helped too. The pattern with the extra-long breath out did best on good mood.'],
       ['Fast, deep breathing with breath holds','It helped mood too, but the pattern with a long breath out did best.'],
       ['A double breath in, then a long breath out','Good guess. That pattern, called cyclic sighing, gave the biggest lift in good mood.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'timer'}],
    h:'Yes. A long, slow breath out is something you can do anywhere, in a minute.',
    b:[bP('Breathe in through your nose, sip in a little more air, then breathe out slowly through your mouth, longer than the breath in. It is a way to settle your body while the urge rises and falls.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'108',s:'adults, 5 minutes a day for 28 days'}],
    h:'Five minutes a day lifted mood, and the long breath out lifted it most.',
    b:[bP('Researchers asked 108 adults to practice one of three breathing patterns or mindfulness meditation, 5 minutes a day for a month. Anxiety and bad mood fell for all of them. The biggest gain in good mood came from **cyclic sighing**: two breaths in, one long breath out.')],
    so:'A minute of long breaths out is a cheap, quick tool for getting through the wave.',
    fact:{s:'Randomized study · 108 adults · Balban et al., 2023',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'moon'}],
    h:'Practice the sigh breath when it is quiet, so you can find it when it is loud.',
    b:[bL(['Breathe in through your nose.','Without breathing out, sip in a little more air.','Breathe out slowly through your mouth, longer than the breath in.','Repeat for about a minute. If you feel dizzy, stop and breathe normally.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'An urge starts while you are lying in bed. How should you use the long breath out?',ask:'Pick the best move.',a:1,
    c:[['Save it for when the urge is at its worst','It works best early, while the wave is still small. Use it at the first pull.'],
       ['Do a minute of long breaths out, then get up','Yes. Settle your body first, then change the setting. The breath buys you the gap.'],
       ['Breathe fast to burn off the energy','The part that settles you is the slow, long breath out, not speed.'],
       ['Skip it, since breathing cannot stop an urge','It does not have to stop the urge. It helps you ride it out, and that is the goal.']]}
  ],
  act:{h:'Try one minute now.',p:'One minute. The circle shows the timing: in, in again a little, then a long way out.',mins:1,
   go:[{t:'Start the Sigh breath',a:'scene',v:'breathe',o:{pat:'sigh',mins:1},ic:'wind'}],ok:'You have felt it work.'},
  rc:{q:'You feel the first pull of an urge at your desk. You have one minute. What is the best use of it?',
   c:['Breathe in twice, then breathe out slowly','Hold your breath until it passes','Tell yourself to calm down','Check your phone to take your mind off it'],a:0,
   r:'A long breath out is a quick tool for the wave.',
   cr:['Right. The long breath out helps you settle while the wave passes.','Not quite. The part that settles you is the slow, long breath out, not holding it in.','Not quite. That is hard to follow on command. The breath gives your body a way to do it.','Not quite. The phone keeps the trigger in your hand. Breathe first.']},
  scope:'The study measured everyday mood, not urges, and not porn. People rated their own mood and practiced at home, and resting heart rate and sleep did not change. It is a cheap, quick tool for the wave, not a cure.',
  src:[SRC.balban]},

 {id:'l15',u:3,v:2,title:'Move your body',tag:'A short burst of movement eases cravings.',ic:'bolt',mins:2,
  ask:'Can moving my body really help with an urge?',
  key:'Yes. A short burst of movement eases cravings for a while. When an urge starts, move first, then decide.',
  np:'The movement I could do in one minute',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'bolt'}],
    h:'When an urge hits, could a few minutes of moving actually make it weaker?',
    b:[bP('Waiting out an urge is easier said than done, especially sitting still. This lesson is about whether your body can help.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'People craving a cigarette did a short bout of exercise. What do you think happened?',ask:'Make your best guess.',a:1,
    c:[['Nothing. Cravings are all in the mind','Cravings live in the body too. A short bout of exercise eased them.'],
       ['Their cravings got weaker for a while','Good guess. A review of studies found short bouts of exercise eased cravings in the short term.'],
       ['Their cravings got stronger from the effort','A fair guess, but it went the other way. Cravings got weaker after exercise.'],
       ['It only helped people who were already fit','Short, simple bouts of exercise eased cravings. You do not need a workout plan.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'timer'}],
    h:'Yes. A short burst of movement eases a craving for a while.',
    b:[bP('Waiting is easier when your body is doing something. Walk outside, do push-ups or squats, take the stairs, or stretch and shake it out. Move first, then decide.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['A short bout of exercise','Weaker cravings'],i:['bolt','chart']}],
    h:'Short bouts of exercise eased cigarette cravings.',
    b:[bP('A review pooled studies of people who had gone without cigarettes for a short time. Those who did a short bout of exercise reported weaker cravings than those who did not. The authors called the evidence strong that exercise eases cravings in the short term.')],
    so:'Your body can help you ride out an urge. A few minutes of moving makes the wave easier to wait out.',
    fact:{s:'Systematic review · Haasova et al., 2013',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'plug'}],
    h:'Pick one move you would do even when you are tired.',
    b:[bL(['**Walk:** out of the room, even one lap of the block.','**Ten of something:** push-ups, squats, stairs.','**Shake it out:** shoulders, jaw, hands, thirty seconds.','**Smallest version:** stand up and walk to a different room.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'An urge starts late at night while you are on the couch. What is the best move?',ask:'Pick the best move.',a:3,
    c:[['Stay put and wait until it is gone','Waiting can work, but it is easier when your body is doing something. Move first.'],
       ['Plan a long workout for tomorrow','Tomorrow does not help right now. A short burst now is what eases the craving.'],
       ['Watch something to keep your mind busy','Screen time keeps you close to the trigger. Moving your body works on the craving itself.'],
       ['Get up and do ten squats or walk a lap','Yes. A short burst of movement eases the craving and gets you off the couch. Then decide.']]}
  ],
  act:{h:'Choose your move.',p:'Add one movement to your calm-move list, or let Daybook pick one for you right now.',mins:1,
   go:[{t:'Open my calm moves',a:'tab',v:'settings',open:'s-lists',ic:'sliders'},{t:'Surprise me',a:'scene',v:'surprise',ic:'dice'}],ok:'You have a move ready.'},
  rc:{q:'You are home alone and an urge is building. You do not feel like doing anything. What helps most?',
   c:['Wait until you feel like moving','A few minutes of brisk walking or stretching','Lie on the bed and scroll','Tell yourself moving is pointless'],a:1,
   r:'Move first, then decide.',
   cr:['Not quite. You do not have to feel like it first. Start small and let the moving do its work.','Right. A short burst of movement eases the craving for a while. Then decide.','Not quite. Bed and phone are the setup for the urge. Get up and move instead.','Not quite. Short bursts of exercise eased cravings. It is worth two minutes.']},
  scope:'The studies were about cigarette cravings, and the easing was short-term, so use movement as a way through the wave, not as a permanent fix. It is easy to test on yourself: move for a few minutes and notice what the urge does.',
  src:[SRC.haasova]},

 {id:'l16',u:3,v:2,title:'Thoughts are not orders',tag:'You can have the thought and still choose.',ic:'sparkle',mins:3,
  ask:'What do I do with thoughts like “just once” or “I deserve it”?',
  key:'They are thoughts, not orders. Notice them, name them, and still choose. You do not have to argue with them or obey them.',
  np:'The thought that shows up first for me',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sparkle'}],
    h:'When “just once” shows up, do you feel you have to argue with it or give in?',
    b:[bP('“I deserve it.” “No one will know.” “I will stop tomorrow.” These thoughts can feel like orders. This lesson is about a third option.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Men tried a therapy built on noticing urges and thoughts, not fighting them. What happened?',ask:'Make your best guess.',a:2,
    c:[['Viewing went up, since they stopped fighting','That is the common worry. It went the other way: viewing dropped a lot.'],
       ['Not much changed for most of them','There was a big change. Viewing fell by about 93% on average.'],
