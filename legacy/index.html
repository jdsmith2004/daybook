  scope:'The shame and guilt study was about alcohol and drugs, and the secrets studies covered many kinds of secrets and did not test telling someone. The 12-step wording comes from AA’s own materials. Daybook does not speak for any church or group.',
  src:[SRC.dearing,SRC.slepian,SRC.grubbs,SRC.aa12]},

 {id:'l32',u:7,v:2,f:1,care:1,chk:'October 13, 2026',title:'Forgiveness and a fresh start',tag:'After a slip: asking, forgiving, and making things right with care.',ic:'leaf',mins:3,
  ask:'After a slip, how do I forgive myself without excusing it?',
  key:'Forgiving yourself is not excusing it. It is how you get back to the next right step. Make amends carefully, and not alone.',
  np:'What I want to say to God, and to myself, after a slip',
  cards:[

/* ---------- helpers ---------- */
const lessonById=id=>LESSONS.find(l=>l.id===id)||null;
const lessonIndex=L=>LESSONS.indexOf(L);
function lessonsDone(days){
 const set=new Set(),all=days||Store.days;
 Object.keys(all).forEach(k=>{const p=all[k]&&all[k].p;if(p&&p.ls)p.ls.forEach(id=>{if(LESSON_IDS.indexOf(id)>=0)set.add(id)})});
 return set;
}
/* The order lessons are offered in. Lessons go in number order, and the faith lessons (marked f, the last unit) come last. The person can choose to have
   them first, or mixed in after every two others (settings.learn.faith). Any lesson can still be opened at any time from Learn > Lessons. */
function lessonPath(mode){
 const m=FAITH_MODES.indexOf(mode)>=0?mode:((Store.settings&&Store.settings.learn&&Store.settings.learn.faith)||'after');
 const base=LESSONS.filter(L=>!L.f),faith=LESSONS.filter(L=>L.f);
 if(!faith.length)return LESSONS.slice();
 if(m==='first')return faith.concat(base);
 if(m==='after')return base.concat(faith);
 const out=[];let j=0;
 base.forEach((L,i)=>{out.push(L);if((i+1)%2===0&&j<faith.length)out.push(faith[j++])});
 while(j<faith.length)out.push(faith[j++]);
 return out;
}
const firstUndone=done=>lessonPath().find(l=>!done.has(l.id))||null;
/* the next lesson to offer after this one: the next unfinished one in the daily order, wrapping around to the start */
function nextAfter(L,done){
 const path=lessonPath(),i=path.indexOf(L),rest=path.slice(i+1).concat(path.slice(0,Math.max(0,i)));
 return rest.find(x=>x!==L&&!done.has(x.id))||null;
}
/* when each lesson was first finished, when it was last opened, how many days it was read again, and a running number that says which
   was touched most recently (all read from the day records, so nothing extra is stored) */
function lessonStats(days){
 const all=days||Store.days,first={},last={},again={},seq={};let n=0;
 Object.keys(all).sort().forEach(k=>{
  const p=all[k]&&all[k].p;if(!p)return;
  (p.ls||[]).forEach(id=>{if(!first[id])first[id]=k;last[id]=k;seq[id]=++n});
  (p.lv||[]).forEach(id=>{again[id]=(again[id]||0)+1;last[id]=k;seq[id]=++n});
 });
 return {first,last,again,seq};
}

/* Save the line in the box: a new reason, or a change to the one being edited. Gives back true when it is saved. */
function lessonReasonSave(){
 const sc=ui.scene;if(!sc||sc.id!=='lesson')return false;
 const R=sc.rb||(sc.rb={edit:null,editText:null,draft:'',msg:'',ok:true}),st=Store.settings,txt=cleanReason(R.draft);
 const fail=m=>{R.msg=m;R.ok=false;lessonRboxRefresh('#ls-rta');return false};
 if(!txt)return fail('Write a few words first.');
 const was=R.edit!=null?R.editText:null,at=was!=null?st.reasons.indexOf(was):-1;
 if(st.reasons.some((x,k)=>k!==at&&sameReason(x,txt)))return fail('You already have that one.');
 if(at<0&&st.reasons.length>=REASON_MAX)return fail('The list is full ('+REASON_MAX+'). Edit one instead.');
 const cat=at>=0?reasonCat(st,was).id:reasonGuess(txt).id;
 try{
  saveSettings(s=>{
   const k=was!=null?s.reasons.indexOf(was):-1;
   if(k<0)s.reasons.push(txt);else s.reasons[k]=txt;
   s.rmeta=(s.rmeta||[]).filter(m=>m.t!==was&&m.t!==txt);
   s.rmeta.push({t:txt,c:cat});
  });
 }catch(err){
  try{console.error(err)}catch(e){}
  return fail('That did not save. Your words are still in the box. Try again.');
 }
 const k=Store.settings.reasons.indexOf(txt);
 R.edit=null;R.editText=null;R.draft='';R.msg=at>=0?'Saved. Your change is on your list.':'Saved. It is on your list now.';R.ok=true;
 lessonRboxRefresh(k>=0?'[data-act="sc-l-redit"][data-i="'+k+'"]':null);
 return true;
}

/* ---------- the player (v2) ----------
   One flow for every lesson:  cover (pick Quick or Full)  >  one recall question on the lesson before  >  the cards  >  Done  >  Put it to work  >  Practiced.
   A lesson counts as finished only when the Done card is reached (recordLesson). Nothing on a card, and nothing on the practice step, can finish it
   or send the person away without a way back: tools come back to the lesson, pages show a Back bar, editors open over the lesson. */
const LX_E={hook:['bolt','The thought'],insight:['sparkle','The idea'],proof:['chart','The proof'],turn:['chat','Your turn'],guess:['ask','Take a guess'],recall:['sparkle','Quick recall'],step:['flag','Next step'],
 predict:['ask','Make a guess'],answer:['sparkle','The answer'],move:['flag','What to do'],check:['check','Check it']};
const LCHECK_N=16,LWRITE_LEN=1500;
function lessonHasQuick(L){return !!(L.cards&&L.cards.some(c=>c.q===1))}
/* the length shown in lists: a lesson that has a Quick version is 1 to 5 minutes, anything else says its own time */
function lmin(L){return lessonHasQuick(L)?'1–5 min':(L.mins||3)+' min'}
function lessonCore(L){return L.cards.filter(c=>c.k!=='try')}
function lessonCards(L,len){const all=lessonCore(L);return(len==='q'&&lessonHasQuick(L))?all.filter(c=>c.q===1):all}
/* the practice step. New lessons carry L.act; a lesson that still ends in a "try" card is read the same way. */
function lessonPractice(L){
 if(L.act)return L.act;
 const t=L.cards.find(c=>c.k==='try');
 return t?{h:t.h,b:t.b,go:t.go||[]}:null;
}
/* the lesson before this one, when it was finished and has a recall question, and this one is new */
function lessonRecallOf(L){
 const i=lessonIndex(L),P=i>0?LESSONS[i-1]:null,done=lessonsDone();
 return (P&&P.rc&&done.has(P.id)&&!done.has(L.id))?P:null;
}
function lessonSeq(L,sc){
 const out=[];
 if(sc.rcOf)out.push({t:'rc'});
 lessonCards(L,sc.len).forEach(c=>out.push({t:'card',c,ci:L.cards.indexOf(c)}));
 out.push({t:'done'});
 return out;
}
/* checkpoints: after every second lesson there is a longer piece of writing, for the pair that was just finished */
function lessonPairOf(L){const i=lessonIndex(L);return i%2===1?{n:(i+1)/2,a:LESSONS[i-1],b:L}:null}
function lcheckWritten(n){const w=Store.settings.learn&&Store.settings.learn.wr;return !!(w&&w['c'+n])}
function lcheckDue(){
 const done=lessonsDone();
 for(let n=1;n<=LCHECK_N;n++){
  const a=LESSONS[2*n-2],b=LESSONS[2*n-1];
  if(a&&b&&done.has(a.id)&&done.has(b.id)&&!lcheckWritten(n))return n;

}

    <button class="lx-len${pref==='f'?' on':''}" type="button" data-act="sc-l-start" data-len="f"><span class="lt"><b>Full</b><small>${L.v===2?'Adds a guess and the science behind it':'Adds the evidence and why it works'}</small>${pref==='f'?'<span class="usual">Your usual</span>':''}</span><span class="lm">3–5 min</span></button>
   </div><p class="hint">You can read it again in the other length any time.</p>`
  :`<button class="lx-next" type="button" data-act="sc-l-start" data-len="f"><span>Start · about ${L.mins||3} min</span>${ic('next')}</button>`;

/* ----- the recall question ----- */
/* each choice can carry its own comment (rc.cr, Lesson Standard v2); older recall questions share one explanation */
const lxRcReply=(r,j)=>r.cr&&r.cr[j]?r.cr[j]:(j===r.a?'Right. ':'Not quite. ')+r.r;
function lessonRecallHtml(L,sc){
 const P=lessonById(sc.rcOf),r=P.rc,pk=sc.rc,n=lessonIndex(P)+1,tried=sc.rcTried||[];

}

/* ----- cards ----- */
function lessonFact(c,ci){

  +`<div class="lx-copy">${lxEyebrow(c.e||'insight',c.el)}<h1 class="lx-h${lxHcls(c.h)}" id="ls-h" tabindex="-1">${esc(c.h)}</h1>${lessonBlocks(c.b)}${c.so?`<p class="lx-so"><b>What this means for you</b>${lfmt(c.so)}</p>`:''}</div>`+lessonFact(c,ci);
}
/* a question with one best answer (c.a, Lesson Standard v2): the first pick reveals the best answer in green.
   Every choice stays tappable after that, so the person can read the comment on each one; choices already tried stay marked. */
const lxGraded=c=>Number.isInteger(c.a);
const lxOptCls=(j,best,pk,tried)=>pk==null?'':j===best?' ok':(tried&&tried.indexOf(j)>=0)?' no':'';
function lxOptsMark(best,j,tried){
 document.querySelectorAll('.lx-opt').forEach((b,k)=>{
  b.classList.remove('ok','no','dim');const c=lxOptCls(k,best,j,tried).trim();if(c)b.classList.add(c);
  b.setAttribute('aria-pressed',String(k===j));
  const ck=b.querySelector('.ic');if(ck)ck.remove();if(k===best)b.insertAdjacentHTML('afterbegin',ic('check'));
 });
 const h=document.getElementById('ls-tapall');if(h)h.classList.add('on');
}
const lxTapAll=on=>`<p class="lx-tapall${on?' on':''}" id="ls-tapall">Tap any other answer to read its comment.</p>`;
function lessonChooseHtml(L,sc,c,ci){
 const pk=sc.pick[ci],gr=lxGraded(c),tried=(sc.tried&&sc.tried[ci])||[];
 const opt=(o,j)=>{
  if(!gr)return `<button class="lx-opt" type="button" aria-pressed="${pk===j}" data-act="sc-l-pick" data-j="${j}">${pk===j?ic('check'):''}<span>${esc(o[0])}</span></button>`;
  return `<button class="lx-opt${lxOptCls(j,c.a,pk,tried)}" type="button" aria-pressed="${pk===j}" data-act="sc-l-pick" data-j="${j}">${pk!=null&&j===c.a?ic('check'):''}<span>${esc(o[0])}</span></button>`;
 };
 return `<div class="lx-copy">${lxEyebrow(gr&&LX_E[c.e]?c.e:'turn',c.el)}<h1 class="lx-h sm" id="ls-h" tabindex="-1">${esc(c.h)}</h1>${(c.ask||typeof c.q==='string')?`<p class="lx-p ask">${esc(c.ask||c.q)}</p>`:''}</div>
  <div class="lx-opts" role="group" aria-label="${esc(c.h)}">${c.c.map(opt).join('')}</div>
  <p class="lx-reply${pk!=null?' on':''}" id="ls-reply" aria-live="polite">${pk!=null?esc(c.c[pk][1]):''}</p>${gr?lxTapAll(pk!=null):''}
  ${c.sv?`<p class="lx-carry${pk!=null?' on':''}" id="ls-carry">${ic('check')}Saved to your playbook</p>`:''}`;
}
/* a number the person guesses before it is shown */
const lxPct=(g,x)=>Math.max(0,Math.min(100,(x-g.min)/(g.max-g.min)*100));
const lxTicks=g=>`<div class="lx-ticks" aria-hidden="true">${(g.ticks||[g.min,g.max]).map((t,k,a)=>`<span>${t}${k===a.length-1?' '+esc(g.unit):''}</span>`).join('')}</div>`;
function lessonGuessHtml(L,sc,c,ci){
 const g=c.g,st=sc.gu[ci]||(sc.gu[ci]={v:null,lock:false});
 if(!st.lock){
  const has=st.v!=null,v=has?st.v:Math.round((g.min+g.max)/2);
  return `<div class="lx-art lx-gart"><div class="lx-gnum"><b id="lg-n"${has?'':' class="q"'}>${has?st.v:'?'}</b><span id="lg-u">${has?esc(g.unit)+' · your guess':'Drag to guess'}</span></div>
   <div class="lx-guess"><input class="lx-range${has?'':' unset'}" id="lg-r" type="range" data-lg="${ci}" min="${g.min}" max="${g.max}" step="${g.step||1}" value="${v}" style="--p:${lxPct(g,v)}%" aria-label="${esc(c.h)}" aria-valuetext="${has?st.v+' '+esc(g.unit):'No guess yet'}">${lxTicks(g)}</div></div>
   <div class="lx-copy">${lxEyebrow('guess',c.el)}<h1 class="lx-h sm" id="ls-h" tabindex="-1">${esc(c.h)}</h1><p class="lx-p">${esc(c.p||'Guess first. Guessing helps the answer stick.')}</p></div>`;
 }
 const v=st.v,a=g.ans,d=Math.abs(v-a),u=esc(g.unit),close=d<=Math.max(g.step||1,Math.round((g.max-g.min)*0.04));
 const fb=v===a?'Right on it.':close?`Close: you were within ${d} ${u}.`:v<a?`You were ${d} ${u} under, and that is fine.`:`You were ${d} ${u} over, and that is fine.`;
 const rv=g.rv||{},pv=lxPct(g,v),pa=lxPct(g,a),lo=lxPct(g,g.lo),hi=lxPct(g,g.hi);
 return `<div class="lx-art lx-gart"><div class="lx-bn"><b id="lg-big" data-to="${a}">${a}</b><span>${esc(g.big||g.unit)}</span></div>
   <div class="lx-rv" role="img" aria-label="You guessed ${v} ${u}. The answer is ${a} ${u}. People ranged from ${g.lo} to ${g.hi}.">
    <span class="flag" style="left:clamp(15%,${pv}%,85%)">You · ${v}</span>
    <div class="bar"><i class="band" style="left:${lo}%;width:${hi-lo}%"></i><i class="mk you" style="left:${pv}%"></i><i class="mk ans" style="left:${pa}%"></i></div>
    ${lxTicks(g)}<p class="lx-cap">${esc(g.cap||('People ranged from '+g.lo+' to '+g.hi+' '+g.unit))}</p></div></div>
   <div class="lx-copy">${lxEyebrow('proof')}<h1 class="lx-h sm" id="ls-h" tabindex="-1">${esc(rv.h||c.h)}</h1><p class="lx-p">${esc(fb)}${rv.b?' '+lfmt(rv.b):''}</p></div>`+lessonFact(c,ci);
}
function lessonCardHtml(L,sc,it){

/* ----- Put it to work ----- */
const lxSheetOf=g=>g.a==='sheet'?g.v:(g.a==='help'&&g.v==='plan'&&(g.sub==='slip'||g.sub==='urge'))?g.sub:g.a==='reasons'?'reasons':null;
function lxPeek(kind){
 let title='',rows=[],more=0;
 if(kind==='slip'){const s=slipSteps().map(x=>String(x).trim()).filter(Boolean);title='Your plan right now';rows=s.slice(0,2);more=Math.max(0,s.length-2)}
 else if(kind==='urge'){const s=((Store.settings&&Store.settings.plan)||[]).filter(r=>r.when&&r.when.trim()&&r.when.indexOf('______')<0).map(r=>'If '+r.when.trim());title='Your urge plan right now';rows=s.slice(0,2);more=Math.max(0,s.length-2)}
 else if(kind==='reasons'){const s=(Store.settings&&Store.settings.reasons)||[];title='Your reasons right now';rows=s.slice(0,2);more=Math.max(0,s.length-2)}

 return `<div class="lx-act"><p class="lx-eye2">${title}</p><ul class="lx-steps">${rows.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join('')}${more?`<li class="more"><b>+${more}</b><span>${more} more</span></li>`:''}</ul></div>`;
}
function lessonPracticeHtml(L,sc){

 const art=(kind||a.shield)?lxShield():lxIco(a.ic||(go[0]&&go[0].ic)||L.ic);
 const rest=go.slice(off).map((g,j)=>goBtn(g,0,j+off)).join('');

  ${a.note?lessonNoteField(L):''}${kind?lxPeek(kind):''}${rest?`<div class="lx-more">${rest}</div>`:''}`;
}

 const due=pair&&lessonsDone().has(pair.a.id)&&!lcheckWritten(pair.n);

  <div class="lx-copy">${ok?`<p class="lx-eye ok"><span class="lx-ei">${ic('check')}</span>Practiced</p>`:`<p class="lx-eye"><span class="lx-ei">${ic('flag')}</span>Lesson done</p>`}

  <div class="lx-routes">${due?lxRoute('sc-l-write','Write it out','3–5 min · a short checkpoint for lessons '+(lessonIndex(pair.a)+1)+' and '+(lessonIndex(pair.b)+1)):''}${lxRoute('sc-l-learn','Back to Learn')}${lxRoute('sc-l-today','Back to Today')}</div>`;
}

/* ----- the sheet that opens over the lesson ----- */
function urgeEditor(){
 const st=Store.settings;
 return `<section class="block"><p class="detail">When an urge hits, Daybook offers this plan as one of the tools. Make each line sound like you. Changes save as you type.</p>
  ${st.plan.map((r,i)=>`<div class="pl"><label class="field"><span>If</span><input type="text" data-plan="when" data-i="${i}" maxlength="120" value="${esc(r.when)}"></label><label class="field"><span>Then I will</span><textarea rows="3" data-plan="then" data-i="${i}" maxlength="400">${esc(r.then)}</textarea></label></div>`).join('')}</section>`;

function lessonSheetHtml(sc,L){

 if(s.t==='slip'){title='My slip plan';body=slipEditor()}
 else if(s.t==='urge'){title='My urge plan';body=urgeEditor()}
 else if(s.t==='reasons'){title='My reasons';body=lessonRbox(sc)}
 else{
  title='Behind this lesson';btn='Close';
  const c=s.i!=null?L.cards[+s.i]:null,idx=c&&c.fact&&c.fact.i?c.fact.i:L.src.map((_,k)=>k);
  const srcNote='Checked '+(L.chk||'October 12, 2026')+'. '+(L.f?'These summarize studies and well-known recovery programs, kept to what each source says. They are not religious teaching, and Daybook does not speak for any church or group.':L.u>=6?'These summarize published studies and program materials, kept to what each source says.':'These are summaries of studies, kept to what each one found.')+' Daybook is a self-tracking tool, not medical care.';

  }).join('')+(L.scope?`<div class="lx-scope"><b>What it shows, and what it does not</b><p>${lfmt(L.scope)}</p></div>`:'');
 }

/* ----- the scene ----- */
SCENES.lesson=function(sc){
 const L=lessonById(sc.lid);
 if(!L)return sceneTop('Lesson')+`<div class="sc-body"><h1 class="sc-h">That lesson is not here</h1><button class="btn btn-primary wide" type="button" data-act="sc-close">Close</button></div>`;
 const n=lessonIndex(L)+1,after=sc.st==='practice'||sc.st==='practiced',next=nextAfter(L,lessonsDone());
 let prog='',card='',foot='';
 if(sc.st==='cover'){
  card=lessonCoverHtml(L,sc);
 }else if(sc.st==='run'){
  const seq=lessonSeq(L,sc),i=Math.max(0,Math.min(seq.length-1,sc.i)),it=seq[i],last=i===seq.length-1;
  prog=lxProg(seq.length,i);
  const back=i>0?lxBack():'';
  if(it.t==='rc'){card=lessonRecallHtml(L,sc);foot=lxBtn('sc-l-next',sc.rc==null?'Skip':'Next')}
  else if(it.t==='done'){card=lessonDoneHtml(L,sc);foot=back+(lessonPractice(L)?lxBtn('sc-l-put','Put it to work'):next?lxBtn('sc-l-nextlesson','Next: '+esc(next.title),{attr:' data-v="'+next.id+'"'}):lxBtn('sc-close','Done',{noic:true}))}
  else{
   card=lessonCardHtml(L,sc,it);
   const gs=it.c.k==='guess'?(sc.gu[it.ci]||{}):null;
   if(gs&&!gs.lock)foot=back+lxBtn('sc-l-lock','Lock in my guess',{off:gs.v==null,id:'lg-lock',noic:true});
   else foot=back+lxBtn('sc-l-next',seq[i+1]&&seq[i+1].t==='done'?'Finish':'Next');
  }
  void last;
 }else if(sc.st==='practice'){
  const a=lessonPractice(L)||{},go=a.go||[],first=a.note?null:go[0];
  prog=lxProg(1,0,true);card=lessonPracticeHtml(L,sc);
  foot=lxGhost('sc-l-notnow','Not now')+(first?lxBtn('sc-l-do',esc(first.t),{noic:true,attr:' data-gi="0"'}):lxBtn('sc-l-did',esc(a.btn||'I tried it'),{noic:true}));
 }else{
  prog=lxProg(1,0,true);card=lessonPracticedHtml(L,sc);
  foot=next?lxBtn('sc-l-nextlesson','Next: '+esc(next.title),{attr:' data-v="'+next.id+'"'}):lxBtn('sc-close','Done',{noic:true});
 }
 const anim=sc.anim?(sc.dir==='p'?' lx-p':' lx-n'):'';sc.anim=false;
 return sceneTop('Lesson '+n+' of '+LESSONS.length+(after?' · done':''))
  +`<div class="lx-wrap tone-${LUNITS[L.u].tone}">${prog}<article class="lx-card${anim}" id="lx-card">${card}</article>${foot?`<div class="lx-foot">${foot}</div>`:''}</div>`+lessonSheetHtml(sc,L);
};
/* after every draw of the lesson: count a revealed number up, and catch a tap on the middle of the guess slider */
/* short screens: when a card would scroll, shrink it in two steps, art first, so a card reads whole on a small phone */
function lxFit(){
 const c=document.getElementById('lx-card');if(!c)return;
 c.classList.remove('fit1','fit2','fit3');
 const over=()=>c.scrollHeight-c.clientHeight>2;
 if(!over())return;
 c.classList.add('fit1');
 if(!over())return;
 c.classList.add('fit2');
 if(!over())return;
 c.classList.add('fit3'); /* last step: the words matter more than the picture, so every picture but a guess slider goes */
}
try{window.addEventListener('resize',()=>{if(ui.scene&&(ui.scene.id==='lesson'||ui.scene.id==='onb'))lxFit()});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(ui.scene&&(ui.scene.id==='lesson'||ui.scene.id==='onb'))lxFit()})}catch(e){}
function lessonAfter(sc){
 lxFit();
 if(sc.animBig){
  sc.animBig=false;
  const el=document.getElementById('lg-big');
  if(el&&!reduced()){
   const to=+el.dataset.to,t0=performance.now(),dur=900;
   el.textContent='0';
   const tick=now=>{const k=Math.min(1,(now-t0)/dur);el.textContent=String(Math.round(to*(1-Math.pow(1-k,3))));if(k<1&&document.body.contains(el))requestAnimationFrame(tick)};
   requestAnimationFrame(tick);
  }
 }
 const r=document.getElementById('lg-r');
 if(r)r.addEventListener('pointerup',()=>{if(r.classList.contains('unset'))lessonGuessInput(r)});
}
function lessonGuessInput(t){
 const sc=ui.scene;if(!sc||sc.id!=='lesson')return;
 const L=lessonById(sc.lid),ci=+t.dataset.lg,c=L&&L.cards[ci];if(!c||c.k!=='guess')return;
 const g=c.g,v=+t.value,st=sc.gu[ci]||(sc.gu[ci]={v:null,lock:false});
 if(st.lock)return;
 st.v=v;
 t.classList.remove('unset');t.style.setProperty('--p',lxPct(g,v)+'%');t.setAttribute('aria-valuetext',v+' '+g.unit);
 const n=document.getElementById('lg-n'),u=document.getElementById('lg-u'),b=document.getElementById('lg-lock');
 if(n){n.textContent=String(v);n.classList.remove('q')}
 if(u)u.textContent=g.unit+' · your guess';
 if(b){b.disabled=false;b.classList.remove('off')}
}

/* ----- opening, moving, finishing ----- */
function lessonOpts(L,o){return Object.assign({lid:L.id,st:'cover',i:0,len:null,rcOf:null,rc:null,pick:{},tried:{},rcTried:[],gu:{},gain:0,again:false,rec:false,prac:false,sheet:null,anim:true,dir:'n',animBig:false,cls:LUNITS[L.u].cls},o||{})}
function lessonFocus(){const h=document.getElementById('ls-h');if(h){try{h.focus({preventScroll:true})}catch(e){}}}
function openLesson(lid){
 const L=lessonById(lid);if(!L)return;
 openScene('lesson',lessonOpts(L));
 lessonFocus(); /* a screen reader starts on the card's heading, the same place every later card puts it */
}
/* back to a lesson from a tool or a page it sent the person to: straight to the practice result, nothing is replayed */
function lessonResume(b){
 const L=lessonById(b&&b.lid);
 if(!L){render(true);return}
 openScene('lesson',lessonOpts(L,{st:'practiced',len:b.len||'f',gain:b.gain||0,again:!!b.again,rec:true,prac:true,anim:true}));
 lessonFocus();
}
const lessonLr=sc=>({lid:sc.lid,len:sc.len,gain:sc.gain||0,again:!!sc.again});
function lessonSet(sc,st){sc.st=st;sc.dir='n';sc.anim=true;renderScene('#ls-h')}
function lessonStep(d){
 const sc=ui.scene;if(!sc||sc.id!=='lesson'||sc.st!=='run')return;
 const L=lessonById(sc.lid);if(!L)return;
 const seq=lessonSeq(L,sc),to=sc.i+d;
 if(to<0||to>=seq.length)return;
 const cur=seq[sc.i];
 if(d>0&&cur.t==='card'&&cur.c.k==='guess'&&!(sc.gu[cur.ci]&&sc.gu[cur.ci].lock))return; /* the answer is shown only after a guess is locked in */
 sc.i=to;sc.dir=d>0?'n':'p';sc.anim=true;
 if(seq[to].t==='done')recordLesson(sc,L); /* the lesson counts only here, on the last card */
 renderScene('#ls-h');
}
function recordLesson(sc,L){
 if(sc.rec)return;
 sc.rec=true;
 if(lessonsDone().has(L.id)){
  /* a lesson already finished before: reading it again counts as today's lesson, for the daily win */
  sc.gain=0;sc.again=true;
  const dp=(Store.days[todayKey()]||{}).p;
  if(!(dp&&((dp.ls&&dp.ls.indexOf(L.id)>=0)||(dp.lv&&dp.lv.indexOf(L.id)>=0)))){
   const b0=G().rawPts;
   saveDay(todayKey(),d=>{const p=d.p||blankP();if(!p.lv)p.lv=[];if(p.lv.indexOf(L.id)<0)p.lv.push(L.id);d.p=p});
   sc.gain=Math.max(0,G().rawPts-b0);
   afterAction();
  }
  return;
 }
 const before=G().rawPts;
 saveDay(todayKey(),d=>{const p=d.p||blankP();if(!p.ls)p.ls=[];if(p.ls.indexOf(L.id)<0)p.ls.push(L.id);d.p=p});
 sc.gain=Math.max(0,G().rawPts-before);sc.again=false;
 const all=lessonsDone().size===LESSONS.length;
 confetti(all);vibe(all?[30,50,30]:15);
 afterAction();
}
/* practiced is a plain marker: it earns no points */
function lessonPracticed(sc,L){
 sc.prac=true;
 const l=Store.settings.learn;
 if(!(l&&l.prac&&l.prac[L.id]))saveSettings(s=>{const x=s.learn||(s.learn={notes:{}});(x.prac||(x.prac={}))[L.id]=1});
}
/* a line typed into the reasons box is kept when the person moves on, so it is never lost. If it cannot be saved, stay and say why. */
function lessonKeepDraft(sc){
 if(sc.rb&&sc.rb.draft&&sc.rb.draft.trim()){if(!lessonReasonSave())return false;toast('Saved your reason.')}
 return true;
}
const lessonDestTab=g=>g.a==='reasons'?'reasons':g.a==='help'?helpDest(g.v):g.a==='tab'?resolveTab(g.v,g.open).tab:g.a==='week'?'journal':ui.tab;
/* one action from the practice step. It never finishes the lesson and never leaves without a way back. */
function lessonDo(g,btn,primary){
 const sc=ui.scene,L=sc&&sc.id==='lesson'?lessonById(sc.lid):null;
 if(!L||!g)return;
 if(g.a==='copy'){
  copyText(g.text).then(ok=>toast(ok?'Copied.':'Could not copy. Press and hold the text to copy it.'));
  lessonPracticed(sc,L);if(primary)lessonSet(sc,'practiced');return;
 }
 if(LIST_OF[g.a]){lessonAddItem(g,btn);lessonPracticed(sc,L);if(primary)lessonSet(sc,'practiced');return}
 const kind=lxSheetOf(g);
 if(kind){lessonPracticed(sc,L);sc.sheet={t:kind,from:'practice',fresh:true};renderScene('#lx-sh-t');return}
 if(!lessonKeepDraft(sc))return;
 lessonPracticed(sc,L);
 if(g.a==='scene'){openScene(g.v,Object.assign({},g.o||{},{lr:lessonLr(sc)}));return}
 try{
  /* a page: remember the way back, so the page can return to this lesson */
  const back=Object.assign(lessonLr(sc),{tab:lessonDestTab(g)});
  closeScene(false,true);
  ui.lback=back;
  if(g.a==='help')helpOpen(g.v,g.sub);
  else if(g.a==='tab'){if(g.open)ui.open[g.open]=true;goTab(g.v,g.open)}
  else if(g.a==='growth')openSheet({type:'growth',stage:G().level.stage});
  else if(g.a==='week'){ui.week=Math.max(0,weekOf(todayKey(),Store.settings));goTab('weeks')}
  render(true);
  if(!ui.scene&&!ui.sheets.length)celResume();
 }catch(err){
  /* never leave the person on a blank screen: if the lesson is still open stay in it, otherwise show the page they were on */
  try{console.error(err)}catch(e){}
  if(ui.scene)toast('That did not open. You are still in the lesson.');
  else{ui.lback=null;render(true);toast('Something went wrong. Your lesson is saved.')}
 }
}
/* from a page a lesson sent you to, back to the lesson's practice result */
function lessonReturn(){
 const b=ui.lback;ui.lback=null;
 if(!b||!lessonById(b.lid)){render(true);return}
 lessonResume(b);
 render(true);
}
function lessonAction(a,t){
 try{lessonAct(a,t)}
 catch(err){try{console.error(err)}catch(e){}toast('That did not work. Try again.')}
}
function lessonAct(a,t){
 const sc=ui.scene;if(!sc)return;
 if(sc.id==='lwrite'){lwriteAct(a,t);return}
 if(sc.id!=='lesson')return;
 const L=lessonById(sc.lid);if(!L)return;
 switch(a){
  case 'sc-l-start':{
   const len=t.dataset.len==='q'&&lessonHasQuick(L)?'q':'f';
   sc.len=len;sc.i=0;sc.st='run';sc.dir='n';sc.anim=true;
   const P=lessonRecallOf(L);sc.rcOf=P?P.id:null;sc.rc=null;sc.rcTried=[];
   if(lessonHasQuick(L)&&(Store.settings.learn||{}).len!==len)saveSettings(s=>{(s.learn||(s.learn={notes:{}})).len=len});
   renderScene('#ls-h');return;
  }
  case 'sc-l-next':lessonStep(1);return;
  case 'sc-l-back':lessonStep(-1);return;
  case 'sc-l-put':if(sc.st==='run'){lessonSet(sc,'practice')}return;
  case 'sc-l-notnow':if(sc.st==='practice'&&lessonKeepDraft(sc))lessonSet(sc,'practiced');return;
  case 'sc-l-did':if(sc.st==='practice'&&lessonKeepDraft(sc)){lessonPracticed(sc,L);lessonSet(sc,'practiced')}return;
  case 'sc-l-do':{const a0=lessonPractice(L),g=a0&&a0.go&&a0.go[+t.dataset.gi||0];if(g)lessonDo(g,t,true);return}
  case 'sc-lgo':case 'sc-l-go':{
   const a0=lessonPractice(L),g=a0&&a0.go&&a0.go[+t.dataset.gi];
   if(g)lessonDo(g,t,false);
   return;
  }
  case 'sc-l-pick':{
   const it=lessonSeq(L,sc)[sc.i],c=it&&it.c,j=+t.dataset.j;if(!c||c.k!=='choose'||!c.c[j])return;
   if(lxGraded(c)){
    const first=sc.pick[it.ci]==null,tr=(sc.tried||(sc.tried={}))[it.ci]||(sc.tried[it.ci]=[]);
    sc.pick[it.ci]=j;if(tr.indexOf(j)<0)tr.push(j);
    lxOptsMark(c.a,j,tr);
    const rg=document.getElementById('ls-reply');if(rg){rg.textContent=c.c[j][1];rg.classList.add('on')}
    vibe(first?(j===c.a?[10,30,10]:8):6);lxFit();
    return;
   }
   sc.pick[it.ci]=j;
   /* update in place so the page does not jump and the reply is announced */
   document.querySelectorAll('.lx-opt').forEach((b,k)=>{b.setAttribute('aria-pressed',String(k===j));const ck=b.querySelector('.ic');if(ck)ck.remove();if(k===j)b.insertAdjacentHTML('afterbegin',ic('check'))});
   const r=document.getElementById('ls-reply');if(r){r.textContent=c.c[j][1];r.classList.add('on')}
   const cr=document.getElementById('ls-carry');if(cr)cr.classList.add('on');
   if(c.sv)saveSettings(s=>{const x=s.learn||(s.learn={notes:{}});(x.picks||(x.picks={}))[L.id]=String(c.c[j][0]).slice(0,200)});
   vibe(8);
   return;
  }
  case 'sc-l-rcpick':{
   const P=lessonById(sc.rcOf),r=P&&P.rc,j=+t.dataset.j;if(!r||!r.c[j])return;
   const first=sc.rc==null,tr=sc.rcTried||(sc.rcTried=[]);
   sc.rc=j;if(tr.indexOf(j)<0)tr.push(j);
   lxOptsMark(r.a,j,tr);
   const rp=document.getElementById('ls-reply');if(rp){rp.textContent=lxRcReply(r,j);rp.classList.add('on')}
   const nb=document.querySelector('.lx-foot .lx-next span');if(nb)nb.textContent='Next';
   vibe(first?(j===r.a?[10,30,10]:8):6);lxFit();
   return;
  }
  case 'sc-l-lock':{
   const it=lessonSeq(L,sc)[sc.i],st=it&&it.c&&it.c.k==='guess'&&sc.gu[it.ci];
   if(!st||st.v==null||st.lock)return;
   st.lock=true;sc.animBig=true;sc.dir='n';sc.anim=true;vibe(15);
   renderScene('#ls-h');return;
  }
  case 'sc-l-sheet':sc.sheet={t:t.dataset.t,i:t.dataset.i!=null?+t.dataset.i:null,from:'card',fresh:true};renderScene('#lx-sh-t');return;
  case 'sc-l-sheetx':{
   const s=sc.sheet;if(!s)return;
   if(s.t==='reasons'&&!lessonKeepDraft(sc))return;
   sc.sheet=null;
   if(s.from==='practice'){sc.st='practiced';sc.dir='n';sc.anim=true;renderScene('#ls-h')}
   else renderScene(true);
   return;
  }
  case 'sc-l-redit':{
   const st=Store.settings,i=+t.dataset.i,txt=st.reasons[i];if(txt==null)return;
   const R=sc.rb||(sc.rb={edit:null,editText:null,draft:'',msg:'',ok:true});
   R.edit=i;R.editText=txt;R.draft=txt;R.msg='';R.ok=true;
   lessonRboxRefresh('#ls-rta');
   const ta=document.getElementById('ls-rta');if(ta&&ta.setSelectionRange){try{ta.setSelectionRange(ta.value.length,ta.value.length)}catch(e){}}
   return;
  }
  case 'sc-l-rcancel':{const R=sc.rb;if(R){R.edit=null;R.editText=null;R.draft='';R.msg='';R.ok=true}lessonRboxRefresh();return}
  case 'sc-l-rsave':lessonReasonSave();return;
  case 'sc-l-nextlesson':openLesson(t.dataset.v);return;
  case 'sc-l-write':{const pr=lessonPairOf(L);if(pr)openScene('lwrite',{n:pr.n,i:0,lr:lessonLr(sc)});return}
  case 'sc-l-learn':closeScene(false);ui.lback=null;goTab('lessons');return;
  case 'sc-l-today':closeScene(false);ui.lback=null;goTab('today');return;
 }
}

/* ---------- checkpoints: a longer piece of writing after every second lesson ----------
   One pair of lessons, three prompts, one box each. Everything is saved as it is typed, in settings.learn.wr, and shows up in My playbook.
   It earns no points: it is for the person, not for a score. */
const LCHECKS=[
 {t:'Start small, ride the wave',q:['What part of you wants this, and what part is unsure? Write both.','Think of your last urge. Where did you feel it first, and what did it do over the next few minutes?','What is one small thing you will try the next time an urge shows up?']},
 {t:'Slips and the hard hours',q:['When did “I blew it” last show up for you? What did you do next?','Which pulls harder for you, tired or lonely? Describe a recent time.','Write the sentence you want ready after a slip, and one change you will make for the hard hours.']},
 {t:'Shame and kindness',q:['Write one harsh sentence you say to yourself. Now write it again as something that happened, not as who you are.','What would you say to a friend in your exact spot?','Say that to yourself, in your own words. Then write one way you will remember it.']},
 {t:'Not carrying it alone',q:['What is the heaviest part of keeping this to yourself?','Who is one person who could know? What would you ask of them?','What is one small step toward people that you could take this week?']},
 {t:'Plans and settings',q:['Write your strongest if-then: If ___, then I will ___.','Which place, hour, or device sets off the pull most? Describe it.','What is the first change you will make to that setting, and when?']},
 {t:'Help and progress',q:['What word do you use for this, if any, and what kind of help fits it?','Describe what better would look like in a month. Include things that are not a number.','What is the first kind of help you will look into, and what would make it easier to start?']},
 {t:'Naming it and breathing out',q:['What feeling do you most often skip past? Name it in a word or two.','Think of a recent hard moment. What did the feeling do once you named it, or what might it do?','When in your day will you try a long breath out? Be specific.']},
 {t:'Moving and noticing thoughts',q:['Which one-minute movement could you actually do? Write it.','What thought shows up first when an urge starts? Write it exactly as it sounds.','How will you answer that thought? Write it: notice it, name it, choose.']},
 {t:'Early links and permission',q:['Walk back from your last slip. What was the earliest small yes?','What permission thought do you hear most? Write it word for word.','Write a short answer to that thought, and what you would do at the earliest link.']},
 {t:'Your log and fewer fights',q:['What has your log taught you so far? Even one line counts.','Which fight do you keep having with yourself?','What could you change so that fight happens less?']},
 {t:'Missed days and values',q:['What will you do the day after you miss one? Keep it small.','What bothers you most: losing control, a clash with your values, or both? Explain.','What does that tell you about the kind of help or support you want?']},
 {t:'The empty hour and therapy',q:['Which hour is hardest? What will you put in it?','What makes it hard to start that, and what would make it easier?','What is one question you would ask a therapist, and what would you want from them?']},
 {t:'Two programs',q:['Which step or point sounds closest to where you are? Why?','Which tool from either program would you try first?','What would trying it look like this week?']},
 {t:'Pausing and groups',q:['Where in your day could a one-minute pause fit?','Who or what group could you try first, even just to listen?','Write the first sentence you would say to ask someone to check in.']},
 {t:'Faith and a plan',q:['How do you want faith to be part of your plan?','Write the words you will say in a hard moment.','What is the next small thing you will do after you say them?']},
 {t:'Guilt, forgiveness, a fresh start',q:['Write one honest line about what you are carrying.','What would forgiving yourself change about your next step, without excusing what happened?','What is one careful way to make things right, and who could help you do it?']}
];
const lwriteOf=n=>{const w=Store.settings.learn&&Store.settings.learn.wr&&Store.settings.learn.wr['c'+n];return w&&Array.isArray(w.a)?w.a:['','','']};
function lwriteSave(n,i,val){
 saveSettings(s=>{
  const l=s.learn||(s.learn={notes:{}}),w=l.wr||(l.wr={}),cur=w['c'+n]&&Array.isArray(w['c'+n].a)?w['c'+n].a.slice():['','',''];
  cur[i]=String(val).slice(0,LWRITE_LEN);
  w['c'+n]={a:cur,u:Date.now()};
 });
}
SCENES.lwrite=function(sc){
 const n=sc.n,C=LCHECKS[n-1],A=LESSONS[2*n-2],B=LESSONS[2*n-1];
 if(!C||!A||!B)return sceneTop('Checkpoint')+`<div class="sc-body"><h1 class="sc-h">That checkpoint is not here</h1><button class="btn btn-primary wide" type="button" data-act="sc-close">Close</button></div>`;
 const total=C.q.length,i=Math.max(0,Math.min(total,sc.i)),fin=i===total,txt=lwriteOf(n);
 const label='Checkpoint '+n+' · lessons '+(2*n-1)+' and '+(2*n);
 let card,foot;
 if(!fin){
  card=`<div class="lx-copy"><p class="lx-eye"><span class="lx-ei">${ic('pencil')}</span>Write it out · ${i+1} of ${total}</p>

   <p class="lx-saved">${ic('check')}Saved as you type</p>`;
  foot=(i>0?lxBack():'')+lxBtn('sc-l-next',i===total-1?'Finish':'Next');
 }else{
  card=`<div class="lx-art">${lxCheck()}</div><div class="lx-copy"><p class="lx-eye ok"><span class="lx-ei">${ic('check')}</span>Checkpoint saved</p>
   <h1 class="lx-h" id="ls-h" tabindex="-1">That is in your playbook.</h1><p class="lx-p">You wrote it for yourself. It stays in My playbook to read whenever you want.</p></div>
   <div class="lx-routes">${lxRoute('sc-l-book','Read my playbook')}${lxRoute('sc-l-learn','Back to Learn')}</div>`;
  foot=lxBtn('sc-close','Done',{noic:true});
 }
 const an=sc.anim?(sc.dir==='p'?' lx-p':' lx-n'):'';sc.anim=false;
 return sceneTop(label)+`<div class="lx-wrap tone-${LUNITS[B.u].tone}">${lxProg(total+1,i,fin)}<article class="lx-card${an}" id="lx-card">${card}</article><div class="lx-foot">${foot}</div></div>`;
};
function lwriteAct(a,t){

 if(a==='sc-l-next'||a==='sc-l-back'){

}

/* ===== MY REASONS: a page to write, edit, order and read the reasons.
   They are plain lines in settings.reasons. settings.rmeta remembers which group each one is filed under, matched by its exact
   text, so reordering or editing from another device cannot scramble it. Nothing is saved while typing: Save and Add are explicit,
   so a half-written line never shows up on the Today screen. ===== */
const RCATS=[
 {id:'rel',name:'Relationships',ic:'heart',tone:'coral',words:/relationship|marri|partner|wife|husband|spouse|girlfriend|boyfriend|dating|romanc|love|famil|friend|intima|connect|trust|father|mother|\bdad\b|\bmom\b|kids|child/i},
 {id:'foc',name:'Energy and focus',ic:'bolt',tone:'sky',words:/focus|energy|work|career|sleep|tired|product|concentrat|clear|fog|mind|health|study|school|money|morning|time/i},
 {id:'val',name:'Values and faith',ic:'star',tone:'violet',words:/value|faith|\bgod\b|pray|church|spirit|integrity|honest|character|belief|believe|purpose|soul|proud|my word|respect/i},
 {id:'oth',name:'Something else',ic:'leaf',tone:'mint',words:null}
];
/* a few starting points, offered when the list has room. Tapping one puts it in the box to be changed. */
const RIDEAS=[
 ['Being fully present with the people I love','rel'],
 ['Being ready for a real, honest relationship','rel'],
 ['Clear mornings and steady energy','foc'],
 ['Doing my best work without a fog','foc'],
 ['Sleeping well and waking up rested','foc'],
 ['Keeping my word to myself','val'],
 ['Becoming someone I am proud of','val'],
 ['Not carrying a secret','oth'],
 ['Feeling at peace with myself','oth']
];
const blankR=()=>({edit:null,draft:'',editCat:null,editText:'',del:null,add:'',addCat:null,flash:null});
ui.r=blankR();

function reasonGuess(text){for(let i=0;i<3;i++)if(RCATS[i].words.test(text))return RCATS[i];return RCATS[3]}
function reasonCat(st,text){
 const m=((st&&st.rmeta)||[]).find(x=>x.t===text);
 return (m&&RCATS.find(c=>c.id===m.c))||reasonGuess(text);
}
const cleanReason=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,REASON_LEN);
const sameReason=(a,b)=>a.toLowerCase()===b.toLowerCase();

/* the line under the flame on Today: usually a short kind note, now and then one of your own reasons.
   Never on a day with a slip logged, and not the morning after one either. */
function heroNote(tk){
 const st=Store.settings,rs=(st&&st.reasons)||[];
 let h=0;for(let i=0;i<tk.length;i++)h=(h*17+tk.charCodeAt(i))>>>0;
 if(rs.length&&h%3===0&&!sumDay(Store.days[tk]).slipped&&!sumDay(Store.days[addDays(tk,-1)]).slipped)return {own:true,text:rs[(h>>>2)%rs.length]};
 return {own:false,text:dailyNote(tk)};
}

 const head=`<div class="rs-main"><span class="rs-ic">${ic(c.ic)}</span><div class="rs-body"><small class="rs-cat">${esc(c.name)}${i===0&&n>1?' · shows first':''}</small><p class="rs-txt">${esc(text)}</p></div></div>`;

 }
 return `<li class="rs-card ${tone}${fl===i?' flash':''}" id="rs-${i}">${head}
  <div class="rs-act" role="group" aria-label="Reason ${i+1} of ${n}">

 switch(a){
  case 'r-edit':{
   const txt=st.reasons[i];if(txt==null)return;
   if(R.edit!=null&&R.edit!==i&&cleanReason(R.draft)!==R.editText){toast('Save or cancel the edit you started first.');return}

/* ===== VIEWS (part 2): Progress = Rewards + Charts + Week ===== */
const SERIES=[['m','Motivation'],['c','Connection'],['e','Energy'],['s','Stress']];
const REVIEW_QS=[
 ['hard','Hardest moment this week'],['helped','What helped'],['change','One change for next week'],['proud',"Something I'm proud of"]

/* ---------- charts: one look for every graph ----------
   Thin bars with a rounded top, a hairline grid, the same two outcome colors everywhere (teal: rode it out, amber: slipped),
   and one violet for everything else. Every chart shows the same details on hover, tap, or the arrow keys, and every chart
   has its numbers as a table underneath. A chart is drawn at the width it is shown at, so its text is the same size on any screen. */
const VZ={reg:{},seq:0,tip:null,cur:null,rt:0,ro:null,seen:new WeakSet()};
/* if a chart's box changes width by itself (a scrollbar appears, a window is dragged), draw it again at the new width */
try{if(window.ResizeObserver)VZ.ro=new ResizeObserver(()=>{clearTimeout(VZ.rt);VZ.rt=setTimeout(()=>vzMount(true),90)})}catch(e){VZ.ro=null}
const vzFmtD=k=>fmtDate(k,{weekday:'short',month:'short',day:'numeric'});
const vzBw=step=>Math.max(2,Math.min(24,Math.round(step*.62*2)/2));
function vzReg(s){const id='vz'+(++VZ.seq);s.id=id;VZ.reg[id]=s;return id}
/* a figure is an empty box of a known height. vzMount draws into it once the page is on screen and its width is known. */
function vzFig(s,h,label,o){
 o=o||{};
 vzReg(s);s.h=h;
 return `<div class="vz${o.still?' still':''}" data-vz="${s.id}" style="height:${h}px"${o.still?'':` role="group" tabindex="0" aria-label="${esc(label)}. Use the left and right arrow keys to move between the points. The numbers are in the table below."`}></div>`;
}
function vzMount(redraw){
 const els=document.querySelectorAll('.vz[data-vz]');
 if(!redraw)vzHide();
 if(!els.length)return;
 els.forEach(el=>{
  const s=VZ.reg[el.dataset.vz];if(!s||!s.draw)return;
  const W=Math.floor(el.clientWidth);
  if(W<(s.min||100)||el.dataset.w===String(W))return;
  el.dataset.w=String(W);
  el.innerHTML=s.draw(W);
  if(VZ.ro&&!VZ.seen.has(el)){VZ.seen.add(el);VZ.ro.observe(el)}
 });
}
const vzSvg=(W,H,inner)=>`<svg class="vzs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${inner}</svg>`;
/* a clean top for the axis: two to four steps of 1, 2, 2.5, 3, 4 or 5 (times a power of ten), as close above the biggest value as it gets */
function vzScale(max,floor,int){
 max=Math.max(max,floor||1);
 if(int&&max<=4){const t=Math.max(2,Math.ceil(max));return {step:1,top:t,k:t}}
 let best=null;
 [0.1,1,10,100,1000].forEach(pw=>[1,2,2.5,3,4,5].forEach(m=>{
  const step=m*pw;
  if(int&&step%1!==0)return;
  const k=Math.ceil(max/step-1e-9),top=k*step;
  if(k<2||k>4)return;
  const over=top-max;
  if(!best||over<best.over-1e-9||(Math.abs(over-best.over)<1e-9&&k<best.k))best={step,top,k,over};
 }));
 return best||{step:Math.ceil(max),top:Math.ceil(max),k:1};
}
function vzGrid(L,x2,T,ih,sc,fmt){
 let g='';
 for(let j=0;j<=sc.k;j++){
  const v=j*sc.step,y=T+ih-v/sc.top*ih;
  g+=`<line class="${j?'grid':'base'}" x1="${L}" x2="${x2}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${L-8}" y="${(y+3.8).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
 }
 return g;
}
function vzXLabels(keys,X,y,iw,L){
 const n=keys.length,tk=todayKey();
 if(n<=7)return keys.map((k,i)=>`<text class="ax" x="${X(i).toFixed(1)}" y="${y}" text-anchor="middle">${k===tk?'Today':esc(fmtDate(k,{weekday:'short'}))}</text>`).join('');
 const cnt=Math.max(2,Math.min(5,Math.floor(iw/64))),idx=[];
 for(let j=0;j<cnt;j++)idx.push(Math.round(j*(n-1)/(cnt-1)));
 return idx.filter((v,j,a)=>a.indexOf(v)===j).map(i=>{
  const first=i===0,last=i===n-1,x=first?L:last?L+iw:X(i);
  return `<text class="ax" x="${x.toFixed(1)}" y="${y}" text-anchor="${first?'start':last?'end':'middle'}">${last&&keys[i]===tk?'Today':esc(fmtDate(keys[i],{month:'short',day:'numeric'}))}</text>`;
 }).join('');
}
/* a bar with a rounded top and a square bottom, so it sits flat on the baseline */
function vzTop(x,y,w,h,r){
 r=Math.max(0,Math.min(r,w/2,h));
 const f=v=>v.toFixed(1);
 return `M${f(x)} ${f(y+h)}V${f(y+r)}${r?`A${r} ${r} 0 0 1 ${f(x+r)} ${f(y)}H${f(x+w-r)}A${r} ${r} 0 0 1 ${f(x+w)} ${f(y+r)}`:`H${f(x+w)}`}V${f(y+h)}Z`;
}
/* a stack of bars on one baseline. A segment is [value, class]. A 2px gap sits between segments, and only the top one is rounded. */
function vzStack(x,w,y0,px,segs){
 const parts=segs.filter(q=>q[0]>0);
 let cum=0,out='';
 parts.forEach((q,j)=>{
  const top=y0-(cum+q[0])*px,h=q[0]*px-(j?2:0),last=j===parts.length-1;
  cum+=q[0];
  if(h<=.5)return;
  out+=last?`<path class="${q[1]}" d="${vzTop(x,top,w,h,4)}"/>`:`<rect class="${q[1]}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
 });
 return out;
}
const vzLegend=items=>`<div class="vz-lg">${items.map(i=>`<span class="vz-li"><i class="sw ${i[0]}"></i>${esc(i[1])}</span>`).join('')}</div>`;
/* the numbers behind a chart, newest first, for anyone who would rather read them (and for screen readers) */
function vzTable(slug,cap,head,rows){
 return `<details class="tv" data-d="tv-${slug}"${ui.open['tv-'+slug]?' open':''}><summary><span>Show the numbers</span></summary><div class="tv-s"><table><caption class="sr">${esc(cap)}</caption><thead><tr>${head.map((x,i)=>`<th scope="col"${i?' class="n"':''}>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td class="n">${esc(c)}</td>`:`<th scope="row">${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
const vzBlock=(title,count,inner,sub)=>`<section class="block vzb"><div class="block-h"><h2>${esc(title)}</h2>${count?`<span class="count">${esc(count)}</span>`:''}</div>${sub?`<p class="vz-sub">${esc(sub)}</p>`:''}${inner}</section>`;
function emptyChart(msg){return `<div class="chart-empty">${esc(msg)}</div>`}

/* ---- details on hover, tap and keyboard: one small tooltip for every chart. Names come from what you typed, so they go in as text, never as markup. ---- */
function vzTipEl(){
 let t=VZ.tip;
 if(t&&t.isConnected)return t;
 t=document.createElement('div');t.className='vz-tip';t.setAttribute('role','status');t.hidden=true;
 document.body.appendChild(t);VZ.tip=t;return t;
}
function vzShow(d,ax,ay){
 const t=vzTipEl();
 t.textContent='';
 const h=document.createElement('div');h.className='vz-t';h.textContent=d.title;t.appendChild(h);
 d.rows.forEach(r=>{
  const row=document.createElement('div'),k=document.createElement('i'),v=document.createElement('b'),l=document.createElement('span');
  row.className='vz-r';k.className='vz-k k-'+r.k;v.textContent=r.v;l.textContent=r.l;
  row.appendChild(k);row.appendChild(v);row.appendChild(l);t.appendChild(row);
 });
 if(d.note){const n=document.createElement('div');n.className='vz-n';n.textContent=d.note;t.appendChild(n)}
 t.hidden=false;
 const w=t.offsetWidth,hh=t.offsetHeight,vw=document.documentElement.clientWidth;
 const x=Math.max(8,Math.min(vw-w-8,ax-w/2));

function vzHide(){
 if(VZ.tip)VZ.tip.hidden=true;
 document.querySelectorAll('.vz.hov').forEach(e=>e.classList.remove('hov'));
 document.querySelectorAll('.vz .col.on,.hb-r.on').forEach(e=>e.classList.remove('on'));
 VZ.cur=null;
}
function vzAt(s,i,hit){
 if(!s||i==null||i<0||i>=s.n)return;
 const host=document.querySelector('.vz[data-vz="'+s.id+'"]'),svg=host&&host.querySelector('svg');
 let ax,ay;
 if(svg&&s.at){const r=svg.getBoundingClientRect(),p=s.at(i,hit);ax=r.left+p.x;ay=r.top+p.y}
 else if(hit&&hit.getBoundingClientRect){const r=hit.getBoundingClientRect();ax=r.left+r.width/2;ay=r.top}
 else return;
 document.querySelectorAll('.vz.hov').forEach(e=>{if(e!==host)e.classList.remove('hov')});
 document.querySelectorAll('.vz .col.on').forEach(e=>{if(!host||!host.contains(e))e.classList.remove('on')});
 document.querySelectorAll('.hb-r.on').forEach(e=>e.classList.remove('on'));
 if(s.hover&&host)s.hover(i,host);
 else if(hit&&hit.classList&&hit.classList.contains('hb-r'))hit.classList.add('on');

 vzShow(s.tip(i),ax,ay);
}
function vzPointer(e){
 const t=e.target&&e.target.closest?e.target.closest('[data-vz-hit]'):null;
 if(!t){if(VZ.cur&&(e.type==='pointerdown'||e.pointerType==='mouse'))vzHide();return}
 const s=VZ.reg[t.getAttribute('data-vz-hit')];if(!s)return;
 let i;
 if(t.hasAttribute('data-i'))i=+t.getAttribute('data-i');
 else{const r=t.getBoundingClientRect();i=s.idx(e.clientX-r.left,t)}
 if(e.type!=='pointerdown'&&VZ.cur&&VZ.cur.id===s.id&&VZ.cur.i===i)return;
 vzAt(s,i,t);
}
function vzKey(e){
 const f=e.target&&e.target.closest?e.target.closest('.vz[data-vz]'):null;
 if(!f)return;
 const s=VZ.reg[f.dataset.vz];if(!s||!s.n)return;
 if(e.key==='Escape'){vzHide();return}
 let i=s.kb==null?s.n-1:s.kb;
 if(e.key==='ArrowRight')i=Math.min(s.n-1,i+1);
 else if(e.key==='ArrowLeft')i=Math.max(0,i-1);
 else if(e.key==='Home')i=0;
 else if(e.key==='End')i=s.n-1;
 else return;
 e.preventDefault();s.kb=i;vzAt(s,i,f);
}
function vzFocus(e){
 const f=e.target&&e.target.closest?e.target.closest('.vz[data-vz],.hb-r[data-vz-hit]'):null;
 if(!f)return;
 if(f.classList.contains('hb-r')){vzAt(VZ.reg[f.getAttribute('data-vz-hit')],+f.getAttribute('data-i'),f);return}
 const s=VZ.reg[f.dataset.vz];
 if(!s||!s.n||f.classList.contains('still'))return;
 try{if(!f.matches(':focus-visible'))return}catch(x){}
 vzAt(s,s.kb==null?s.n-1:s.kb,f);
}

/* ---- points each day: one violet bar per day, and the best day labeled ---- */
function chartPoints(keys,perDay){

  draw(W){
   const H=this.h,L=32,R=6,T=20,B=28,iw=W-L-R,ih=H-T-B,step=iw/n,bw=vzBw(step),X=i=>L+step*(i+.5),Y=v=>T+ih-v/sc.top*ih;

   vals.forEach((v,i)=>{if(v>0)g+=`<g class="col" data-i="${i}"><path class="b-acc" d="${vzTop(X(i)-bw/2,Y(v),bw,v/sc.top*ih,4)}"/></g>`});
   if(bi>=0){

/* ---- when it happens: 24 hours, with the busiest two hours softly shaded ---- */

  draw(W){
   const H=this.h,L=24,R=6,T=14,B=48,iw=W-L-R,ih=H-T-B,step=iw/24,bw=Math.max(3,Math.min(14,Math.round(step*.62*2)/2)),X=i=>L+step*(i+.5),Y=v=>T+ih-v/sc.top*ih,px=ih/sc.top;
   Object.assign(this,{L,step,X,Y});
   let g=vzGrid(L,W-R,T,ih,sc,v=>String(Math.round(v)));
   if(win){const i=bins.findIndex(b=>b.h===win.start);if(i>=0&&i<23)g+=`<rect class="vz-win" x="${(L+step*i+1).toFixed(1)}" y="${T}" width="${(step*2-2).toFixed(1)}" height="${ih}" rx="6"/>`}

   bins.forEach((b,i)=>{
    if(tot[i])g+=`<g class="col" data-i="${i}">${vzStack(X(i)-bw/2,bw,T+ih,px,[[b.rode,'b-rode'],[b.slipped,'b-slip']])}</g>`;

    while(j+1<24&&bucketOf(p2(bins[j+1].h)+':00')===bk)j++;
    const x1=L+step*i+2,x2=L+step*(j+1)-2,y=T+ih+28;
    g+=`<line class="band" x1="${x1.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y}" y2="${y}"/>`;
    if(x2-x1>=44)g+=`<text class="ax" x="${((x1+x2)/2).toFixed(1)}" y="${y+14}" text-anchor="middle">${esc(BUCKET_T[bk])}</text>`;
    i=j+1;
   }
   g+=`<rect class="vz-hit" data-vz-hit="${this.id}" x="${L}" y="0" width="${iw}" height="${T+ih+4}"/>`;
   return vzSvg(W,H,g);
  },
  idx(px){return Math.max(0,Math.min(n-1,Math.floor(px/this.step)))},

 };
 return vzFig(s,176,'Entries by hour of the day, rode it out and slipped')+(after||'')+vzTable('hours','Entries by hour',['Hour','Rode it out','Slipped'],bins.map(b=>[hr(b.h)+' to '+hr((b.h+1)%24),String(b.rode),String(b.slipped)]));

/* ---- ratings over time: four small charts that share one time scale and one 0 to 10 scale ---- */
function chartFeel(keys,series){
 const n=keys.length;
 const s={n,tiles:[],
  draw(W){
   const gap=12,tw=Math.floor((W-gap)/2),th=122,vg=12,H=th*2+vg,pad=14,iw=tw-pad*2,sy=62,sh=46;
   Object.assign(this,{tw,pad,iw,sy,sh,th,vg});
   this.tiles=[];
   let g='';
   series.forEach((sr,k)=>{
    const ox=(k%2)*(tw+gap),oy=Math.floor(k/2)*(th+vg),X=i=>ox+pad+(n<=1?iw/2:i*iw/(n-1)),Y=v=>oy+sy+sh-v/10*sh,base=oy+sy+sh;
    this.tiles.push({ox,oy,X,Y,sr});
    const have=sr.vals.filter(v=>v!=null),avg=have.length?have.reduce((a,b)=>a+b,0)/have.length:null;
    g+=`<g><rect class="ft-bg" x="${ox}" y="${oy}" width="${tw}" height="${th}" rx="18"/>`;
    g+=`<text class="ft-l" x="${ox+pad}" y="${oy+25}">${esc(sr.name.toUpperCase())}</text>`;
    g+=`<text class="ft-v" x="${ox+pad}" y="${oy+53}">${avg==null?'–':one(avg)}${avg==null?'':'<tspan dx="6">average</tspan>'}</text>`;
    g+=`<line class="grid" x1="${ox+pad}" x2="${ox+tw-pad}" y1="${Y(5).toFixed(1)}" y2="${Y(5).toFixed(1)}"/><line class="base" x1="${ox+pad}" x2="${ox+tw-pad}" y1="${base}" y2="${base}"/>`;
    /* runs of days with a rating. A gap of one or two days is bridged with a paler line, a longer gap breaks the line. */
    const runs=[];let cur=null,last=-1;
    sr.vals.forEach((v,i)=>{
     if(v==null)return;
     if(cur&&i-last>3)cur=null;
     if(!cur){cur=[];runs.push(cur)}
     cur.push(i);last=i;
    });
    let area='',solid='',pale='';
    runs.forEach(r=>{
     if(r.length>1){
      area+=`M${X(r[0]).toFixed(1)} ${base}`+r.map(i=>`L${X(i).toFixed(1)} ${Y(sr.vals[i]).toFixed(1)}`).join('')+`L${X(r[r.length-1]).toFixed(1)} ${base}Z`;
      for(let q=1;q<r.length;q++){
       const seg=`M${X(r[q-1]).toFixed(1)} ${Y(sr.vals[r[q-1]]).toFixed(1)}L${X(r[q]).toFixed(1)} ${Y(sr.vals[r[q]]).toFixed(1)}`;
       if(r[q]-r[q-1]===1)solid+=seg;else pale+=seg;
      }
     }
    });
    const gid='vzg'+this.id+k;
    g+=`<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="0" y1="${oy+sy}" x2="0" y2="${base}"><stop offset="0" class="ft-g0"/><stop offset="1" class="ft-g1"/></linearGradient></defs>`;
    g+=`<path class="ft-a" fill="url(#${gid})" d="${area}"/><path class="ft-ln br" d="${pale}"/><path class="ft-ln" d="${solid}"/>`;
    const few=have.length<=14;
    sr.vals.forEach((v,i)=>{
     if(v==null)return;
     const lone=(i===0||sr.vals[i-1]==null)&&(i===n-1||sr.vals[i+1]==null),end=i===sr.vals.length-1||sr.vals.slice(i+1).every(x=>x==null);
     if(few||lone||end)g+=`<circle class="ft-pt" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${end||few?4:3}"/>`;
    });
    g+=`<g class="vz-cx"><line class="cx-l" x1="0" x2="0" y1="${oy+sy-6}" y2="${base+2}"/><circle class="ft-pt" cx="0" cy="0" r="4.5"/></g>`;
    g+=`<rect class="vz-hit" data-vz-hit="${this.id}" data-k="${k}" x="${ox}" y="${oy+sy-14}" width="${tw}" height="${sh+34}"/></g>`;
   });
   return vzSvg(W,H,g);
  },
  idx(px,hit){
   const k=+(hit&&hit.getAttribute&&hit.getAttribute('data-k'))||0;
   void k;
   if(n<=1)return 0;
   return Math.max(0,Math.min(n-1,Math.round((px-this.pad)/this.iw*(n-1))));
  },
  at(i,hit){
   const k=+(hit&&hit.getAttribute&&hit.getAttribute('data-k'))||0,t=this.tiles[k];
   if(!t)return {x:0,y:0};
   const v=t.sr.vals[i];
   return {x:t.X(i),y:v==null?t.oy+this.sy:t.Y(v)};
  },
  hover(i,host){
   host.classList.add('hov');
   const groups=host.querySelectorAll('.vz-cx');
   this.tiles.forEach((t,k)=>{
    const gr=groups[k];if(!gr)return;
    const x=t.X(i),v=t.sr.vals[i],ln=gr.querySelector('line'),dot=gr.querySelector('circle');
    ln.setAttribute('x1',x.toFixed(1));ln.setAttribute('x2',x.toFixed(1));
    if(v==null)dot.setAttribute('visibility','hidden');
    else{dot.removeAttribute('visibility');dot.setAttribute('cx',x.toFixed(1));dot.setAttribute('cy',t.Y(v).toFixed(1))}
   });
  },
  tip(i){
   const any=series.some(sr=>sr.vals[i]!=null);
   return {title:vzFmtD(keys[i]),rows:any?series.map(sr=>({k:'acc',v:sr.vals[i]==null?'–':String(sr.vals[i]),l:sr.name})):[],note:any?'':'No check-in that day'};
  }
 };
 const rows=keys.map((k,i)=>[k,i]).filter(x=>series.some(sr=>sr.vals[x[1]]!=null)).reverse().map(x=>[vzFmtD(x[0])].concat(series.map(sr=>sr.vals[x[1]]==null?'–':String(sr.vals[x[1]]))));
 return vzFig(s,256,'Daily ratings from 0 to 10')+vzTable('feelings','Daily ratings from 0 to 10',['Day'].concat(series.map(sr=>sr.name)),rows);
}

/* ---- horizontal bars for a list of named things. A row is [{label, segs:[[value,class]], tot, tipRows, dim}] ---- */

function trigBars(rows){

/* a small trend line for a stat tile: no axes, the latest day marked */

function weekBody(){
 VZ.reg={};VZ.seq=0;vzHide();
 const st=Store.settings,tk=todayKey(),cw=Math.max(0,weekOf(tk,st));
 const wk=ui.week==null?cw:Math.min(Math.max(0,ui.week),cw);
 const w=weekStats(Store.days,st,wk),pw=wk>0?weekStats(Store.days,st,wk-1):null;
 const rv=Store.reviews['w'+wk],a=rv?rv.a:{hard:'',helped:'',change:'',proud:''};
 const rng=rangeLabel(w.lo,w.hi);
 let h=`<div class="wk-head"><div><h2>Week ${wk+1}</h2><p class="sub">${esc(rng)}${wk===cw?' · this week':''}</p></div>
  <div class="wk-nav"><button class="chip sq" type="button" data-act="week-nav" data-d="-1"${wk===0?' disabled':''} aria-label="Earlier week">‹</button><button class="chip sq" type="button" data-act="week-nav" data-d="1"${wk>=cw?' disabled':''} aria-label="Later week">›</button></div></div>`;
 const tile=(l,v,s)=>`<div class="stat"><small>${l}</small><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`;
 h+=`<section class="stats">${tile('Check-ins',w.checkins+' of 7')}${tile('Entries',w.events)}${tile('Rode it out',w.rode)}${tile('Slipped',w.slipped,w.slipDays?w.slipDays+' day'+(w.slipDays===1?'':'s'):'')}</section>`;
 const wkeys=[];for(let k=w.lo;k<=w.hi;k=addDays(k,1))wkeys.push(k);
 const avgTile=(l,cur,prev,f)=>{
  const d=(cur!=null&&prev!=null)?cur-prev:null;
  const t=d==null?'':d>0.05?'↑ '+one(Math.abs(d)):d<-0.05?'↓ '+one(Math.abs(d)):'→ same';
  const vals=wkeys.map(k=>{const c=Store.days[k]&&Store.days[k].checkin;return c&&typeof c[f]==='number'?c[f]:null});
  return `<div class="stat"><small>${l}</small><b>${one(cur)}</b><span>${t?t+' vs last week':'&nbsp;'}</span>${vals.some(v=>v!=null)?vzSpark(vals,wkeys,l+' each day this week'):''}</div>`;
 };
 h+=`<section class="block"><div class="block-h"><h2>Average ratings</h2><span class="count">0 to 10</span></div><div class="stats">${avgTile('Motivation',w.m,pw&&pw.m,'m')}${avgTile('Connection',w.c,pw&&pw.c,'c')}${avgTile('Energy',w.e,pw&&pw.e,'e')}${avgTile('Stress',w.s,pw&&pw.s,'s')}</div></section>`;
 const tt=topTrigger(w.evs,st.opts),bw=busiestWindow(w.evs,st.rollover);
 h+=`<section class="block"><div class="block-h"><h2>What the week shows</h2></div><dl class="notice"><dt>Most common trigger</dt><dd>${tt?esc(tt.t)+' ('+tt.n+')':'–'}</dd><dt>Busiest stretch</dt><dd>${bw?esc(bw.label):'Needs 3 or more entries with a time'}</dd></dl></section>`;
 if(wk===0){
  const d1=st.day1;
  h+=`<section class="block decide"><div class="block-h"><h2>What's next</h2></div>
   <p>This first week is for noticing. Nothing is counted yet, so there is nothing to fail. When it ends, you choose: start counting days (Day 1), or keep tracking without counting. Both are fine.</p>
   <p class="strong">${d1?'Day 1 of quitting is set for '+esc(fmtDate(d1,{weekday:'long',month:'short',day:'numeric'}))+'.':'No Day 1 is set. You are just tracking for now.'}</p>
   <div class="chips">${d1?`<button class="chip" type="button" data-act="day1" data-v="later">Move it a week later</button><button class="chip" type="button" data-act="day1" data-v="none">Not yet, keep tracking</button>`:`<button class="chip" type="button" data-act="day1" data-v="tomorrow">Start Day 1 tomorrow</button><button class="chip" type="button" data-act="day1" data-v="week">Start in a week</button>`}</div>
   <button class="link" type="button" data-act="mode-open">What is the difference?</button></section>`;
 }
 h+=`<section class="block"><div class="block-h"><h2>Questions for day 7</h2></div><ol class="qs">
  <li>Are my ratings changing? (Journal › Patterns › Feelings over time)</li>
  <li>Are urges strongest when I'm bored, lonely, stressed, or in bed? (Journal › Patterns › What sets it off)</li>
  <li>Don't assume this habit caused every low rating. Use the numbers to learn.</li>
  <li>Seven data points are noisy. Look again at 14 and 30 days.</li></ol></section>`;
 h+=`<section class="block"><div class="block-h"><h2>My review</h2><span class="count">about 10 minutes · +20 points</span></div>
  ${REVIEW_QS.map(q=>`<label class="field"><span>${q[1]}</span><textarea rows="3" maxlength="1500" data-rv="${q[0]}" data-k="${wk}">${esc(a[q[0]])}</textarea></label>`).join('')}</section>`;
 return h;
}

/* ---------- my plan ---------- */
/* ---------- my slip plan: the person's own steps, edited the way the urge plan is ----------
   The saved list never holds a blank step. The rows on screen can (a step just added, not written yet), so they are kept in ui.slipDraft
   until the saved list changes some other way. */
function slipClean(a){return (a||[]).map(x=>String(x==null?'':x).trim()).filter(Boolean)}
function slipSteps(){const st=Store.settings;return (st&&Array.isArray(st.slipPlan))?st.slipPlan:SLIP_STEPS}
function slipRows(){
 const cur=slipSteps();
 if(!ui.slipDraft||slipClean(ui.slipDraft).join('\n')!==cur.join('\n'))ui.slipDraft=cur.slice();
 return ui.slipDraft;
}
function slipSave(){const rows=ui.slipDraft.slice();saveSettings(s=>{s.slipPlan=rows})}
/* what Today shows after a slip: the person's steps. The starter's first step (log it) is left out only while it is the starter's, because the slip was just logged. */
/* while typing the page is not redrawn, so the count and the reset link are updated in place */
function slipRefresh(){
 const rows=slipRows(),filled=slipClean(rows).length,starter=slipClean(rows).join('\n')===SLIP_STEPS.join('\n');
 const c=document.getElementById('slip-count');if(c)c.textContent=filled+' of '+SLIP_MAX+' steps';
 const r=document.getElementById('slip-reset-link');if(r)r.hidden=starter;
}
function slipCare(){const s=slipSteps();return (s.length&&s[0]===SLIP_STEPS[0])?s.slice(1):s.slice()}
function slipEditor(){
 const rows=slipRows(),n=rows.length,filled=slipClean(rows).length,isStarter=slipClean(rows).join('\n')===SLIP_STEPS.join('\n');
 let h=`<section class="block"><div class="block-h"><h2>If I slip</h2><span class="count" id="slip-count">${filled} of ${SLIP_MAX} steps</span></div>
  <p class="detail">Read this now, while it is calm. A slip is data, not a reset. These are your steps: change them so they sound like you. After you log a slip, they show on Today. Changes save as you type.</p>`;
 if(!n)h+=`<p class="empty">No steps yet. Add one, or go back to the starter plan.</p>`;
 h+=`<ol class="slip-rows">`+rows.map((t,i)=>{
  if(ui.slipDel===i&&t.trim()){
   return `<li class="pl slip-row"><p class="slip-old"><b>Step ${i+1}.</b> ${esc(t)}</p><div class="confirm"><span>Remove this step?</span><button class="btn btn-ghost danger" type="button" data-act="slip-del-yes" data-i="${i}">Yes, remove it</button><button class="btn btn-ghost" type="button" data-act="slip-del-no" data-i="${i}">Keep it</button></div></li>`;
  }
  return `<li class="pl slip-row"><label class="field"><span>Step ${i+1}</span><textarea rows="2" maxlength="${SLIP_LEN}" data-slip="${i}" enterkeyhint="done" placeholder="What I will do after a slip">${esc(t)}</textarea></label>
   <div class="rs-act" role="group" aria-label="Step ${i+1} of ${n}">
    <button class="rs-b sq" type="button" data-act="slip-up" data-i="${i}" aria-label="Move step ${i+1} up"${i===0?' disabled':''}>${ic('up')}</button>
    <button class="rs-b sq" type="button" data-act="slip-down" data-i="${i}" aria-label="Move step ${i+1} down"${i===n-1?' disabled':''}>${ic('down')}</button>
    <button class="rs-b sq danger" type="button" data-act="slip-del" data-i="${i}" aria-label="Remove step ${i+1}">${ic('trash')}</button>
   </div></li>`;
 }).join('')+`</ol>`;
 h+=`<div class="actions"><button class="btn btn-soft" type="button" data-act="slip-add"${n>=SLIP_MAX?' disabled':''}>${ic('plus')} Add a step</button></div>`;
 if(n>=SLIP_MAX)h+=`<p class="hint">That is the most steps. Shorter is easier to follow on a hard night.</p>`;
 if(ui.slipAsk){
  h+=`<div class="confirm"><span>Replace my steps with the starter plan?</span><button class="btn btn-ghost danger" type="button" data-act="slip-reset-yes">Yes, replace them</button><button class="btn btn-ghost" type="button" data-act="slip-reset-no">Keep mine</button></div>`;
 }else{
  h+=`<button class="link center" type="button" id="slip-reset-link" data-act="slip-reset"${isStarter?' hidden':''}>Go back to the starter plan</button>`;
 }
 return h+`</section>`;
}

/* ---------- my playbook: the person's own words and the lessons' one-line takeaways, together ---------- */
function playbookData(){
 const st=Store.settings,done=lessonsDone(),notes=(st.learn&&st.learn.notes)||{};
 return {
  st,notes,
  reasons:st.reasons||[],
  rule:(st.rule||'').trim(),
  plan:(st.plan||[]).filter(r=>r.when&&r.when.trim()&&r.when.indexOf('______')<0),
  slip:slipSteps().slice(),
  mine:LESSONS.filter(L=>done.has(L.id)),
  picks:(st.learn&&st.learn.picks)||{},
  wrote:LCHECKS.map((C,k)=>({n:k+1,C,a:lwriteOf(k+1)})).filter(x=>x.a.some(t=>t.trim()))
 };
}
function playbookText(){
 const d=playbookData(),o=['MY PLAYBOOK',''];
 o.push('Why I am doing this');
 if(d.reasons.length)d.reasons.forEach(r=>o.push('- '+r));else o.push('(no reasons yet)');
 o.push('');
 if(d.rule)o.push('My rule',d.rule,'');
 if(d.plan.length){o.push('If this, then that');d.plan.forEach(r=>o.push('If '+r.when.trim()+', then '+((r.then||'').trim()||'(not filled in yet)')));o.push('')}
 if(d.slip.length){o.push('If I slip');d.slip.forEach((t,i)=>o.push((i+1)+'. '+t));o.push('')}
 if(d.mine.length){
  o.push('What I have learned');
  d.mine.forEach(L=>{o.push((lessonIndex(L)+1)+'. '+L.title+': '+L.key);if(d.picks[L.id])o.push('   I picked: '+d.picks[L.id]);if(d.notes[L.id])o.push('   My note: '+String(d.notes[L.id]).replace(/\r?\n/g,'\n   '))});
 }
 if(d.wrote.length){o.push('');o.push('What I wrote');d.wrote.forEach(x=>{o.push('Checkpoint '+x.n+': '+x.C.t);x.C.q.forEach((q,i)=>{if(x.a[i]&&x.a[i].trim())o.push('- '+q+'\n  '+x.a[i].replace(/\r?\n/g,'\n  '))})})}
 return o.join('\n').trim();
}
function viewBook(){
 const d=playbookData();

 h+=`<p class="detail-p">Read this on a hard night, or just before one. It gathers what you wrote and what you took from each lesson, in one place. Only you see it.</p>`;
 h+=hcard('Why I am doing this',d.reasons.length?UL(d.reasons.map(esc)):P('No reasons yet. Add one and it shows up here.'),`<button class="link" type="button" data-act="reasons-open" data-from="book">Open my reasons</button>`);
 if(d.rule)h+=hcard('My rule',P(esc(d.rule)));
 h+=hcard('If this, then that',d.plan.length
  ?`<div class="ls-plan">${d.plan.map(r=>`<p><b>If</b> ${esc(r.when)}<br><b>Then</b> ${r.then&&r.then.trim()?esc(r.then):'<i>not filled in yet</i>'}</p>`).join('')}</div>`
  :P('Your urge plan is empty. Fill in a line and it shows up here.'),`<button class="link" type="button" data-act="help-open" data-v="plan" data-sub="urge">Open my urge plan</button>`);
 h+=hcard('If I slip',d.slip.length?`<ol class="qs">${d.slip.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:P('No steps yet. Add one and it shows up here.'),`<button class="link" type="button" data-act="help-open" data-v="plan" data-sub="slip">Open my slip plan</button>`);
 h+=hcard('What I have learned',d.mine.length
  ?d.mine.map(L=>`<div class="pb-l"><b>${lessonIndex(L)+1}. ${esc(L.title)}</b><p>${esc(L.key)}</p>${d.picks[L.id]?`<p class="pb-note"><small>What I picked</small>${esc(d.picks[L.id])}</p>`:''}${d.notes[L.id]?`<p class="pb-note"><small>${esc(L.np)}</small>${esc(d.notes[L.id])}</p>`:''}</div>`).join('')
  :P('Finish a lesson and its one-line takeaway shows up here, with your note.'),`<button class="link" type="button" data-act="help-open" data-v="lessons">All lessons</button>`);

 h+=hcard('What I wrote',d.wrote.length
  ?d.wrote.map(x=>`<div class="pb-l"><b>Checkpoint ${x.n}: ${esc(x.C.t)}</b>${x.C.q.map((q,i)=>x.a[i]&&x.a[i].trim()?`<p class="pb-note"><small>${esc(q)}</small>${esc(x.a[i])}</p>`:'').join('')}</div>`).join('')
  :P('After every second lesson there is a short piece of writing. What you write shows up here. Only you see it.'),d.wrote.length?'':`<button class="link" type="button" data-act="help-open" data-v="lessons">Open the lessons</button>`);
 h+=`<button class="btn btn-soft wide" type="button" data-act="copy" data-t="${esc(playbookText())}">${ic('copy')} Copy it all as text</button>`;
 return h+helpFoot();
}

/* ---------- lessons ---------- */
const LF_FILTERS=[['all','All'],['todo','To do'],['done','Done'],['notes','Notes']];
const LF_ORDER=[['mix','Mixed in'],['first','First'],['after','Last']];
const lfDate=k=>{const y=String(todayKey()).slice(0,4);return fmtDate(k,k.slice(0,4)===y?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})};
const lfClip=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s};
/* One lesson in a list. x.full adds what you kept from a finished lesson: when you finished it, its one-line takeaway, and the start of your note. */
function lessonRow(L,done,next,x){
 x=x||{};
 const d=done.has(L.id),n=lessonIndex(L)+1,notes=x.notes||{},note=notes[L.id]?String(notes[L.id]).trim():'',st=x.stats||{first:{},last:{},again:{}};
 const fin=st.first[L.id],again=st.again[L.id]||0,lastK=st.last[L.id];
 const prac=!!(Store.settings.learn&&Store.settings.learn.prac&&Store.settings.learn.prac[L.id]);
 const status=d?`<span class="lr-s ok">${ic('check')}Done</span>`:L.id===next?'<span class="lr-s now">Up next</span>':`<span class="lr-s">${lmin(L)}</span>`;
 const when=d?'Finished'+(fin?' '+lfDate(fin):'')+(again?', read again '+(again===1?'once':'on '+again+' days')+(lastK&&lastK!==fin?' (last '+lfDate(lastK)+')':''):'')+(prac?' · practiced':''):'';
 const tag=L.f?'<span class="lr-tag">Faith</span>':'';
 const full=!!(x.full&&d);
 const sub=full?`<small>${tag}${esc(when)}</small>`:`<small>${tag}${esc(L.tag)}${note?' · note saved':''}${prac?' · practiced':''}</small>`;
 /* what you kept from a finished lesson sits under the title and spans the whole row, so it is easy to read on a phone */
 const more=full?`<span class="lr-x"><span class="lr-k"><i>The one thing to keep</i>${esc(L.key)}</span>${note?`<span class="lr-n"><i>${esc(L.np)}</i>${esc(lfClip(note,220))}</span>`:''}</span>`:'';
 return `<li><button class="lrow tone-${LUNITS[L.u].tone}${d?' done':''}${full?' full':''}" type="button" data-act="lesson" data-v="${L.id}" aria-label="Lesson ${n}: ${esc(L.title)}. ${L.f?'Faith lesson. ':''}${d?'Done'+(fin?', finished '+lfDate(fin):'')+'. ':''}${lessonHasQuick(L)?'Quick, 1 to 2 minutes, or Full, 3 to 5 minutes.':L.mins+' minutes.'}${note?' Note saved.':''}"><span class="lr-ic">${d?ic('check'):ic(L.ic)}</span><span class="lr-t"><b><span class="lr-no">${n}</span>${esc(L.title)}</b>${sub}</span>${status}${more}</button></li>`;
}
function lessonsBody(){
 const st=Store.settings,done=lessonsDone(),n=done.size,total=LESSONS.length,nxt=firstUndone(done),nid=nxt&&nxt.id,path=lessonPath();
 const stats=lessonStats(),notes=(st.learn&&st.learn.notes)||{},hasNote=L=>!!(notes[L.id]&&String(notes[L.id]).trim());
 const f=LF_FILTERS.some(c=>c[0]===ui.lf.f)?ui.lf.f:'all',mode=(st.learn&&st.learn.faith)||'after',nf=LESSONS.filter(L=>L.f).length;
 const x={stats,notes},recent=(a,b)=>(stats.seq[b.id]||0)-(stats.seq[a.id]||0);
 const lastId=Object.keys(stats.seq).filter(id=>lessonById(id)).sort((a,b)=>stats.seq[b]-stats.seq[a])[0],lastL=lastId?lessonById(lastId):null;
 let h='';
 h+=`<section class="hh-card tone-sky"><div class="hh-top"><span class="hh-ic">${ic('book')}</span><div class="hh-t"><h2>${n===total?'All done':n?'Keep going':'Start anywhere'}</h2><p>Pick Quick (1 to 2 minutes) or Full (3 to 5) for each lesson. Finishing one earns 10 points, once.</p></div><span class="count">${n} of ${total}</span></div>
  <div class="ls-segs" style="--c:${total}" role="img" aria-label="${n} of ${total} lessons done">${LESSONS.map(L=>`<i class="${done.has(L.id)?'on':''}"></i>`).join('')}</div>
  ${nxt?`<div class="hh-up"><small>${n?'Up next':'Start here'}</small><b>Lesson ${lessonIndex(nxt)+1}: ${esc(nxt.title)}</b></div>`:''}
  <div class="hh-btns">${nxt?`<button class="btn btn-primary" type="button" data-act="lesson" data-v="${nxt.id}">${n?'Continue':'Start lesson '+(lessonIndex(nxt)+1)}</button>`:''}${lastL?`<button class="btn btn-ghost" type="button" data-act="lesson" data-v="${lastL.id}" aria-label="Read lesson ${lessonIndex(lastL)+1}, ${esc(lastL.title)}, again">Read last again</button>`:''}</div>
  ${lastL?`<p class="lf-sub">Last read: lesson ${lessonIndex(lastL)+1}, ${esc(lastL.title)}${stats.last[lastL.id]?' ('+lfDate(stats.last[lastL.id])+')':''}.</p>`:''}</section>`;
 const due=lcheckDue();
 if(due)h+=`<section class="hh-card tone-violet"><div class="hh-top"><span class="hh-ic">${ic('pencil')}</span><div class="hh-t"><h2>Write it out</h2><p>Checkpoint ${due}: ${esc(LCHECKS[due-1].t)}. A short piece of writing about lessons ${2*due-1} and ${2*due}. 3 to 5 minutes, no points, only you see it.</p></div></div><div class="hh-btns"><button class="btn btn-primary" type="button" data-act="lwrite" data-v="${due}">Start writing</button></div></section>`;
 const counts={all:total,todo:total-n,done:n,notes:LESSONS.filter(hasNote).length};
 h+=`<div class="lf-chips" role="group" aria-label="Show these lessons">${LF_FILTERS.map(c=>`<button class="chip" type="button" aria-pressed="${f===c[0]}" data-act="lfilter" data-v="${c[0]}">${c[1]} <b>${counts[c[0]]}</b></button>`).join('')}</div>`;
 if(nf)h+=det('l-order','Daily order','Faith lessons: '+LF_ORDER.find(o=>o[0]===mode)[1].toLowerCase(),
  `<p class="hint">This only changes which lesson Daybook offers next. The ${nf} faith lessons are in the last unit, and you can open any lesson at any time.</p>
   <div class="seg lorder" role="group" aria-label="Where the faith lessons go">${LF_ORDER.map(o=>`<button class="chip" type="button" aria-pressed="${mode===o[0]}" data-act="lorder" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>
   <p class="hint">${mode==='mix'?'Mixed in: one faith lesson after every two others.':mode==='first'?'First: the faith lessons come before the others.':'Last: the faith lessons come after the others. This is the usual order, so Up next always follows the lesson numbers.'}</p>`);
 const list=(arr,full)=>`<ul class="lrows">${arr.map(L=>lessonRow(L,done,nid,{stats,notes,full})).join('')}</ul>`;
 if(f==='all'){
  LUNITS.forEach((u,k)=>{
   const ls=LESSONS.filter(L=>L.u===k),dn=ls.filter(L=>done.has(L.id)).length;
   h+=`<section class="block lunit tone-${u.tone}"><div class="lu-h"><span class="eyebrow">Unit ${k+1} · ${dn} of ${ls.length} done</span><h2>${esc(u.name)}</h2><p class="hint">${esc(u.sub)}</p>${u.faith?`<p class="lf-sub">${mode==='mix'?'In your daily order, one comes after every two other lessons.':mode==='first'?'In your daily order, these come first.':'In your daily order, these come last.'}</p>`:''}</div>${list(ls,false)}</section>`;
  });
 }else{
  let arr,title,sub,empty;
  if(f==='todo'){arr=path.filter(L=>!done.has(L.id));title='To do';sub='in your daily order';empty='You have finished every lesson. Open Done to read any of them again.'}

/* ===== HOW DAYBOOK WORKS: the setup, and the walk-through that can be opened again any time =====
   Seven sections, each with its own color. The bar at the top shows how far you are in this section only, and starts again at the next one.
   One question per page, asked as a full, plain question. Between the questions, short pages with a picture show what Daybook does,
   what it takes, and what to expect. Most pictures are small copies of the real screens.
   Answers change what comes next: the SOS page shows the tool picked for your hardest moment, the chart marks your hard hours,
   and the page after "Have you tried to quit before?" answers what you said.
   Each hard number sits next to a way out on the same page, because a scare with no next step makes people look away.
   A new person sees it first, and their plan is built from their answers, so nothing of anyone else's is filled in.
   Opened again from More or Settings, nothing changes until the last page. There the person ticks which changes to keep.
   The answers and each self-check score are kept in settings.onb, so the next walk-through can show "last time". The score itself is never shown.
   Every number on these pages comes from a source listed on the same page, behind "Behind this" (checked October 13, 2026).
   Single-choice pages move on by themselves after a tap. Back always works, and every question can be skipped. */
const OB_SECS=[
 ['welcome','Welcome','sky','sun'],['you','About you','violet','compass'],['check','Quick check','accent','heart'],
 ['facts','The facts','slip','chart'],['helps','How Daybook helps','mint','life'],['expect','What to expect','sky','sunrise'],['plan','Your plan','sun','shield']
];
const OB_AIM=[['quit','Quit for good','flag'],['less','Use it a lot less','sliders'],['nights','Take back my nights','moon'],['learn','Understand my pattern','compass']];
const OB_FREQ=[['f0','Less than once a week',.5,'less than once a week'],['f1','1 to 2 times',1.5,'1 to 2 times a week'],['f2','3 to 5 times',4,'3 to 5 times a week'],['f3','About once a day',7,'about once a day'],['f4','More than once a day',14,'more than once a day']];
const OB_MINS=[['m0','Under 15 minutes',10,'under 15 minutes'],['m1','15 to 30 minutes',22,'15 to 30 minutes'],['m2','30 minutes to an hour',45,'30 minutes to an hour'],['m3','1 to 2 hours',90,'1 to 2 hours'],['m4','More than 2 hours',150,'more than 2 hours']];
const OB_YEARS=[['y0','Less than a year',.5],['y1','1 to 3 years',2],['y2','3 to 10 years',6],['y3','More than 10 years',12]];
const OB_TRIED=[['t0','No, this is my first real try','flag'],['t1','Yes, once or twice','sunrise'],['t2','Yes, many times','dots']];
const OB_FAITH=[['big','Yes, a big part','star'],['some','Somewhat','sparkle'],['no','No','wind']];
/* the Brief Pornography Screen (Kraus et al., 2020): five statements about the last 6 months, each scored 0, 1 or 2.
   4 or more is a positive screen (worth a closer look), and the authors say 6 or more may point to a need for professional help.

function importFile(file){

 fr.onload=()=>{
  try{
   const o=JSON.parse(fr.result);
   if(!o||o.app!=='daybook'||typeof o.days!=='object')throw new Error('not a backup');
   let n=0;
   Object.keys(o.days||{}).forEach(k=>{
    if(!isKey(k))return;
    const d=normDay(o.days[k],k);
    if(!d.events.length&&!d.checkin&&!d.p)return;
    saveDay(k,x=>{x.events=d.events;x.checkin=d.checkin;x.p=d.p});n++;
   });
   /* restoring never drops the answers you added: the backup's and the ones already here are combined */
   if(o.settings)saveSettings(s=>{const mine=s.opts;Object.assign(s,normSettings(o.settings));s.opts=mergeOpts(mine,s.opts)});
   Object.keys(o.reviews||{}).forEach(k=>{if(/^w\d+$/.test(k)){const r=normReview(o.reviews[k],k);saveReview(+k.slice(1),x=>{x.a=r.a})}});
   toast(`Restored ${n} day${n===1?'':'s'}.`);render(true);
  }catch(e){toast('That file is not a Daybook backup.')}
 };
 fr.onerror=()=>toast('Could not read that file.');
 fr.readAsText(file);
}
