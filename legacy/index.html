  --hero-deco:radial-gradient(ellipse 62px 22px at 16% 20%,rgba(255,255,255,.9),transparent 72%),radial-gradient(ellipse 84px 26px at 86% 14%,rgba(255,255,255,.85),transparent 72%),radial-gradient(ellipse 70px 22px at 93% 60%,rgba(255,255,255,.6),transparent 72%),radial-gradient(ellipse 92px 26px at 6% 66%,rgba(255,255,255,.6),transparent 72%);
  --g-sky:linear-gradient(180deg,#CFEBFF,#FFF0C2); --g-mint:linear-gradient(180deg,#D3F3FF,#D9F7E9); --g-sun:linear-gradient(180deg,#FFF0BF,#FFE3DE);
  --g-coral:linear-gradient(180deg,#FFE3DE,#FFF0D6); --g-violet:linear-gradient(180deg,#EBE5FF,#FFE6F1); --g-night:linear-gradient(180deg,#2A2275,#120E38);

}

  --g-sky:linear-gradient(180deg,#1C2A78,#3D2B7C); --g-mint:linear-gradient(180deg,#12456A,#135B57); --g-sun:linear-gradient(180deg,#4C2F6E,#6B3F5E);

  --sc-btn:rgba(255,255,255,.16);
}}

/* Daybreak: a cheerful, phone-first look. Cream paper, a friendly sun that grows as you do, chunky buttons, rounded cards.
   Colors come from the tokens above. Every animation is switched off for people who ask their phone for less motion. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow-x:hidden}
html.lock,html.lock body{overflow:hidden}
h1,h2,h3,h4,p,ul,ol,dl,dd,dt{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}
[hidden]{display:none!important}

.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.wrap>*{min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.strong{font-weight:700}
.insight{font-size:15px}
.center-t{text-align:center}
p.empty{color:var(--muted);font-size:15px}
.code{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--surface2);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}

/* tones: one set of variables that cards, badges, and tools share */
.tone-sun{--t-soft:var(--sun-soft);--t-text:var(--sun-text);--t-ic:var(--sun);--t-ink:var(--on-sun)}
.tone-mint{--t-soft:var(--mint-soft);--t-text:var(--mint-text);--t-ic:var(--mint);--t-ink:var(--bdg-ink)}
.tone-coral{--t-soft:var(--coral-soft);--t-text:var(--coral-text);--t-ic:var(--coral);--t-ink:var(--bdg-ink)}
.tone-sky{--t-soft:var(--sky-soft);--t-text:var(--sky-text);--t-ic:var(--sky);--t-ink:var(--bdg-ink)}
.tone-violet{--t-soft:var(--violet-soft);--t-text:var(--violet-text);--t-ic:var(--violet);--t-ink:var(--bdg-ink)}
.tone-accent{--t-soft:var(--accent-soft);--t-text:var(--accent-text);--t-ic:var(--accent);--t-ink:var(--accent-ink)}
.tone-slip{--t-soft:var(--slip-soft);--t-text:var(--slip-text);--t-ic:var(--slip);--t-ink:var(--bdg-ink)}

/* header */
.top{display:flex;flex-direction:column;gap:6px}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-r{display:flex;align-items:center;gap:8px}
.date{font:600 34px/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.sync{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.dot.busy,.dot.warn{background:var(--sun-deep)}
.dot.bad{background:var(--danger)}
.gear{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.gear .ic{width:22px;height:22px}
.gear[aria-current=page]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.link.back{align-self:flex-start;gap:4px;text-decoration:none;padding-inline:0}
.banner{padding:12px 14px;border-radius:16px;background:var(--sun-soft);color:var(--sun-text);font-size:14px}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.banner.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--violet-soft);color:var(--violet-text);font-weight:600}
.banner.timer.done{background:var(--mint-soft);color:var(--mint-text)}
.banner.timer .btn{min-height:44px;padding:0 14px;font-size:15px;flex:none}

/* ---------- the hero: sun, ring, wins ---------- */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:14px 14px 16px;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:var(--hero-deco);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.hero>*{position:relative}
.hero-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl-pill,.pts-pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--hero-pill);color:var(--hero-ink);font-weight:700;font-size:13px;white-space:nowrap}
.pts-pill b{font-variant-numeric:tabular-nums}
button.lvl-pill{position:relative;border:0;font-family:inherit;cursor:pointer;padding-right:8px}
button.lvl-pill::after{content:"";position:absolute;inset:-7px -4px}
button.lvl-pill .ic{width:16px;height:16px}
button.lvl-pill:active{transform:scale(.97)}
.sun-wrap{position:relative;width:188px;height:188px;padding:0;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:inherit}
.sun-wrap::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--hero-glow),transparent 68%);animation:glow 3.8s ease-in-out infinite}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-bg{fill:none;stroke:var(--ring-track);stroke-width:9}
.ring-fg{fill:none;stroke:var(--ring);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.sun-in{position:relative;display:grid;place-items:center}
.sun{display:block;overflow:visible}
.sn-rays{transform-box:view-box;transform-origin:50% 50%;animation:turn 60s linear infinite}
.sn-glow{transform-box:fill-box;transform-origin:center;animation:glow 3.8s ease-in-out infinite}
.sn-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.6s infinite}
/* the flame spirit: every part that moves is a small, calm loop. Reduced motion turns all of it off. */
.emb .em-fig{transform-box:fill-box;transform-origin:50% 88%}
.emb .em-bob{animation:emBob 4.6s ease-in-out infinite}
.emb .em-fig.wiggle{animation:wiggle .75s ease}
.emb .em-flame{transform-box:fill-box;transform-origin:50% 100%;animation:emFlick 2.6s ease-in-out infinite}
.emb .em-inner{transform-box:fill-box;transform-origin:50% 100%;animation:emFlick 1.9s ease-in-out infinite reverse}
.emb .em-up{animation:emUp 3s ease-out infinite}
.emb .em-tw{animation:emTw 3.2s ease-in-out infinite}
.emb .em-twk{transform-box:fill-box;transform-origin:center;animation:emTwk 3s ease-in-out infinite}
.emb .em-beam{animation:emBeam 4.2s ease-in-out infinite}
.emb .em-cloud{animation:emDrift 14s ease-in-out infinite alternate}
.emb .em-bird{animation:emDrift 9s ease-in-out infinite alternate}
.emb .em-wave{animation:emDrift 5s ease-in-out infinite alternate}
.emb .em-orbit{transform-box:view-box;transform-origin:50% 50%;animation:turn 48s linear infinite}
.emb.still *,.emb.locked *{animation:none!important}
.emb.locked{filter:grayscale(1) brightness(.78);opacity:.5}
.ring-cap{font-size:15px}
.ring-cap b{font:600 22px var(--font-display)}
.wins{display:grid;grid-template-columns:repeat(var(--wn,5),minmax(0,1fr));gap:2px;width:100%}
.wins.dense .win-l{font-size:11px}
.wins.dense .win-c{width:42px;height:42px}
.win{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:78px;padding:6px 0 4px;background:none;border:0;border-radius:14px;color:var(--hero-ink)}
.win-c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--hero-pill);border:2px solid transparent;transition:background .3s,transform .3s}
.win-c .ic{width:24px;height:24px}
.win-l{font-size:12px;font-weight:600;line-height:1.15;text-align:center}
.win.done .win-c{background:var(--sun);color:var(--on-sun);box-shadow:0 3px 0 var(--sun-deep)}
.win.na{opacity:.6}
.win.na .win-c{background:transparent;border:2px dashed currentColor}
.win.pop .win-c{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.hero-note{font-size:15px;text-align:center;text-wrap:balance;max-width:34ch}
.lvl-wrap{width:100%;display:flex;flex-direction:column;gap:6px}
.lvl-bar{height:12px;border-radius:6px;background:var(--hero-pill);overflow:hidden}
.lvl-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lvl-sub{font-size:13px;text-align:center}
.lvl-sub b{font-variant-numeric:tabular-nums}
.hero-cta{width:100%;display:grid;gap:10px;margin-top:4px}
.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 18px;border-radius:18px;border:2px solid transparent;font:600 18px/1.1 var(--font-body);text-align:center;transition:transform .08s,box-shadow .08s}
.hbtn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-deep)}
.hbtn.pri .ic{width:24px;height:24px}
.hbtn.pri:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
/* the second hero button is "alt", not "sec": .sec is already the section stack further down */
.hbtn.alt{background:var(--surface);color:var(--accent-text);border-color:var(--accent);box-shadow:0 4px 0 var(--ring-track)}
.hbtn.alt .ic{width:24px;height:24px}
.hbtn.alt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ring-track)}
/* the quiet way into a check-in: a text link under the pause button, so logging never competes with getting help */
.hlink{justify-self:center;display:inline-flex;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:0 10px;border:0;background:none;color:var(--hero-ink);font:600 15px/1.2 var(--font-body);text-align:center}
.hlink span{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.hlink .ic{width:16px;height:16px;stroke-width:2.4}
.hlink:active{opacity:.7}

/* blocks (cards) and the ledger */
.block{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--card-edge);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.block.wk-block{background:none;border:0;box-shadow:none;padding:0}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.block-h h2{font:600 22px/1.2 var(--font-display)}
.wk-block .block-h{flex-direction:column;align-items:flex-start;gap:2px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail{color:var(--muted);font-size:14px;margin-top:-6px}
h3{font:600 16px/1.3 var(--font-body)}
h3 small,.field small{font-weight:500;color:var(--muted)}
ul.ledger,ul.days,ul.chks,ul.ms,ul.hb,ul.thr,ul.src,ul.how,ul.quests,ul.badges,ul.pts-list,ol.ladder,ul.hl{list-style:none;padding:0;margin:0}
.ledger li{border-top:1.5px solid var(--line)}
.ledger li:last-child{border-bottom:1.5px solid var(--line)}
.row-btn{display:grid;grid-template-columns:82px 16px minmax(0,1fr) 14px;align-items:center;gap:10px;width:100%;min-height:60px;padding:10px 2px;background:none;border:0;text-align:left}
.t{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.mark{width:16px;height:16px;border-radius:50%;justify-self:center}
.mark.rode{border:3px solid var(--teal)}
.mark.slip{background:var(--slip)}
.what{display:flex;flex-direction:column;min-width:0}
.what b{font-weight:600}
.what small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chev{color:var(--muted);font-size:22px;line-height:1}

.care{background:var(--slip-soft);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.care h2{font:600 20px/1.2 var(--font-display);color:var(--slip-text)}
.care p{font-size:15px;color:var(--ink)}
.care ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.care.in{padding:14px;gap:8px;border-radius:16px}
.done-line{color:var(--slip-text);font-weight:600}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:2px solid var(--card-edge);border-radius:22px;background:var(--surface)}
.nudge>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.nudge span{color:var(--muted);font-size:14px}
.nudge .btn{flex:none;white-space:nowrap}
.next{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:22px;background:var(--accent-soft)}
.next .eyebrow{color:var(--accent-text)}
.next p{font-size:15px}

/* the day's path: morning, evening, night */
.path .count{background:var(--surface2);padding:3px 10px;border-radius:999px}
.stop{border:2px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.stop+.stop{margin-top:2px}
.stop>summary{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:68px;padding:10px 14px;list-style:none;cursor:pointer}
.stop>summary::-webkit-details-marker{display:none}
.stop-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.stop-ic .ic{width:24px;height:24px}
.stop-t b{display:block;font-weight:700}
.stop-t small{color:var(--muted);font-size:13px}
.stop-s{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.stop.now,.stop.due{border-color:var(--sun-deep)}
.stop.now .stop-ic,.stop.due .stop-ic{background:var(--sun);color:var(--on-sun);animation:pulse 2.4s ease-in-out infinite}
.stop.now .stop-s,.stop.due .stop-s{background:var(--sun-soft);color:var(--sun-text)}
.stop.done{border-color:var(--mint)}
.stop.done .stop-ic{background:var(--mint);color:var(--bdg-ink)}
.stop.done .stop-s{background:var(--mint-soft);color:var(--mint-text)}
.stop-in{padding:2px 14px 16px;display:flex;flex-direction:column;gap:14px}
.mbody,.wbody{display:flex;flex-direction:column;gap:14px}
.note-line{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface2)}

/* check-in */
.ci{display:flex;flex-direction:column;gap:18px}
.rate{display:flex;flex-direction:column;gap:0}
.rate-top{display:flex;justify-content:space-between;align-items:baseline}
.rate-top label{font-weight:600}
.rate-top output{font:600 26px/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.rate.unset output{color:var(--muted)}
.rate-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;margin:0;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-13px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--accent),0 3px 0 2px var(--lip)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.unset input[type=range]::-webkit-slider-thumb{background:var(--surface)}
.unset input[type=range]::-moz-range-thumb{background:var(--surface)}
.yn{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.yn-l{font-weight:600;flex:1 1 160px;min-width:0}
.yn .seg{flex:0 1 180px;min-width:140px}
.step{display:flex;align-items:center;gap:8px}
.step-v{min-width:68px;text-align:center;font:600 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
.step-v.unset{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:600;font-size:15px}
input[type=text],input[type=time],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--edge);background:var(--surface);font-size:16px;line-height:1.35}
input[type=time],input[type=date]{max-width:240px}
textarea{resize:vertical;min-height:76px}
::placeholder{color:var(--muted);opacity:.85}
.sum{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--mint-soft)}
.sum-top{display:flex;justify-content:space-between;align-items:center}
.ok{font-weight:700;color:var(--mint-text)}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:14px;background:var(--surface)}
.tile b{font:600 24px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tile small{font-size:11.5px;color:var(--muted)}
.sum-line{font-size:14px;color:var(--mint-text)}
.sum-note{font-size:14px;font-style:italic}

/* buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;border:2px solid transparent;font:600 17px/1.15 var(--font-body);text-align:center;transition:transform .08s,box-shadow .08s}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn-soft{background:var(--accent-soft);color:var(--accent-text);box-shadow:0 3px 0 var(--lip)}
.btn-soft:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lip)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger,.btn-ghost.danger{color:var(--danger)}
.btn:disabled{opacity:.45;box-shadow:none}
.wide{width:100%}
.link{background:none;border:0;padding:6px 4px;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.link.center{align-self:center}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;line-height:1.2;text-align:center}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:700}
.chip.warm[aria-pressed=true]{background:var(--slip-soft);border-color:var(--slip);color:var(--slip-text)}
.chip.sq{min-width:46px;padding:0}
.step .chip.sq,.wk-nav .chip.sq{font-size:26px;font-weight:600;line-height:1;padding-bottom:3px}
.chip:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:8px}
.seg .chip{flex:1 1 0;min-width:0}
.btn-col{display:flex;flex-direction:column;gap:10px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:20px;background:var(--surface2);border:1.5px solid var(--line)}
.seg3-b{min-height:44px;border:0;border-radius:16px;background:none;font:600 15px var(--font-body);color:var(--muted)}
.seg3-b[aria-pressed=true]{background:var(--surface);color:var(--accent-text);box-shadow:0 2px 0 var(--lip)}

/* bottom navigation */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--card-edge);border-radius:22px 22px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(98,70,234,.08)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 0;border:0;border-radius:16px;background:none;color:var(--muted);font:600 11.5px var(--font-body)}
.tab .ic{width:26px;height:26px}
.tab[aria-current=page]{color:var(--accent-text);background:var(--accent-soft)}
.tab[aria-current=page] .ic{animation:tabpop .45s cubic-bezier(.2,1.4,.4,1)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet:focus{outline:none}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:4px}
.sheet-h h2{font:600 26px/1.15 var(--font-display)}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);display:grid;place-items:center;padding:0}
.x .ic{width:20px;height:20px;stroke-width:2.2}
.lead{font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:128px;padding:16px 14px;border-radius:20px;border:2px solid var(--teal);background:var(--mint-soft);color:var(--mint-text);box-shadow:0 4px 0 var(--lip)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.big b{font:600 21px/1.1 var(--font-display)}
.big span{font-size:13px;line-height:1.35}
.big.warm{border-color:var(--slip);background:var(--slip-soft);color:var(--slip-text)}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--mint-soft);color:var(--mint-text);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .btn-primary{flex:1 1 140px}
.confirm{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px;border-radius:16px;background:var(--danger-soft)}
.confirm span{font-weight:600;color:var(--danger)}
.badge-detail{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

/* days */
ul.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:76px;padding:10px 12px;border-radius:18px;border:2px solid var(--card-edge);background:var(--surface);text-align:left}
.d-date{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.d-date b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.d-date span{font:600 18px var(--font-display)}
.d-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.d-line{font-size:12px;color:var(--muted)}
.d-times{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.d-rate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.d-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.d-pts{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--sun-text)}
.day.empty .d-times,.day.future .d-times{color:var(--muted);font-weight:500}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.slip{background:var(--slip-soft);color:var(--slip-text)}
.pill.clean,.pill.tracked{background:var(--mint-soft);color:var(--mint-text)}
.pill.events{background:var(--surface2);color:var(--muted)}
.pill.empty{display:none}

/* progress: rewards */
.lvl-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:18px 16px;border-radius:28px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow);position:relative;overflow:hidden}
.lvl-card::before{content:"";position:absolute;inset:0;background:var(--hero-deco);pointer-events:none}
.lvl-card>*{position:relative}
.lc-t{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.lc-t h2{font:600 28px/1.1 var(--font-display)}
.lc-t .hint{color:var(--hero-ink)}
.lc-t .lvl-bar{width:100%}
.lc-step{font-size:14px;line-height:1.3}
.lc-pts{font-size:15px}
.lc-pts b{font:600 26px var(--font-display);font-variant-numeric:tabular-nums}
.pts-list{display:flex;flex-direction:column;gap:6px;font-size:15px}
.pts-list b{display:inline-block;min-width:34px;color:var(--accent-text)}
ul.quests{display:flex;flex-direction:column;gap:14px}
.quest{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1.5px solid var(--line)}
.quest:first-child{padding-top:0;border-top:0}
.q-top{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.q-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-text)}
.quest.done .q-ic{background:var(--mint);color:var(--bdg-ink)}
.q-n{display:flex;flex-direction:column;min-width:0}
.q-n small{color:var(--muted);font-size:13px}
.q-c{font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.q-r{font-size:13px;color:var(--muted)}
.quest.done .q-r{color:var(--mint-text);font-weight:600}
.meter{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.quest.done .meter i{background:var(--mint)}
ul.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;min-height:116px;padding:8px 4px;border-radius:18px;border:2px solid transparent;background:none;text-align:center}
.badge b{font-size:13px;line-height:1.2}
.badge small{font-size:12px;color:var(--muted)}
.badge.on small{color:var(--mint-text);font-weight:600}
.badge:active{background:var(--surface2)}
.bdg{width:var(--bs,64px);height:var(--bs,64px);border-radius:50%;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 3px 0 var(--lip);flex:none}
.bdg .ic{width:calc(var(--bs,64px)*.5);height:calc(var(--bs,64px)*.5);stroke-width:1.7}
.bdg.off{background:var(--surface2);color:var(--muted);box-shadow:none;border:2px dashed var(--muted)}
.bdg.off .ic{width:calc(var(--bs,64px)*.4);height:calc(var(--bs,64px)*.4)}

/* progress: charts */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:18px;background:var(--surface2);min-width:0}
.stat small{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);line-height:1.35}
.stat.big b{font-size:40px;color:var(--accent-text)}
.range{margin-bottom:-8px}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 10px var(--font-body);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .band{stroke:var(--muted);stroke-width:1.5;opacity:.5}
.ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pt{stroke:var(--surface);stroke-width:1.2}
.ln.s-m{stroke:var(--accent)}.pt.s-m{fill:var(--accent)}
.ln.s-c{stroke:var(--blue-line)}.pt.s-c{fill:var(--blue-line)}
.ln.s-e{stroke:var(--orange-line)}.pt.s-e{fill:var(--orange-line)}
.ln.s-s{stroke:var(--rose-line);stroke-dasharray:5 4}.pt.s-s{fill:var(--rose-line)}
.b-rode{fill:var(--teal);background:var(--teal)}
.b-slip{fill:var(--slip);background:var(--slip)}
.b-pts{fill:var(--accent)}
.lg-row{display:flex;flex-wrap:wrap;gap:8px 14px}
.lg{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.lg i{width:10px;height:10px;border-radius:50%}
.lg.s-m i{background:var(--accent)}.lg.s-c i{background:var(--blue-line)}.lg.s-e i{background:var(--orange-line)}.lg.s-s i{background:var(--rose-line)}
.lg[aria-pressed=false]{opacity:.5}
.lg-s{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lg-s i{width:11px;height:11px;border-radius:3px}
.chart-empty{display:grid;place-items:center;min-height:120px;padding:16px;border-radius:16px;background:var(--surface2);color:var(--muted);font-size:14px;text-align:center}
ul.hb{display:flex;flex-direction:column;gap:14px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.hb-top b{font-variant-numeric:tabular-nums}
.hb-bar{display:flex;height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;margin-top:6px}
.hb-bar i{display:block;height:100%}
.tpd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tpd>div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:var(--surface2)}
.tpd b{font:600 24px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tpd small{font-size:12px;color:var(--muted);text-align:center}
.tbl-wrap{overflow-x:auto}
table.pat{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.pat th,.pat td{padding:9px 6px;text-align:right;border-bottom:1.5px solid var(--line)}
.pat thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pat tbody th{text-align:left;font-weight:500}
dl.notice{display:flex;flex-direction:column;gap:2px}
.notice dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.notice dd{font-size:16px}

/* progress: week */
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wk-head h2{font:600 26px/1.15 var(--font-display)}
.wk-nav{display:flex;gap:8px}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.decide p{font-size:15px}

/* accordions: settings, small sections, help */
.acc{border-top:1.5px solid var(--line)}
.acc:last-of-type{border-bottom:1.5px solid var(--line)}
.acc>summary{list-style:none;display:flex;flex-direction:column;gap:2px;padding:16px 30px 16px 2px;min-height:62px;justify-content:center;cursor:pointer;position:relative}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";position:absolute;right:8px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.acc[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
.acc>summary span{font:600 19px/1.2 var(--font-display)}
.acc>summary small{color:var(--muted);font-size:13px}
.acc.small>summary{min-height:48px;padding-block:10px}
.acc.small>summary span{font:600 15px var(--font-body)}
.acc-in{display:flex;flex-direction:column;gap:14px;padding:2px 2px 22px}
ul.chks{display:flex;flex-direction:column}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;width:100%;min-height:58px;padding:10px 2px;background:none;border:0;text-align:left}
.box{width:26px;height:26px;margin-top:1px;border-radius:8px;border:2.5px solid var(--muted);display:grid;place-items:center;font-weight:800;line-height:1;color:var(--accent-ink);background:var(--surface);transition:background .2s,transform .2s}
.chk[aria-checked=true] .box{background:var(--mint);border-color:var(--mint);color:var(--bdg-ink);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.chk-t{display:flex;flex-direction:column;min-width:0}
.chk-t b{font-weight:600}
.chk-t small{color:var(--muted);font-size:13px}
.pl{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1.5px solid var(--line)}

/* tools tab */
.urge-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;padding:18px 16px;border-radius:28px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow);position:relative;overflow:hidden}
.urge-card::before{content:"";position:absolute;inset:0;background:var(--hero-deco);pointer-events:none}
.urge-card>*{position:relative}
.urge-card .btn{grid-column:1/-1;margin-top:4px}
.urge-card .btn-soft{background:var(--surface);color:var(--accent-text);border-color:var(--accent);box-shadow:0 4px 0 var(--ring-track)}
.urge-card .btn-soft:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ring-track)}
.urge-t h2{font:600 24px/1.1 var(--font-display)}
.urge-t p{font-size:15px;margin-top:4px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:132px;padding:14px;border-radius:22px;border:2px solid transparent;text-align:left;background:var(--t-soft);color:var(--t-text);box-shadow:0 4px 0 var(--lip);transition:transform .08s,box-shadow .08s}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.tool-ic{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink)}
.tool-ic .ic{width:28px;height:28px}
.tool-t b{display:block;font:600 18px/1.15 var(--font-display)}
.tool-t small{display:block;font-size:13px;margin-top:2px}
.tools>.tool:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tools-stat{font-size:14px;color:var(--muted)}
.tools-stat b{color:var(--ink)}
.link-cards{display:flex;flex-direction:column;gap:10px}
.link-card{display:grid;grid-template-columns:44px minmax(0,1fr) 14px;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left}
.lc-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet-text)}
.lc-t b{display:block}
.lc-t small{display:block;color:var(--muted);font-size:13px}
.link-card .lc-t{display:block}

/* scenes: full-screen tools */
#scene-root{display:none}
#scene-root.on{display:block;position:fixed;inset:0;z-index:35}
.scene{--sc-ink:var(--ink);position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px));background:var(--g-sky);color:var(--sc-ink);display:flex;flex-direction:column}
.scene:focus{outline:none}
.sc-pause .scene{background:var(--g-sky)}
.sc-breathe .scene{background:var(--g-mint)}
.sc-ground .scene{background:var(--g-sun)}
.sc-halt .scene{background:var(--g-coral)}
.sc-surprise .scene{background:var(--g-violet)}
.sc-message .scene{background:var(--g-sky)}
.sc-reasons .scene{background:var(--g-sun)}
.sc-night .scene{background:var(--g-night);--sc-ink:#F7F3FF;--ink:#F7F3FF;--muted:#CFC8F2;--sc-btn:rgba(255,255,255,.16)}
.sc-night .scene .btn-primary{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--sun-deep)}
.scene .eyebrow{color:var(--sc-ink)}
.scene .x{background:var(--sc-btn);color:var(--sc-ink)}
.scene .btn-soft{background:var(--sc-btn);color:var(--sc-ink);border-color:transparent}
.scene .hint,.scene .sc-p{color:var(--sc-ink)}
.scene .link{color:var(--sc-ink)}
.scene .chip{background:var(--sc-btn);border-color:transparent;color:var(--sc-ink)}
.scene .chip[aria-pressed=true]{background:var(--surface);color:var(--accent-text);border-color:var(--accent)}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:520px;margin:0 auto}
.sc-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;width:100%;max-width:520px;margin:0 auto;padding:12px 0 8px}
.sc-body.top{justify-content:flex-start;padding-top:20px}
.sc-h{font:600 32px/1.1 var(--font-display);text-wrap:balance}
.sc-big{font:600 104px/1 var(--font-display)}
.sc-p{font-size:17px;max-width:36ch;text-wrap:pretty}
.sc-q{font:600 20px var(--font-display)}
.sc-art{display:grid;place-items:center}
.sc-art.moon .ic{width:104px;height:104px;stroke-width:1.2;color:var(--sun);animation:bob 5s ease-in-out infinite}
.sc-col{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%}
.sc-col .link{align-self:center}
.sc-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.sc-group{display:flex;gap:8px;width:100%}
.btn.go{min-height:60px;font-size:19px}
.gain{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sun);color:var(--on-sun);font-weight:700;font-size:15px;white-space:nowrap}
.idea{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px;border-radius:20px;background:var(--sc-btn);width:100%}
.idea small{font-size:13px}
.idea b{font:600 21px/1.2 var(--font-display);text-wrap:balance}
.pz-note{max-width:34ch;text-wrap:balance;margin-top:-6px}
.pick{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:8px 6px;border-radius:18px;border:2px solid transparent;background:var(--sc-btn);color:var(--sc-ink)}
.pick b{font:600 17px var(--font-display)}
.pick small{font-size:12px}
.pick.on{background:var(--surface);color:var(--accent-text);border-color:var(--accent);box-shadow:0 3px 0 var(--lip)}
.pick.short{min-height:52px}

/* quick check-in: one question at a time, one tap each. The first tap saves; everything after it is optional. */
.sc-checkin .scene{background:var(--g-sky)}
.sc-checkin.mint .scene{background:var(--g-mint)}
.sc-checkin.warm .scene{background:var(--g-sun)}
.ci-l{display:flex;align-items:center;gap:10px;min-width:0}
.ci-wrap{flex:1;display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px;margin:0 auto;padding:10px 0 6px}
.ci-prog{width:100%;max-width:180px;margin:0 auto}
.ci-card{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;margin-block:auto;text-align:center}
.ci-card.in-n{animation:rdN .3s cubic-bezier(.2,.8,.2,1) both}
.ci-card.in-p{animation:rdP .3s cubic-bezier(.2,.8,.2,1) both}
.ci-card .sc-h,.sc-body .sc-h.ci-h{font-size:30px}
.ci-opts{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.ci-opt{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px 10px 10px;border-radius:22px;border:2px solid transparent;background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 5px 0 var(--lip);transition:transform .08s,box-shadow .08s}
.ci-opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lip)}
.ci-opt[aria-pressed=true]{border-color:var(--t-ic)}
.ci-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink)}
.ci-ic .ic{width:26px;height:26px}
.ci-t{min-width:0}
.ci-t b{display:block;font:600 20px/1.15 var(--font-display)}
.ci-t small{display:block;font-size:14px;line-height:1.3;color:var(--muted);margin-top:2px}
.ci-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.ci-grid>.ci-tile:last-child:nth-child(odd){grid-column:1/-1}
.ci-tile{display:flex;align-items:center;justify-content:center;min-height:62px;padding:8px 10px;border-radius:18px;border:2px solid transparent;background:var(--surface);color:var(--ink);font:600 16px/1.2 var(--font-body);text-align:center;text-wrap:balance;box-shadow:0 4px 0 var(--lip);transition:transform .08s,box-shadow .08s}
.ci-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.ci-tile[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.ci-tile.add{gap:6px;border:2px dashed var(--edge);background:transparent;box-shadow:none;color:var(--sc-ink,var(--ink))}
.ci-tile.add .ic{width:1.1em;height:1.1em}
.ci-tile.add:active{transform:none}
.ci-grid>.ci-add{grid-column:1/-1}
.ci-add{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.ci-add-r{display:flex;align-items:center;gap:14px}
.sheet .ci-add{margin-top:10px}
.chip.add{border-style:dashed;background:transparent}
.opt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 4px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.opt-row>span{min-width:0;overflow-wrap:anywhere}
.ci-saved{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:0 4px 0 12px;border-radius:999px;background:var(--sc-btn);color:var(--sc-ink);font-size:14px;font-weight:600}
.ci-saved>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.ci-ck{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--bdg-ink)}
.ci-ck .ic{width:14px;height:14px;stroke-width:3}
.ci-more{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ci-field{width:100%;text-align:left}
.ci-field>span{color:var(--sc-ink)}
.ci-care{display:flex;flex-direction:column;gap:10px;width:100%;padding:14px 16px;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--lip);text-align:left}
.ci-care p{font-size:15px}
.ci-care .chip{background:var(--slip-soft);color:var(--slip-text);border-color:transparent}
.ci-care .chip[aria-pressed=true]{background:var(--mint-soft);color:var(--mint-text);border-color:var(--mint)}
.ci-care .hint{font-size:13px;color:var(--muted)}
.ci-sum{font-size:14px}
.ci-foot{display:flex;justify-content:center}

/* urge help ("I'm having an urge") and the Get curious practice: the same one-tap cards, in their own calm colors */
.sc-urge .scene{background:var(--g-violet)}
.sc-curious .scene{background:var(--g-mint)}
.ur-recap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ur-chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--sc-btn);color:var(--sc-ink);font-size:14px;font-weight:600}
.ur-plan{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 16px;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--lip);text-align:left}
.ur-plan small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ur-plan p{font-size:15px;line-height:1.35}
.ur-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px}
/* "Here is what can help" holds the most on one screen, so it keeps its spacing close: the intro reads as one group, and the tools start near the top instead of floating in the middle */
.ci-card.dense{gap:10px;margin-block:0 auto;padding-top:clamp(4px,2.6vh,22px)}
.ci-card.dense .sc-h{font-size:28px}
.ci-card.dense .ur-recap{gap:6px}
.ci-card.dense .sc-p{font-size:16px;line-height:1.35;max-width:40ch}
.ci-card.dense .ur-plan{gap:2px;padding:10px 14px;border-radius:18px}
.ci-card.dense .ur-plan p{line-height:1.3}
.ci-card.dense .sc-q{font-size:18px}
.ci-card.dense .ci-opts{gap:8px}
.ci-card.dense .ci-opt{grid-template-columns:42px minmax(0,1fr);gap:12px;min-height:60px;padding:8px 12px 8px 8px;border-radius:20px;box-shadow:0 4px 0 var(--lip)}
.ci-card.dense .ci-opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.ci-card.dense .ci-ic{width:42px;height:42px;border-radius:14px}
.ci-card.dense .ci-ic .ic{width:24px;height:24px}
.ci-card.dense .ci-t b{font-size:18px}
.ci-card.dense .ci-t small{font-size:13px;margin-top:1px}
.ci-card.dense .ci-grid{gap:8px}
.ci-card.dense .ci-tile{min-height:52px}
.ci-card.dense .ur-links{gap:0 14px}
/* on a short screen, pull it in a little more so the tools and "I feel better" stay close together */
@media (max-height:720px){
 .ci-card.dense{gap:8px;padding-top:0}
 .ci-card.dense .sc-h{font-size:26px}
 .ci-card.dense .sc-p{font-size:15px;line-height:1.3}
 .ci-card.dense .ur-plan{padding:8px 12px}
 .ci-card.dense .ur-plan p{font-size:14.5px}
 .ci-card.dense .sc-q{font-size:17px}
 .ci-card.dense .ci-opts{gap:6px}
 .ci-card.dense .ci-opt{grid-template-columns:38px minmax(0,1fr);gap:10px;min-height:54px;padding:6px 10px 6px 6px}
 .ci-card.dense .ci-ic{width:38px;height:38px;border-radius:12px}
 .ci-card.dense .ci-ic .ic{width:22px;height:22px}
 .ci-card.dense .ci-t b{font-size:17px}
 .ci-card.dense .ci-grid{gap:6px}
 .ci-card.dense .ci-tile{min-height:48px}
}
.cu-wrap{width:min(46vw,160px)}
.orb.soft{animation:watch 10s ease-in-out infinite}
@keyframes watch{0%,100%{transform:scale(.62)}40%{transform:scale(1)}}

/* breathing orb */
.orb-wrap{position:relative;width:min(74vw,270px);aspect-ratio:1;display:grid;place-items:center}
.orb{position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#FFF8D8,var(--sun) 46%,var(--sun2));box-shadow:0 0 60px 8px rgba(255,200,50,.5);transition-property:transform;transition-timing-function:cubic-bezier(.45,.05,.55,.95)}
.pz-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pz-bg{fill:none;stroke:var(--sc-btn);stroke-width:8}
.pz-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.orb-txt{display:flex;flex-direction:column;align-items:center;gap:2px}
.orb-txt span{font:600 24px var(--font-display)}
.orb-txt b{font:600 46px/1 var(--font-display);font-variant-numeric:tabular-nums}

/* 5-4-3-2-1 */
.gsteps{display:flex;gap:6px;justify-content:center}
.gsteps i{width:26px;height:8px;border-radius:4px;background:var(--sc-btn)}
.gsteps i.done{background:var(--mint)}
.gsteps i.now{background:var(--accent)}
.gdots{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.gdot{width:62px;height:62px;border-radius:50%;border:3px dashed var(--muted);background:transparent;color:transparent;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.gdot .ic{width:30px;height:30px;stroke-width:2.6}
.gdot.on{border:3px solid var(--mint);background:var(--mint);color:var(--bdg-ink);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}

/* what do I need */
.needs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip.need{min-height:48px;font-size:16px}
.need-list{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.need-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--lip)}
.need-card b{font:600 18px var(--font-display)}
.need-card p{font-size:15px}
.scene .need-card .btn-soft{background:var(--accent-soft);color:var(--accent-text)}

/* surprise me */
.sur-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:190px;padding:22px 18px;border-radius:30px;background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--lip)}
.sur-card small{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sur-card b{font:600 30px/1.15 var(--font-display);text-wrap:balance}
.sur-card.spin b{animation:shake .16s linear infinite}

/* message someone */
.msgs{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--lip)}
.msg p{font-size:16px}
.msg .chip{background:var(--accent-soft);color:var(--accent-text)}

/* reasons */
.reason-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;min-height:240px;padding:22px 20px;border-radius:30px;background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--lip);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.reason-card p{font:600 28px/1.2 var(--font-display);text-wrap:balance;overflow-wrap:anywhere}
.reason-card.rd-xl p{font-size:34px}
.reason-card.rd-md p{font-size:23px}
.reason-card.rd-sm p{font-size:19px;line-height:1.3}
.reason-card.dir-n{animation:rdN .38s cubic-bezier(.2,.8,.2,1) both}
.reason-card.dir-p{animation:rdP .38s cubic-bezier(.2,.8,.2,1) both}
.rd-cat{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;background:var(--t-soft);color:var(--t-text);font:700 13px/1.2 var(--font-body)}
.rd-cat .ic{width:16px;height:16px}
.rd-stage{width:100%;touch-action:pan-y}
.rd-nav{display:flex;align-items:center;gap:10px;width:100%}
.rd-nav .gsteps{flex:1;min-width:0}
.rd-nav .gsteps i{flex:1 1 0;max-width:26px;min-width:6px}
.rd-empty .ic{width:96px;height:96px;stroke-width:1.2;color:var(--sun-deep)}

/* my reasons page */
.rs-top{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px 12px;align-items:center;padding:16px;border-radius:24px;background:var(--g-sun);color:var(--ink);box-shadow:var(--shadow)}
.rs-top .btn{grid-column:1/-1;margin-top:4px}
.rs-top-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--sun);color:var(--on-sun)}
.rs-top-ic .ic{width:28px;height:28px}
.rs-top-t b{display:block;font:600 22px/1.15 var(--font-display)}
.rs-top-t small{display:block;font-size:14px;margin-top:2px}
ol.rs-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rs-card{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;border:2px solid var(--line);background:var(--surface)}
.rs-card.editing{border-color:var(--t-ic);background:var(--t-soft)}
.rs-card.flash{animation:rsFlash 1.6s ease-out both}
.rs-main{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.rs-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink)}
.rs-ic .ic{width:22px;height:22px}
.rs-cat{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--t-text)}
.rs-txt{font:600 19px/1.3 var(--font-display);overflow-wrap:anywhere;text-wrap:pretty}
.rs-act{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.rs-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px}
.rs-b.sq{padding:0}
.rs-b .ic{width:20px;height:20px}
.rs-b:disabled{opacity:.35}
.rs-b.danger{color:var(--danger)}
.rs-b:active:not(:disabled){transform:translateY(1px)}
.rs-count{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* help */
.now-card{display:flex;flex-direction:column;gap:14px;padding:18px 16px;border-radius:28px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow);position:relative;overflow:hidden}
.now-card::before{content:"";position:absolute;inset:0;background:var(--hero-deco);pointer-events:none}
.now-card>*{position:relative}
.now-t h2{font:600 24px/1.15 var(--font-display)}
.now-t p{font-size:15px;margin-top:4px}
.now-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.now-b .btn{padding:0 10px;font-size:15px}
.now-card .btn-soft{background:var(--hero-pill);color:var(--hero-ink)}
.nums{display:flex;flex-direction:column;gap:10px}
.num{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);color:var(--ink);border:2px solid var(--card-edge)}
.num-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.num-t b{font-size:15px}
.num-n{font:600 22px/1.15 var(--font-display);color:var(--accent-text);overflow-wrap:anywhere}
.num-t small{font-size:13px;color:var(--muted)}
.num .chip{flex:none}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump .chip{min-height:40px;padding:0 14px;font-size:14px}
.hsec{border:2px solid var(--card-edge);border-radius:24px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:12px}
.hsec>summary{display:grid;grid-template-columns:46px minmax(0,1fr) 16px;gap:12px;align-items:center;min-height:72px;padding:12px 16px;list-style:none;cursor:pointer}
.hsec>summary::-webkit-details-marker{display:none}
.hsec>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.hsec[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.hs-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink)}
.hs-ic .ic{width:26px;height:26px}
.hs-t b{display:block;font:600 19px/1.2 var(--font-display)}
.hs-t small{display:block;color:var(--muted);font-size:13px}
.hs-in{display:flex;flex-direction:column;gap:14px;padding:4px 16px 20px}
.hs-in>p{font-size:15px}
.hitem{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1.5px solid var(--line)}
.hitem h4{font:600 16px/1.3 var(--font-body)}
.hitem p{font-size:15px}
.hitem .hl{margin:0}
.hlinks{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ext{display:inline-flex;align-items:center;gap:5px;min-height:44px;font-weight:600;font-size:15px}
.ext .ic{width:15px;height:15px}
ul.hl{display:flex;flex-direction:column;gap:6px;font-size:15px;padding-left:0}
ul.hl li{position:relative;padding-left:18px}
ul.hl li::before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--t-ic,var(--accent))}
ol.hl{padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;list-style:decimal}
.hnote{font-size:13px;color:var(--muted)}
.script{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surface2)}
.script p{font-size:15px}
.thr-names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thr-names input{min-height:46px;padding:8px 10px;font-size:15px}
ul.thr li{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1.5px solid var(--line);font-size:15px}
.thr-c{display:flex;gap:8px}
.thr-c .chip{flex:1 1 0}
.dark-card{padding:16px;border-radius:24px;background:var(--coral-soft);color:var(--ink);display:flex;flex-direction:column;gap:10px}
.dark-card h3{font:600 20px var(--font-display);color:var(--coral-text)}
.dark-card p{font-size:15px}
ul.src{display:flex;flex-direction:column;gap:0;font-size:14px}
ul.src a{padding:6px 0}

/* welcome, loading, toast */
.welcome{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.welcome-sun{align-self:center}
.welcome h1{font:600 38px/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
ul.how{display:flex;flex-direction:column}
.how li{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-top:1.5px solid var(--line)}
.how li:last-child{border-bottom:1.5px solid var(--line)}
.how span{color:var(--muted);font-size:15px}
.center-msg{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--muted);padding-inline:16px}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:turn 1s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:80;max-width:min(92vw,420px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.2,.4,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* growth: the path in Rewards and the sheet for one form */
ol.gpath,ol.gstep-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.gp{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:72px;padding:8px 12px 8px 8px;border-radius:20px;border:2px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.gp-li.now .gp{border-color:var(--accent);background:var(--accent-soft)}
.gp-li.later .gp{background:transparent;border-style:dashed}
.gp-art{display:grid;place-items:center}
.gp-t b{display:block;font:600 18px/1.2 var(--font-display)}
.gp-t small{display:block;color:var(--muted);font-size:13px}
.gp-s,.gs-s{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.gp-s .ic,.gs-s .ic{width:16px;height:16px}
.gp-li.now .gp-s,.gs.now .gs-s{color:var(--accent-text)}
.gp-li.done .gp-s,.gs.done .gs-s{color:var(--mint-text)}
.gr-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gr-hero .lead{max-width:30ch;text-wrap:balance}
.gs{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.gs.now{border-color:var(--accent);background:var(--accent-soft)}
.gs.later{border-style:dashed;background:transparent}
.gs-t b{display:block;font-weight:700}
.gs-t small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.gr-prog{display:flex;flex-direction:column;gap:6px}
.gr-prog .hint b{font-variant-numeric:tabular-nums}
.hint.center{text-align:center}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gnav .chip{min-width:110px}
.gnav .ic{width:18px;height:18px}

/* celebrations */
#cel-root{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;padding:20px}
#cel-root.on{display:flex}
.cel-scrim{position:absolute;inset:0;background:var(--scrim)}
.cel-card{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 22px 22px;border-radius:32px;background:var(--surface);color:var(--ink);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:celin .55s cubic-bezier(.2,1.25,.3,1) both}
.cel-card:focus{outline:none}
.cel-card h2{font:600 28px/1.1 var(--font-display);text-wrap:balance}
.cel-sub{font-size:16px;color:var(--muted);margin-bottom:8px;text-wrap:balance}
.cel-card .btn{margin-top:4px}
.cel-badge{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.cel-sun,.cel-evo{position:relative;width:150px;height:150px;display:grid;place-items:center}
.cel-sun .sun{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.cel-evo>span{position:absolute;inset:0;display:grid;place-items:center}
.cel-evo .cel-old{animation:evoOut 1.1s ease forwards}
.cel-evo .cel-new{animation:evoIn 1.2s cubic-bezier(.2,1.2,.3,1) .75s both}
.cel-evo::after{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.95),rgba(255,200,50,0) 66%);opacity:0;animation:evoFlash 1.3s ease .35s both;pointer-events:none}
.cel-card .eyebrow{color:var(--accent-text)}
#confetti{display:none;position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes evoOut{0%{opacity:1;transform:scale(1);filter:none}65%{opacity:1;transform:scale(1.1);filter:brightness(1.7)}100%{opacity:0;transform:scale(1.18);filter:brightness(3)}}
@keyframes evoIn{0%{opacity:0;transform:scale(.55);filter:brightness(2.6)}55%{opacity:1;transform:scale(1.12);filter:brightness(1.25)}100%{opacity:1;transform:none;filter:none}}
@keyframes evoFlash{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes emBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
@keyframes emFlick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.05) skewX(-2.5deg)}62%{transform:scale(1.04,.96) skewX(2deg)}}
@keyframes emUp{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-24px);opacity:0}}
@keyframes emTw{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes emTwk{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.12);opacity:1}}
@keyframes emBeam{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes emDrift{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes rdN{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes rdP{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes rsFlash{0%{background:var(--t-soft);border-color:var(--t-ic)}100%{background:var(--surface);border-color:var(--line)}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.06)}35%{transform:rotate(8deg) scale(1.08)}55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,50,.55)}50%{box-shadow:0 0 0 9px rgba(255,200,50,0)}}
@keyframes tabpop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes celin{0%{opacity:0;transform:scale(.7) translateY(24px)}100%{opacity:1;transform:none}}
@keyframes shake{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
#app.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(5){animation-delay:.2s}
#app.enter>*:nth-child(6){animation-delay:.25s}
#app.enter>*:nth-child(7){animation-delay:.3s}
#app.enter>*:nth-child(n+8){animation-delay:.35s}
.sc-night .scene::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle 1.6px at 12% 14%,#fff,transparent),radial-gradient(circle 1.2px at 30% 28%,#fff,transparent),radial-gradient(circle 1.8px at 82% 12%,#fff,transparent),radial-gradient(circle 1.2px at 92% 40%,#fff,transparent),radial-gradient(circle 1.4px at 8% 60%,#fff,transparent),radial-gradient(circle 1.6px at 70% 26%,#fff,transparent),radial-gradient(circle 1.2px at 44% 8%,#fff,transparent),radial-gradient(circle 1.4px at 90% 74%,#fff,transparent),radial-gradient(circle 1.2px at 20% 82%,#fff,transparent),radial-gradient(circle 1.6px at 60% 90%,#fff,transparent);animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.sc-night .scene>*{position:relative}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
 .orb{transform:none!important}
 .cel-evo .cel-old{display:none}
}

/* ---------- help v3: a calm home, focused pages ---------- */
h1[tabindex="-1"]:focus{outline:none}
.hcard{display:flex;flex-direction:column;gap:8px;padding:14px 16px 12px;border-radius:22px;background:var(--surface);border:2px solid var(--card-edge);box-shadow:var(--shadow)}
.hcard+.hcard{margin-top:-8px}
.hcard h3{font:600 18px/1.25 var(--font-display);text-wrap:balance}
.hcard p{font-size:15px}
.hcard ul.hl,.hcard ol.hl{margin-top:2px}
.detail-p{font-size:15px;color:var(--muted);text-wrap:pretty}
.seg3{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.seg3.n4 .seg3-b{font-size:14px;padding:0 2px}
.help-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:18px;background:var(--coral-soft);color:var(--ink);font-size:14.5px}

.help-foot .chip{flex:none}
.help-fine{font-size:13px;color:var(--muted);text-align:center;text-wrap:balance}
.help-fine .link{display:flex;margin:0 auto;font-size:14px}

/* the two cards on the Help home, and the top of the lessons page */
.hh-card{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:26px;background:var(--t-soft);color:var(--ink);box-shadow:var(--shadow)}
.hh-top{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center}
.hh-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--t-ic);color:var(--t-ink)}
.hh-ic .ic{width:28px;height:28px}
.hh-t{min-width:0}
.hh-t h2{font:600 22px/1.15 var(--font-display);color:var(--t-text)}
.hh-t p{font-size:14.5px;margin-top:2px;text-wrap:pretty}
.hh-t .eyebrow{color:var(--t-text)}
.hh-t .hh-step{font:600 18px/1.3 var(--font-display);margin-top:2px}
.hh-card .count{color:var(--t-text);font-weight:700;align-self:start}
.hh-up{display:flex;flex-direction:column;gap:2px}
.hh-up small{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t-text)}
.hh-up b{font:600 19px/1.25 var(--font-display);text-wrap:balance}
.hh-btns{display:flex;gap:10px}
.hh-btns .btn{flex:1 1 0;min-width:0;padding:0 12px}
.hh-card .btn-soft,.hh-card .btn-ghost{background:var(--surface);color:var(--t-text);border-color:transparent;box-shadow:0 3px 0 var(--lip)}
.ls-segs{display:grid;grid-template-columns:repeat(var(--c,16),minmax(0,1fr));gap:4px}
.ls-segs i{height:10px;border-radius:5px;border:1.5px solid var(--t-ic);background:transparent}
.ls-segs i.on{background:var(--t-ic)}

/* the lessons list */
.lunit{gap:12px;background:var(--t-soft);border-color:transparent}
.lu-h{display:flex;flex-direction:column;gap:2px}
.lu-h .eyebrow{color:var(--t-text)}
.lu-h h2{font:600 22px/1.2 var(--font-display);color:var(--t-text)}
.lu-h .hint{color:var(--ink);font-size:14px}
ul.lrows{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 12px 10px 10px;border-radius:18px;border:2px solid transparent;background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 3px 0 var(--lip)}
.lrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lip)}
.lr-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--t-soft);color:var(--t-text)}
.lr-ic .ic{width:24px;height:24px}
.lrow.done .lr-ic{background:var(--mint);color:var(--bdg-ink)}
.lr-t{min-width:0}
.lr-t b{display:block;font:600 17px/1.2 var(--font-display);text-wrap:balance}
.lr-t small{display:block;font-size:13px;color:var(--muted);margin-top:1px;text-wrap:pretty}
.lr-s{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}

.lr-s.ok{color:var(--mint-text)}
.lr-s.now{padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text)}
/* the lessons page: filters, the order choice, and what a finished lesson shows */
.lf-chips{display:flex;flex-wrap:wrap;gap:6px}
.lf-chips .chip{flex:1 1 auto;min-height:44px;padding:0 9px;gap:5px;font-size:14.5px}
.lf-chips .chip b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.lf-chips .chip[aria-pressed=true] b{color:var(--accent-text)}
.seg.lorder .chip{padding:0 8px;font-size:14.5px}
.lr-no{display:inline-block;min-width:1.35em;margin-right:4px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.hh-card .lf-sub,.lu-h .lf-sub{color:var(--ink)}
.lrow.full{align-items:start}
.lrow.full .lr-s{margin-top:3px}
.lr-x{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.lr-x .lr-k,.lr-x .lr-n{display:block;font-size:14.5px;line-height:1.45;text-wrap:pretty;color:var(--ink)}

.lf-empty{padding:14px 16px;border-radius:18px;background:var(--surface2);color:var(--muted);font-size:15px;line-height:1.45}

/* the lesson player */
.sc-lesson .scene{overflow:hidden}
.sc-lesson.lu1 .scene{background:linear-gradient(180deg,#FFE6DA,#FFF4E8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sc-lesson.lu1 .scene{background:linear-gradient(180deg,#3E2A62,#59395F)}}
