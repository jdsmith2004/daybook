       ['Viewing dropped by about 93%','Good guess. In a small trial, viewing fell about 93% in the therapy group, against 21% on the waitlist.'],
       ['They learned to argue the thoughts down','The therapy did not teach arguing with thoughts. It taught noticing them and choosing anyway.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'chat'}],
    h:'A thought is not an order. Notice it, name it, and still choose.',
    b:[bP('Acceptance and commitment therapy, called **ACT**, teaches this: do not fight the thought. Say, “I am having the thought that I deserve this.” The thought can stay. The choice is still yours.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'93%',s:'less viewing with this therapy'}],
    h:'In a small trial, this approach cut porn viewing by about 93%.',
    b:[bP('Men who felt their porn use was a problem got 12 sessions of ACT or waited. Viewing fell about 93% with ACT, against 21% on the waitlist. Right after treatment, 54% of the men analyzed had stopped completely.')],
    so:'Noticing a thought and choosing anyway is a skill you can learn, and this trial tested it on porn use itself.',
    fact:{s:'Randomized trial · 28 men · Crosby & Twohig, 2016',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'star'}],
    h:'Put “I am having the thought that” in front of it.',
    b:[bL(['**Name it:** “I am having the thought that I deserve this.”','**Call it a story:** “There is the ‘just once’ story again.”','**Then act:** do the next small thing from your plan.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'At midnight you think, “Just this once will not matter.” What is the best response?',ask:'Pick the best response.',a:0,
    c:[['Notice it: “I am having the thought that…,” then act','Yes. You noticed it and named it without obeying it. The choice stayed yours.'],
       ['Argue with it until you win','Arguing keeps you stuck with the thought. You do not have to win. Notice it and choose.'],
       ['Push it out of your mind and think of something else','Pushing thoughts away tends to bring them back. Let it be there, and choose anyway.'],
       ['Accept that it is true, just this once','The thought sounds reasonable, which is why it works. It is a thought, not an order.']]}
  ],
  act:{h:'Practice on one thought.',p:'Next time a thought like that shows up, put “I am having the thought that” in front of it. Then do something small and kind for yourself.',mins:1,
   go:[{t:'Read my reasons',a:'sheet',v:'reasons',ic:'star'}],ok:'You have a way to answer it.'},
  rc:{q:'You hear the thought, “You have had a hard week. You deserve it.” What do you do with it?',
   c:['Agree, since the week really was hard','Notice it as a thought, and choose your next move','Feel ashamed for thinking it','Argue with it until it stops'],a:1,
   r:'A thought is not an order.',
   cr:['Not quite. The hard week is real, but the thought is not an order. Meet the need another way.','Right. It is a thought, not an order. Notice it, name it, and choose.','Not quite. Having the thought is normal. You only have to notice it.','Not quite. You do not have to win the argument. Notice it and choose.']},
  scope:'The trial was small: 28 men, nearly all from the same religious community, working one on one with a therapist, compared with a waitlist rather than another treatment. This lesson is a taste of one idea, and a trained ACT therapist does much more. The results are a good reason to take the idea seriously.',
  src:[SRC.crosby]},

 /* ---------- unit 5: seeing your pattern ---------- */
 {id:'l17',u:4,v:2,title:'The first link in the chain',tag:'A slip often starts hours earlier, with a small yes.',ic:'compass',mins:3,
  ask:'Where does a slip really start?',
  key:'Usually hours earlier, with small choices that look harmless. Catch an early link, while the urge is quiet, and the last one never forms.',
  np:'The earliest link in my chain',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['chain',{n:['Phone by the bed “just in case”','Staying up, not tired','“Just one quick look”','The slip'],i:['phone','moon','compass','bolt']}],
    h:'Does a slip really come out of nowhere?',
    b:[bP('A slip can feel like one sudden moment. Looking back, there is often a trail of small choices that led to it. This lesson is about that trail.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'When do you think is the easiest moment to stop a slip?',ask:'Make your best guess.',a:0,
    c:[['Early, hours before, while the urge is quiet','Good guess. Early links are easier to change because the urge is quiet and you are clearer.'],
       ['Right at the peak, with enough willpower','That is the hardest moment of all. Catching it earlier asks much less of you.'],
       ['Right after the slip, by being strict','That is too late for this one. The easier moment came hours before.'],
       ['It cannot be stopped once the day goes wrong','A bad day is not a verdict. There are usually several early links you can still change.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'compass'}],
    h:'A slip is usually the last link in a chain of small choices.',
    b:[bP('Relapse researchers call the early links **apparently irrelevant decisions**: choices that each look harmless. A classic example from alcohol is buying liquor “just in case guests stop by.” For porn it might be the phone by the bed “in case someone texts.”')],
    fact:{s:'Relapse model · Larimer, Palmer & Marlatt, 1999',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'How people coped with a risky moment mattered more than just facing one.',
    b:[bP('In relapse research, how people coped with a risky situation predicted relapse more than just meeting one. Coping well built confidence, and that made the next time easier.')],
    so:'Every early link you catch is practice. It builds the confidence that makes the next one easier.',
    fact:{s:'Relapse model · Larimer, Palmer & Marlatt, 1999',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'phone'}],
    h:'Learn your early links, and swap one.',
    b:[bL(['“I will keep the phone by the bed in case someone texts.” **Swap:** charge it in another room.','“I will just check one thing.” **Swap:** ask what you are looking for. If it is vague, close it.','“I am not tired, I will stay up a bit.” **Swap:** a fixed lights-out time.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Which of these is an early link you could catch hours before a slip?',ask:'Pick the early link.',a:2,
    c:[['Opening a porn site','That is the last link, the hardest place to stop. Look earlier in the chain.'],
       ['Feeling bad after a slip','That comes after. The early links come hours before.'],
       ['Taking the laptop to bed “to finish something”','Yes. It looks harmless, which is what makes it an early link. Swap it, and the last link may never form.'],
       ['The urge reaching its peak','By the peak, the chain is almost complete. The easier move is hours earlier.']]}
  ],
  act:{h:'Trace one chain.',p:'Think of your last hard night or slip. Go backward: what happened right before? An hour before? That morning? Write the earliest small yes, and one swap for it.',note:true,btn:'Save it',mins:3,
   go:[{t:'Open my urge plan',a:'sheet',v:'urge',ic:'shield'},{t:'Do a HALT check',a:'scene',v:'halt',ic:'dots'}],ok:'You found an earlier link.'},
  rc:{q:'Your last two slips started with staying up “just a bit longer” on your phone. What is the best change?',
   c:['Try harder not to give in late at night','A fixed lights-out time, with the phone in another room','Stay away from porn sites more carefully','Feel bad enough that you remember next time'],a:1,
   r:'Catch the early link.',
   cr:['Not quite. Late at night is the hardest place to stop. Change the early link instead.','Right. Staying up is the early link. Catch it, and the last link may never form.','Not quite. That is the last link. Look earlier in the chain.','Not quite. Feeling bad does not change the chain. A swap for the early link does.']},
  scope:'The chain model comes from relapse research on alcohol and other drugs. Daybook applies the same idea to porn, where early links look like a phone in bed or a late night. The best test is your own log: trace your last slip backward and see.',
  src:[SRC.larimer]},

 {id:'l18',u:4,v:2,title:'Thoughts that give permission',tag:'Some thoughts exist to make the next step feel okay.',ic:'lock',mins:3,
  ask:'Why do some thoughts make giving in feel okay?',
  key:'Permission thoughts sound reasonable so the next step feels okay. Spot one, name it, and answer it in one short line.',
  np:'The permission thought I hear most',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'lock'}],
    h:'Have you ever talked yourself into it with a thought that sounded reasonable?',
    b:[bP('“I have earned it.” “It is not that bad.” “I am not really at risk tonight.” These do not feel like temptation. That is what makes them work.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think is the best way to handle a thought like “I have earned it”?',ask:'Make your best guess.',a:3,
    c:[['Debate it until you prove it wrong','Debates at 1 AM are hard to win, and you do not need one.'],
       ['Ignore it and hope it goes away','Ignored, it keeps working quietly. Spotting it is what takes away its power.'],
       ['Agree, but limit yourself to once','That is the thought doing its job. It is a permission thought.'],
       ['Spot it, name it, and give a short reply','Good guess. Naming it as a permission thought and answering in one line is enough.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'chat'}],
    h:'Permission thoughts make the next step feel okay. Spot them, and answer them.',
    b:[bP('Relapse researchers call these quiet links **rationalization** and **denial**. They sound reasonable on purpose. You do not need a debate. Notice it, call it a permission thought, and give a short, calm reply.')],
    fact:{s:'Relapse model · Larimer, Palmer & Marlatt, 1999',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'sliders'}],
    h:'A life of all shoulds makes the quick reward look better.',
    b:[bP('The same researchers describe a life made mostly of **shoulds** (work, duties, other people’s needs) and very few **wants** (rest, play, things just for you). When life is all shoulds, the pull toward a quick reward grows.')],
    so:'“I have earned it” often points to a real need for rest or fun. Build healthier wants into your week.',
    fact:{s:'Relapse model · Larimer, Palmer & Marlatt, 1999',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'star'}],
    h:'Have a one-line reply ready.',
    b:[bL(['“That is a permission thought.”','“I decided about this earlier, when I was clearer.”','“What do I actually need right now?”']),bP('Then meet the real need: rest, food you like, a show, a long shower, a call.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'After a stressful week you think, “I have earned a little release.” What is the best response?',ask:'Pick the best response.',a:1,
    c:[['Agree. You worked hard and deserve it','The hard week is real, but this is a permission thought. Meet the need with a reward that does not cost you tomorrow.'],
       ['Name it, then pick a reward that is good for you','Yes. You spotted the permission thought and met the real need another way.'],
       ['Tell yourself you deserve nothing','Harsh is not the answer either. You do deserve rest and fun. Pick a kind that does not cost you tomorrow.'],
       ['Wait to see if the thought gets stronger','Waiting lets it keep working. Name it now, while it is still quiet.']]}
  ],
  act:{h:'Write your reply.',p:'Pick the permission thought you hear most. Write the one-line reply you want ready for it. Your reasons are good material.',note:true,btn:'Save it',mins:2,
   go:[{t:'Read my reasons',a:'sheet',v:'reasons',ic:'star'}],ok:'Your reply is ready.'},
  rc:{q:'You think, “It is not really hurting anyone, so tonight is fine.” What is going on?',
   c:['That is a fair point to weigh','A permission thought, making the next step feel okay','A sign you have lost control','Proof that your reasons are wrong'],a:1,
   r:'Permission thoughts sound reasonable on purpose.',
   cr:['Not quite. It sounds fair, which is why it works. It is a permission thought.','Right. Spot it, name it, and answer it in one short line.','Not quite. Having the thought is normal. Spotting it is a skill.','Not quite. The thought is not evidence. Hold it up next to your reasons.']},
  scope:'The quiet early links and the shoulds-and-wants idea come from relapse prevention research on alcohol and other drugs. They are patterns to watch for, not measured percentages. You can test them on yourself by noticing which thought shows up before your hard moments.',
  src:[SRC.larimer]},

 {id:'l19',u:4,v:2,title:'Learn from your own log',tag:'Writing progress down helps. Looking back at it helps more.',ic:'calendar',mins:3,
  ask:'How can my log actually help me quit?',
  key:'Write it down, then look back. Once a week, ask what the log is telling you: when it is hard, what sets it off, and what helps.',
  np:'One thing my log has taught me',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'calendar'}],
    h:'You log your days, but are you learning anything from them?',
    b:[bP('A log can feel like homework, or like a scoreboard. This lesson is about how it can work as a map: of your hard hours, what sets them off, and what helps.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'In many experiments, when did tracking progress help people the most?',ask:'Make your best guess.',a:2,
    c:[['When they kept count in their head','Keeping track in your head helped less. Writing it down, or telling someone, made the effect bigger.'],
       ['When they tracked only the good days','Tracking only the good days hides the useful part. The hard days are where the map is.'],
       ['When they wrote it down or told someone','Good guess. The effect was bigger when progress was physically recorded or reported to other people.'],
       ['Tracking did not change much either way','It did. Prompting people to track progress raised how often they reached their goals.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'chart'}],
    h:'Write it down, then look back. That is when a log starts to help.',
    b:[bP('Your log is not a scoreboard. It is a map of your hard hours, what sets them off, and what helps. Writing it down makes it real. Looking back once a week turns entries into answers.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'138',s:'experiments with almost 20,000 people'}],
    h:'Tracking progress helped people reach their goals more often.',
    b:[bP('A big review pooled 138 experiments. Prompting people to track progress toward a goal raised how often they reached it. The effect was bigger when progress was physically recorded or reported to other people.')],
    so:'Honest entries plus a weekly look back is the kind of tracking that helps most.',
    fact:{s:'Meta-analysis · 138 experiments · Harkin et al., 2016',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'calendar'}],
    h:'Once a week, ask your log three questions.',
    b:[bL(['When was the hardest moment?','What set it off?','What helped, even a little?']),bP('Here is what yours shows right now:'),['mylog']]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Your log shows most hard nights are Sundays after 11 PM. What is the best next step?',ask:'Pick the best move.',a:3,
    c:[['Nothing. It is just a coincidence','A pattern that repeats is worth acting on. That is what the log is for.'],
       ['Stop logging Sundays so it looks better','Hiding the hard days hides the map. Honest entries are what make it useful.'],
       ['Promise to be stronger next Sunday','A promise does not change the setup. Use the pattern to plan for that hour.'],
       ['Plan something for Sunday nights before 11','Yes. The log showed you where to aim. Now your plan goes exactly there.']]}
  ],
  act:{h:'Look back once.',p:'Open this week’s review, or scroll through your days. Look for one pattern.',mins:2,
   go:[{t:'Open this week’s review',a:'week',ic:'calendar'},{t:'See my days',a:'tab',v:'days',ic:'calendar'}],ok:'You found a pattern.'},
  rc:{q:'You have logged for a month but never looked back. What would help most?',
   c:['Keep logging, and skip looking back','Five minutes a week asking what it shows','Delete the log and start fresh','Log only your good days from now on'],a:1,
   r:'Write it down, then look back.',
   cr:['Not quite. Writing it down helps, but looking back is where it turns into answers.','Right. Five minutes a week turns entries into a plan.','Not quite. The old entries are the most useful part. Look back at them.','Not quite. The hard days are the map. Honest entries are what make it useful.']},
  scope:'The review covered many kinds of goals, not this one in particular. It shows that prompting people to monitor a goal helps them reach it, and that recording progress helps more. A log only helps if the entries are honest, which is why Daybook never takes anything away for logging a slip.',
  src:[SRC.harkin]},

 {id:'l20',u:4,v:2,title:'Fewer fights, not more willpower',tag:'People with strong self-control mostly skip the fight.',ic:'shield',mins:3,
  ask:'Do I just need more willpower to quit?',
  key:'Not mostly. People with strong self-control fight temptation less, not more. Arrange your day so the fight happens less, and count the fights you skip.',
  np:'One fight I could stop having',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['shield',{}],
    h:'Do you judge yourself by how often you win the fight against an urge?',
    b:[bP('Many people say “I just need more willpower,” then measure themselves by how often they lose. This lesson is about what strong self-control actually looks like.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Adults reported their temptations all week. What did those with strong self-control do?',ask:'Make your best guess.',a:1,
    c:[['They resisted temptation more often','That is what most people expect. They actually did less resisting, because they ran into fewer clashes.'],
       ['They faced fewer clashes, so resisted less','Good guess. Higher self-control went with less clash and less resisting.'],
       ['They felt no desires at all','They still had desires. They just ran into fewer clashes with their goals.'],
       ['They gave in more but felt less guilty','No. The difference was that they had fewer clashes in the first place.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'compass'}],
    h:'Strong self-control looks like fewer fights, not more wins.',
    b:[bP('The skill is arranging your day so the fight happens less. When your phone is out of the bedroom and your late hours have a plan, the pull has less to grab. Each fight you skip is a win that needs no willpower.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'205',s:'adults beeped at random for a week'}],
    h:'People with strong self-control did less resisting, not more.',
    b:[bP('205 adults carried a device that beeped at random times for a week. At each beep, they reported what they wanted and any clash with their goals. Higher self-control went with less clash and less resisting. The authors concluded good self-control works partly by avoiding temptation.')],
    so:'If you have been calling yourself weak, measure something else: how many fights you removed.',
    fact:{s:'Experience-sampling study · 205 adults · Hofmann et al., 2012',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'check'}],
    h:'Remove one fight before it starts.',
    b:[bL(['**Phone in bed:** move the charger out of the bedroom.','**Idle evenings:** plan the first hour after dinner.','**Certain apps or sites:** log out, delete, or add a filter.','**Home alone late:** move the late hours somewhere else when you can.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You keep losing the late-night fight with your phone. What is the best move?',ask:'Pick the best move.',a:2,
    c:[['Build willpower by resisting harder','Resisting harder keeps the fight going every night. People with strong self-control had fewer fights.'],
       ['Accept that you are just weak-willed','Losing the fight is not a sign you are weak. It is a sign the setup needs to change.'],
       ['Change the setup so the fight never starts','Yes. Phone out of the bedroom, a plan for late hours. Each fight you skip needs no willpower.'],
       ['Fight it, but give in every other night','That keeps the fight in your nights. Remove the fight instead.']]}
  ],
  act:{h:'Remove one fight tonight.',p:'Pick one fight from the list and change one thing before bed.',mins:2,
   go:[{t:'Phone and night setup',a:'help',v:'phone',sub:'night',ic:'phone'},{t:'Set my screens-off time',a:'tab',v:'settings',open:'s-sched',ic:'moon'}],ok:'One fight is gone.'},
  rc:{q:'Every night you have to talk yourself out of opening certain apps. What is the smarter move?',
   c:['Keep resisting. It builds willpower','Log out of the apps or add a filter','Allow yourself one app a night','Count how many nights you resist'],a:1,
   r:'Fewer fights, not more willpower.',
   cr:['Not quite. Strong self-control looked like fewer fights, not more resisting.','Right. Remove the fight before it starts. That needs no willpower.','Not quite. That keeps the fight going every night.','Not quite. Counting wins keeps the fight in place. Remove it instead.']},
  scope:'This study found a link and cannot prove that avoiding temptation causes good self-control, and everything was self-reported. About three in four participants were students, recruited around one German city. It was not about porn, but it points the same way as changing the setting: arrange the day so the fight happens less.',
  src:[SRC.hofmann]},

 /* ---------- unit 6: a life that holds ---------- */
 {id:'l21',u:5,v:2,title:'Missing a day',tag:'One missed day barely dents a habit. Many missed days add up.',ic:'calendar',mins:2,
  ask:'If I skip a day of my routine, have I lost my progress?',
  key:'No. A single missed day barely dents a new habit, but misses add up. The day after, come back in the smallest way.',
  np:'What I will do the day after I miss one',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'calendar'}],
    h:'You skipped your check-in yesterday. Does that mean the habit is broken?',
    b:[bP('New habits, like a daily check-in or a screens-off time, take time to stick. This lesson is about what one missed day really does, and what to do the day after.')]},
   {k:'guess',e:'predict',h:'How many days do you think it takes a new habit to feel automatic?',p:'Guess first. You may have heard 21.',
    g:{min:0,max:250,step:2,unit:'days',ans:66,lo:18,hi:250,ticks:[0,50,100,150,200,250],big:'days for the typical person',cap:'People ranged from 18 to 254 days',
       rv:{h:'The typical person took 66 days, not 21.',b:'Slow and uneven is normal. It is no sign you are failing.'}},
    fact:{s:'Study · 96 volunteers · Lally et al., 2010',i:[0,1]}},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'check'}],
    h:'One missed day barely matters. Coming back is what counts.',
    b:[bP('New habits take weeks to become automatic, often around two months, and a single miss does not undo them. What adds up is a string of misses. So the day after a miss is the day that matters.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'Missing one day made little difference. Missing many did.',
    b:[bP('Volunteers each built one small daily habit over 12 weeks. Missing a single day made little difference to how automatic the habit got. Missing a lot of days, even spread out over weeks, lowered it.')],
    so:'A missed check-in is not a reset. Just do not let one miss turn into many.',
    fact:{s:'Study · 96 volunteers · Lally et al., 2010',i:[0,1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'sunrise'}],
    h:'Make coming back easy.',
    b:[bL(['Keep the smallest version: one tap, one line.','Decide now what your first step is, the day after a miss.','Tie it to something that already happens, like brushing your teeth.']),bP('In Daybook a skipped day takes nothing away: a day without a check-in still counts as a no-slip day.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You missed your check-in yesterday. What is the best move today?',ask:'Pick the best move.',a:1,
    c:[['Skip today too, since the streak is broken','That is how one miss becomes many, and many misses are what add up. Today counts.'],
       ['Do a tiny check-in, same as usual','Yes. Short is fine. One miss barely dents a habit. Coming back is what counts.'],
       ['Make a big new plan to make up for it','A big plan after a miss is often guilt in disguise. Go small and ordinary.'],
       ['Wait for Monday to restart properly','Waiting for a clean start is how one miss becomes a week. Today works fine.']]}
  ],
  act:{h:'Plan your return.',p:'A phone alarm is a simple way to prompt yourself. Settings lists the three that fit the day.',mins:2,
   go:[{t:'See the reminders',a:'tab',v:'settings',open:'s-remind',ic:'calendar'}],ok:'Your return is planned.'},
  rc:{q:'You have missed your morning check-in two days in a row. What is the best next step?',
   c:['Give up on check-ins. They are not for you','Do a one-tap check-in today','Wait until things calm down','Do three check-ins at once to catch up'],a:1,
   r:'Come back the next day, in the smallest way.',
   cr:['Not quite. A few misses do not mean it is not for you. Come back in the smallest way.','Right. Come back today, small. One tap is enough.','Not quite. Waiting is how misses pile up. Today works fine.','Not quite. No catching up needed. Just come back today.']},
  scope:'The volunteers each picked one small daily behavior and rated their own automaticity, so the study was about building a new habit, not stopping an old one. What carries over is the shape: slow, uneven, and forgiving of single misses.',
  src:[SRC.lally,SRC.lallyucl]},

 {id:'l22',u:5,v:2,title:'When values and habits clash',tag:'Distress can come from the habit, the clash with your values, or both.',ic:'flag',mins:3,care:1,
  ask:'Is my distress about losing control, about my values, or both?',
  key:'Ask what bothers you most: losing control, a clash with your values, or both. Each points to different help, and both are real.',
  np:'What bothers me most, in one sentence',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'flag'}],
    h:'What bothers you most about your porn use? Is it one thing, or two?',
    b:[bP('Some people mostly feel they cannot stop. Others mostly feel it goes against what they believe. Many feel both. This lesson is about telling them apart, because each points to different help.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'Some researchers think much of the feeling of being “addicted” comes from what?',ask:'Make your best guess.',a:2,
    c:[['Having a stronger sex drive than others','That is not what they proposed. They looked at the gap between beliefs and behavior.'],
       ['Watching more porn than other people','Amount matters, but they proposed something else that weighs heavily: the clash with your values.'],
       ['A clash between your values and what you do','Good guess. They call it moral incongruence, and they propose it may explain much of the feeling of being addicted.'],
       ['Not trying hard enough to stop','Effort is not what they pointed to. They pointed to the gap between beliefs and behavior.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sliders'}],
    h:'Losing control and a clash with your values are two different problems.',
    b:[bL(['**Control:** you cannot stop when you want to, and it takes more time, sleep, or money than you mean it to.','**Values:** intense guilt mainly because the use clashes with your moral or religious beliefs.']),bP('Many people have some of each. Both are real, and neither means something is wrong with you.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'book'}],
    h:'Researchers propose that much porn distress may be a clash with values.',
    b:[bP('One research team proposed that porn problems, especially the feeling of being addicted, may often be better understood as **moral incongruence**: a gap between what you believe and what you do. The WHO draws a related line: distress from moral disapproval alone does not count toward its diagnosis.')],
    so:'If the clash with your values hurts most, that pain deserves its own kind of care.',
    fact:{s:'Research proposal · Grubbs et al., 2019 · WHO ICD-11',i:[0,1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'compass'}],
    h:'Name which one bothers you most, then aim the right help at it.',
    b:[bL(['**Control:** the skills in these lessons, a plan, and sometimes a therapist.','**Values:** look at what you believe and what you want, ideally with someone who will not push you toward a conclusion.','**Both:** work on both. That is common.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You rarely watch, but each time brings crushing guilt about your faith. What help fits best?',ask:'Pick the best fit.',a:3,
    c:[['Only more urge-control skills','Skills help with control, but your main pain is the clash with your values. That needs its own attention.'],
       ['Treat it as proof you are addicted','Strong guilt does not by itself mean addiction. It often points to a values clash.'],
       ['Push the guilt down and ignore it','The guilt is pointing at something you care about. Look at it instead of burying it.'],
       ['Look at the values clash, with someone calm','Yes. When the clash is the heaviest part, it deserves care: a calm talk with a faith leader or a therapist.']]}
  ],
  act:{h:'Put it in words.',p:'Write what bothers you most, in one sentence. If it helps, bring it to a therapist or a person you trust.',note:true,btn:'Save it',mins:2,
   go:[{t:'Read my reasons',a:'sheet',v:'reasons',ic:'star'},{t:'Therapy on a small budget',a:'help',v:'therapy',sub:'start',ic:'heart'}],ok:'You put it in words.'},
  rc:{q:'A friend says, “I cannot stop, and it also goes against everything I believe.” What would you tell them?',
   c:['Only the control part is real','Only the values part is real','Both are real, and each needs its own help','It all goes away if they just stop'],a:2,
   r:'Control and values are different problems, and both are real.',
   cr:['Not quite. The values clash is real too, and it can hurt a lot.','Not quite. Losing control is real too, and skills help with it.','Right. Many people have both. Skills for control, care for the values clash.','Not quite. Both deserve attention. Stopping is easier with the right help for each.']},
  scope:'Moral incongruence is a research proposal, and researchers still disagree about how much porn-related distress it explains. Neither version is better or worse, and only a licensed professional can tell you which applies to you.',
  src:[SRC.grubbs,SRC.icd]},

 {id:'l23',u:5,v:2,title:'Plan the empty hour',tag:'Waiting to feel like it does not work. Put it on the calendar.',ic:'sunrise',mins:3,
  ask:'What do I do with the empty hours when urges are worst?',
  key:'Do not wait to feel like it. Put a real, small activity in your hardest hour, and do it even if you do not feel like it.',
  np:'The hour I will fill, and with what',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sunrise'}],
    h:'Are your hardest hours the empty ones: after dinner, late at night, Sunday afternoon?',
    b:[bP('More willpower in the same empty room is not the fix. This lesson is about filling the hour instead.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'For depression, getting active first was compared with talk therapy. How did it do?',ask:'Make your best guess.',a:0,
    c:[['About as well as talk therapy, a year later','Good guess. In a large trial, getting active first did about as well as a standard talk therapy after a year.'],
       ['Worse, since you cannot force a good mood','That is the usual belief. But acting first did about as well as talk therapy a year later.'],
       ['It only helped people who already felt better','It was tested on adults with major depression, and it held up a year later.'],
       ['It made people more tired and worn out','Not what the trial found. Getting active first did about as well as talk therapy.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'bolt'}],
    h:'Act first, then feel better. Put something real in your hardest hour.',
    b:[bP('**Behavioral activation** is a treatment that helps people “get more active” and back in touch with things that feel rewarding. You do not wait to feel like it. You plan it, do it, and notice how you feel afterward.')],
    fact:{s:'Treatment · Society of Clinical Psychology',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'440',s:'adults with major depression'}],
    h:'Getting active first did as well as talk therapy for depression, a year later.',
    b:[bP('In a large trial in England, 440 adults with major depression got either behavioral activation, given by junior mental health workers, or cognitive behavioral therapy. A year later, average depression scores were about the same in both groups.')],
    so:'Filling a low hour with something real is a well-tested way to lift mood, and low moods are a common trigger for relapse.',
    fact:{s:'Randomized trial · 440 adults · Richards et al., 2016',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'calendar'}],
    h:'Plan one real activity for your hardest hour.',
    b:[bL(['Look at your log and find your hardest hour.','Plan one activity with a time: “Tuesday 8 PM: walk with a podcast.”','Make it small. Ten minutes counts.','Do it even if you do not feel like it. Check how you feel after, not before.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Sunday afternoons are empty and hard for you. What is the best plan?',ask:'Pick the best plan.',a:2,
    c:[['Wait until you feel like doing something','That feeling often comes after you start, not before. Plan it and do it anyway.'],
       ['Stay home and rest until it passes','An empty afternoon at home is the hard setup. Put something real in it.'],
       ['Put a walk on Sunday at 2, and do it','Yes. A real activity, at a set time, small enough to start. Act first, feel better after.'],
       ['Use willpower to sit through the empty hours','More willpower in the same empty room is not the fix. Fill the hour.']]}
  ],
  act:{h:'Fill one hour.',p:'Pick the hour from your log. Put one activity in it. Add it to your calm-move list, and set a phone alarm if that helps.',mins:2,
   go:[{t:'Open my calm moves',a:'tab',v:'settings',open:'s-lists',ic:'sliders'},{t:'See my days',a:'tab',v:'days',ic:'calendar'}],ok:'Your hard hour has a plan.'},
  rc:{q:'You get home tired, and evenings are when urges hit. You do not feel like doing anything. What helps most?',
   c:['Rest on the couch until you feel better','Plan one small activity for 7 PM, and do it','Wait to see if the urge shows up','Promise yourself a busy weekend instead'],a:1,
   r:'Act first, then feel better.',
   cr:['Not quite. Waiting to feel better leaves the hour empty. Act first.','Right. Act first, feel better after. A small plan fills the hard hour.','Not quite. Waiting leaves the hour empty, and empty hours are the hard ones.','Not quite. The weekend does not help tonight. Fill this evening.']},
  scope:'The trial was about depression, not porn use, and some people dropped out along the way. Nobody has tested this exact plan for urges. The idea is simple and easy to test on yourself: fill the hour, then check how you feel afterward.',
  src:[SRC.ba,SRC.cobra,SRC.larimer]},

 {id:'l24',u:5,v:2,title:'What therapy is like',tag:'What it is, what to ask, and what research says about this problem.',ic:'heart',mins:3,
  ask:'Would therapy actually help with this, and what is it like?',
  key:'Yes, treatment appears to help, and one kind, CBT, has the strongest support. Ask how a therapist works, and switch if it does not fit.',
  np:'One question I would ask a therapist',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'heart'}],
    h:'Does therapy actually help with porn, or is it just talking?',
    b:[bP('Many people picture therapy as lying on a couch talking about childhood. This lesson is about what it really is, whether it helps with this problem, and how to start.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'A review looked at treatments for problem porn use. What do you think it found?',ask:'Make your best guess.',a:1,
    c:[['Nothing helped, so it is up to willpower','It went the other way. Treatment appeared to improve symptoms.'],
       ['Treatment helped, and one kind had the most support','Good guess. Treatment appeared to help, and cognitive behavioral therapy (CBT) had the strongest support.'],
       ['Only medication made a difference','Medication was not the standout. CBT, a skills-based talk therapy, had the strongest support.'],
       ['Therapy made people feel worse at first','That was not the finding. Treatment appeared to improve symptoms.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'check'}],
    h:'Yes. Therapy is skill-building with a person on your side, and it appears to help.',
    b:[bP('The US National Institute of Mental Health describes therapy as help to “identify and change troubling emotions, thoughts, and behaviors.” For this problem, **cognitive behavioral therapy** (CBT) has the strongest support: practical skills, practiced between sessions.')],
    fact:{s:'Overview · US NIMH, psychotherapies',i:[1]}},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'24',s:'studies of treatment for this problem'}],
    h:'A review of treatments for problem porn use found they appeared to help.',
    b:[bP('A 2022 review of treatments for compulsive sexual behavior and problem porn use found that treatment appeared to improve symptoms, and that cognitive behavioral therapy had the strongest support.')],
    so:'Getting help is a real, supported option for this exact problem, not a last resort.',
    fact:{s:'Systematic review · 24 studies · Antons et al., 2022',i:[0]}},
   {k:'text',e:'proof',el:'Health guidance',art:['icon',{ic:'calendar'}],
    h:'A typical course is about 5 to 15 sessions, with practice in between.',
    b:[bP('The UK’s NHS says a course of CBT is usually about 5 to 15 sessions, depending on what it is for, and that practice between sessions is important for it to work.')],
    so:'It is a set amount of time and practice, aimed at skills you keep.',
    fact:{s:'Guidance · UK NHS, CBT overview',i:[2]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'chat'}],
    h:'Ask a therapist how they work, and switch if it does not fit.',
    b:[bL(['What approach will you use, and what is the evidence for it?','Have you worked with people with my kind of problem?','How will we know I am making progress?']),bP('Trust matters. It is fine to try someone and decide they are not the right fit.')],
    fact:{s:'Guidance · US NIMH, psychotherapies',i:[1]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You tried one therapist and it did not click. What is the best next step?',ask:'Pick the best move.',a:0,
    c:[['Tell them, and try someone else if it does not change','Yes. Fit matters. NIMH suggests talking to the therapist, and considering other options if you are not getting better.'],
       ['Decide therapy does not work for you','One poor fit is not a verdict on therapy. Treatment appeared to help, and fit matters.'],
       ['Keep going for years without saying anything','Saying something is part of it. How you will know you are making progress is a fair question.'],
       ['Only try again once it gets really bad','You do not need a crisis. If it costs you time, sleep, or peace of mind, it counts now.']]}
  ],
  act:{h:'Take one step.',p:'Look at the page on starting with a small budget, or find the words for a first message.',mins:2,
   go:[{t:'Therapy on a small budget',a:'help',v:'therapy',sub:'start',ic:'heart'},{t:'What to say',a:'help',v:'say',ic:'chat'}],ok:'You took a step toward help.'},
  rc:{q:'A friend says, “Therapy is just talking. It cannot help with porn.” What is closer to the truth?',
   c:['They are right. Only willpower works','Therapy teaches skills, and it appears to help','It only helps if you have a diagnosis','It helps, but only after years of sessions'],a:1,
   r:'Treatment appears to help, and skills-based therapy had the strongest support.',
   cr:['Not quite. Treatment appeared to help, and skills-based therapy had the strongest support.','Right. CBT, a skills-based therapy, had the strongest support in a review of treatments.','Not quite. You do not need a label to get help. What counts is what it does to your life.','Not quite. A typical course of CBT is about 5 to 15 sessions.']},
  scope:'The review found only 4 randomized trials among its 24 studies, so the evidence on treating this problem is still limited. NIMH and NHS guidance describe therapy in general. Taken together: help is worth trying, and fit matters.',
  src:[SRC.antons,SRC.nimh,SRC.nhs]},

 /* ---------- unit 7: well-known programs (lessons 25 to 28). Program wording comes from each program's own pages; research is summarized from the sources listed. ---------- */
 {id:'l25',u:6,v:2,chk:'October 13, 2026',title:'The 12 steps in plain words',tag:'What the steps ask of you, and what research says about them.',ic:'book',mins:3,
  ask:'What are the 12 steps, and could they help me?',
  key:'The steps are honesty, help from other people, and action. Programs built on them have helped many people, and you can borrow the parts that fit.',
  np:'The step that feels closest to where I am',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'book'}],
    h:'You have heard of the 12 steps. What do they actually ask of you?',
    b:[bP('They began with Alcoholics Anonymous, which calls them “the core of the A.A. program of personal recovery.” This lesson explains them in plain words, and what research says about them.')],
    fact:{s:'Program · Alcoholics Anonymous, the Twelve Steps',i:[0]}},
   {k:'choose',e:'predict',el:'Make a guess',h:'A big review compared AA-based programs with other treatments for drinking. What did it find?',ask:'Make your best guess.',a:3,
    c:[['They did worse than professional treatment','Many people expect that. On staying fully sober, the AA-based programs did a bit better.'],
       ['They only worked for religious people','The review did not sort people by faith. Overall, AA-based programs helped more people stay sober.'],
       ['No difference at all, on anything','On some measures there was little difference, but on staying fully sober, AA-based programs did better.'],
       ['More people stayed fully sober with them','Good guess. About 42 in 100 were fully abstinent a year later, against about 35 in 100 with other treatments.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['chain',{n:['Face it, reach out','Look honestly','Make things right','Keep it going'],i:['flag','compass','heart','sunrise']}],
    h:'The steps come down to honesty, help from other people, and action.',
    b:[bP('In plain words, not AA’s own: admit willpower alone is not enough and reach out; look honestly at yourself and tell another person; make things right where it would not hurt anyone; keep checking yourself and help someone else.')]},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'27',s:'studies, 10,565 people'}],
    h:'Programs built on the steps helped more people stay sober from alcohol.',
    b:[bP('A Cochrane review pooled 27 studies comparing AA and programs that help people get involved in AA with other treatments. About 42 in 100 were fully abstinent a year later, against about 35 in 100 with other treatments. The review rates that evidence as high certainty.')],
    so:'For alcohol, the steps held up well in careful research. The same three ingredients are worth borrowing for porn.',
    fact:{s:'Cochrane review · 27 studies · Kelly et al., 2020',i:[1,2]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'Men further along in the steps had less compulsive sexual behavior.',
    b:[bP('In a study of 97 men in Sexaholics Anonymous groups in Israel, those further along in the steps scored lower on compulsive sexual behavior and higher on well-being.')],
    so:'People with problems like yours use the steps too, and those further along tended to be doing better.',
    fact:{s:'Study · 97 men · Efrati & Gola, 2018',i:[3]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'compass'}],
    h:'Borrow the parts that fit. You do not have to join anything.',
    b:[bL(['**Honesty:** keep an honest log, slips included.','**Another person:** tell one safe person the truth.','**Making things right:** carefully, where it would not hurt anyone.','**Keep it going:** a daily check-in is a small version of checking yourself.']),bP('Groups like Sex Addicts Anonymous adapt the steps. At a first meeting you can just listen.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You are curious about the steps but unsure about joining a group. What is the best first move?',ask:'Pick the best move.',a:1,
    c:[['Skip it, since it is all or nothing','It is not all or nothing. You can borrow the parts that fit.'],
       ['Borrow one idea, like telling one safe person','Yes. Honesty, people, and action are the core, and you can start with one of them today.'],
       ['Join and work all 12 steps this month','Rushing is not the point, and some steps, like making amends, need care. Start with one idea.'],
       ['Wait until you believe every part of it','You do not need to agree with all of it first. Many people start by listening.']]}
  ],
  act:{h:'Take what helps.',p:'You do not have to join anything to use the ideas. Honesty, telling a safe person, a daily check-in, and making things right with care are already part of Daybook. If you want to try a meeting, the first time you can just listen.',mins:2,
   go:[{t:'Look at free groups',a:'help',v:'groups',ic:'dots'},{t:'Read my reasons',a:'sheet',v:'reasons',ic:'star'}],ok:'You took what helps.'},
  rc:{q:'A friend says, “The 12 steps are just for alcoholics, so they cannot help me.” What is closer to the truth?',
   c:['That is right. They only fit alcohol','Their core, honesty, people, and action, fits other habits too','They only work if you are religious','They only work if you do all 12 at once'],a:1,
   r:'Honesty, help from other people, and action.',
   cr:['Not quite. Groups like Sex Addicts Anonymous adapt the steps for other problems.','Right. The core ideas travel, and you can borrow the parts that fit.','Not quite. Several steps mention God “as we understood Him,” and people use them in different ways.','Not quite. You can start with one idea, like telling one safe person.']},
  scope:'Most research on the steps is on AA and alcohol, not porn. The Israeli study compared men at different steps, so it shows a link and cannot show that the steps caused the difference. The Cochrane review found no clear difference between AA-based and other programs on drinks per drinking day or alcohol-related problems.',
  src:[SRC.aa12,SRC.cochrane,SRC.cochranepr,SRC.efrati]},

 {id:'l26',u:6,v:2,chk:'October 13, 2026',title:'SMART Recovery: four points and a toolbox',tag:'A skills-based group approach that is not a 12-step program.',ic:'sliders',mins:3,
  ask:'Is there a skills-based alternative to the 12 steps?',
  key:'Yes. SMART Recovery teaches practical tools for motivation, urges, thoughts and feelings, and a balanced life. You can borrow them with or without a meeting.',
  np:'The SMART tool I would try first',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sliders'}],
    h:'What if the 12 steps do not feel like your thing? Is there another kind of group?',
    b:[bP('SMART Recovery offers free meetings, online and in person, led by trained facilitators. It is not a 12-step program. This lesson is about what it teaches and how to borrow it.')],
    fact:{s:'Program · SMART Recovery',i:[0]}},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think SMART Recovery mainly teaches?',ask:'Make your best guess.',a:0,
    c:[['Practical skills for urges, thoughts, and a balanced life','Good guess. It has four points: motivation, urges, thoughts and feelings, and a balanced life, each with tools.'],
       ['That you are powerless over the habit','That is closer to AA’s step 1. SMART talks about “self-empowered” recovery.'],
       ['A set of religious practices','SMART meetings use “inclusive language; no religious content.”'],
       ['Avoiding all your feelings','The opposite. One of its points is managing thoughts and feelings, not avoiding them.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['chain',{n:['Build motivation','Cope with urges','Manage thoughts and feelings','Live a balanced life'],i:['star','wave','chat','sunrise']}],
    h:'Yes. SMART teaches four skills, each with tools you can use today.',
    b:[bP('Its toolbox includes a **cost-benefit list**, an **urge log**, and **DENTS** for urges: deny or delay, escape, neutralize, tasks, swap. Its meetings use “inclusive language; no religious content.”')],
    fact:{s:'Program · SMART Recovery, four points and toolbox',i:[1,2]}},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'12',s:'studies of SMART Recovery'}],
    h:'Early research on SMART Recovery found positive effects.',
    b:[bP('A 2017 review gathered the research on SMART Recovery. It found 12 studies, and 3 tested whether it works. Most were about alcohol. The authors found positive effects, and called for more research.')],
    so:'It is a reasonable option to try, especially if a skills-based, non-religious approach fits you better.',
    fact:{s:'Systematic review · 12 studies · Beck et al., 2017',i:[3]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'compass'}],
    h:'Borrow one SMART tool, no meeting needed.',
    b:[bL(['**Cost-benefit:** write what porn gives you and what it costs you.','**Urge log:** note when and why urges come.','**DENTS:** delay the urge, escape the setting, or swap in a task.'])]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You want a group, but saying you are “powerless” does not sit right. What fits best?',ask:'Pick the best fit.',a:2,
    c:[['Give up on groups altogether','There is more than one kind. SMART is skills-based and talks about self-empowered recovery.'],
       ['Force yourself into a 12-step group anyway','You can try one, but the feel of a group matters. SMART may fit you better.'],
       ['Try a SMART meeting, or borrow its tools','Yes. SMART is skills-based, with no religious content, and its tools work without a meeting.'],
       ['Wait until you find the perfect program','No program is best for everyone. Try two or three and see what fits.']]}
  ],
  act:{h:'Borrow one tool.',p:'You do not need a meeting to use these. Add a DENTS-style move to your calm moves, or read your reasons as a cost-benefit list.',mins:2,
   go:[{t:'Add “Escape: step outside”',a:'addmove',text:'Escape: step outside for five minutes',ic:'plus'},{t:'Add “Swap: one small task”',a:'addmove',text:'Swap: do one small task I have been putting off',ic:'plus'},{t:'Look at free groups',a:'help',v:'groups',ic:'dots'}],ok:'You borrowed a tool.'},
  rc:{q:'An urge hits on a break at work. Using SMART’s DENTS tool, what could you do?',
   c:['Escape: step outside for five minutes','Promise to deal with it tonight','Scroll until it fades','Tell yourself you are powerless'],a:0,
   r:'DENTS: deny or delay, escape, neutralize, tasks, swap.',
   cr:['Right. Escape is one of the DENTS moves: change the setting, and the urge has less to grab.','Not quite. Delay in DENTS means riding it out now, not putting off the decision until tonight.','Not quite. Scrolling keeps the trigger close. Escape, or swap in a task.','Not quite. SMART is about self-empowered recovery. Pick a DENTS move.']},
  scope:'The 2017 review found only 3 studies that tested whether SMART works, mostly about alcohol, with small samples. Program descriptions come from SMART’s own pages. No approach has been shown best for everyone, so fit matters.',
  src:[SRC.smarthome,SRC.smartpts,SRC.smarttools,SRC.beck,SRC.aa12]},

 {id:'l27',u:6,v:2,chk:'October 13, 2026',title:'Mindfulness and relapse prevention',tag:'An eight-week program built on urge surfing, and its short breathing exercise.',ic:'wind',mins:3,
  ask:'Can I learn to pause before I act on an urge?',
  key:'Yes. A one-minute breathing space lets you notice an urge and choose: stop, observe, breathe, expand, respond.',
  np:'One place in my day for a one-minute pause',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'wind'}],
    h:'When an urge hits, does it feel like you act before you even decide?',
    b:[bP('Many slips happen on autopilot. This lesson is about a short pause that puts you back in charge of the next move.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'People leaving treatment for drugs or alcohol learned relapse prevention. What happened?',ask:'Make your best guess.',a:1,
    c:[['No difference from usual aftercare','There was a clear difference over 12 months.'],
       ['Much less risky use over the next year','Good guess. Compared with usual aftercare, their risk of using drugs or drinking heavily was much lower.'],
       ['They relapsed faster from overconfidence','It went the other way. Relapse prevention lowered risky use.'],
       ['It helped for a week, then wore off','The effect was measured over 12 months, not just a week.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['chain',{n:['Stop','Observe','Breathe','Expand','Respond'],i:['timer','compass','wind','sparkle','check']}],
    h:'Yes. A one-minute pause lets you notice the urge and choose.',
    b:[bP('The **SOBER breathing space** is a five-step pause: **Stop.** **Observe** your body and mind. **Breathe.** **Expand** your attention to your whole body and the space around you. **Respond:** choose what to do instead of reacting on autopilot.')],
    fact:{s:'Training slides · Marlatt, Penn State',i:[2]}},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'286',s:'adults after treatment for drugs or alcohol'}],
    h:'Relapse prevention cut risky use over 12 months.',
    b:[bP('In a US trial, 286 adults who had finished treatment for drugs or alcohol got mindfulness-based relapse prevention, standard relapse prevention, or usual aftercare. Together, the two relapse-prevention groups had about a 54% lower risk of using drugs and a 59% lower risk of heavy drinking over 12 months.')],
    so:'Pausing and choosing is a learnable skill, and it held up for a year in people quitting other habits.',
    fact:{s:'Randomized trial · 286 adults · Bowen et al., 2014',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'calendar'}],
    h:'Practice the one-minute pause once a day.',
    b:[bL(['**Stop** what you are doing.','**Observe** what you feel and think.','**Breathe** slowly, a few times.','**Expand** your attention to the room around you.','**Respond:** choose your next move.']),bP('The full program is eight weeks of sessions plus daily practice. One minute a day is a start.')],
    fact:{s:'Program overview · University of Washington slides',i:[1]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'Late at night, you notice you have opened your browser without thinking. What is the best move?',ask:'Pick the best move.',a:3,
    c:[['Keep going, since you already started','Starting on autopilot does not mean finishing. This is exactly the moment to pause.'],
       ['Slam the laptop and call yourself weak','Harsh does not help you choose. A calm pause does.'],
       ['Promise to try the pause tomorrow','Now is the moment. One minute is enough.'],
       ['Stop, notice, breathe, then choose','Yes. You caught autopilot and gave yourself a choice. That is the whole skill.']]}
  ],
  act:{h:'Try it once.',p:'Do the five steps once, right now: Stop. Observe. Breathe. Expand. Respond. Then decide where in your day it could go.',mins:2,
   go:[{t:'Practice breathing',a:'scene',v:'breathe',ic:'wind'},{t:'See the 10-minute pause',a:'scene',v:'pause',ic:'timer'}],ok:'You have run the pause once.'},
  rc:{q:'Right after a stressful call, you feel the pull. You have one minute. What is the best use of it?',
   c:['Stop, observe, breathe, expand, respond','Distract yourself for an hour','Fight the urge until it dies','Act fast before you think about it'],a:0,
   r:'A short pause: stop, observe, breathe, expand, respond.',
   cr:['Right. A one-minute pause takes you off autopilot and back to choosing.','Not quite. You do not need an hour. A one-minute pause is enough to choose.','Not quite. Fighting keeps your attention on it. Pause, notice, and choose.','Not quite. Acting fast is autopilot. Pause first.']},
  scope:'The trial treated drugs and alcohol, not porn, and about 8 in 10 people used more than one substance. Most results were self-reported, it was one treatment agency with two sites, and some authors lead MBRP trainings and are paid for them. Standard relapse prevention did better at delaying first drug use; the mindfulness version did better on some 12-month measures. It fits urge surfing: you can learn to notice an urge without obeying it.',
  src:[SRC.bowen14,SRC.chawla,SRC.mbrpslides,SRC.larimer,SRC.bowen]},

 {id:'l28',u:6,v:2,chk:'October 13, 2026',title:'Why groups help',tag:'What 25 years of research says, who a sponsor is, and a gentle way to start.',ic:'dots',mins:3,
  ask:'Why would a group help me quit?',
  key:'Groups change who you spend time with, and that is one of the main ways they help. Start small: listen at one meeting, or ask one person to check in.',
  np:'One group or one person I could try first',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'dots'}],
    h:'Could sitting in a room with strangers really help you quit?',
    b:[bP('Groups can feel awkward or scary. This lesson is about what research says groups actually do for people, and a gentle way to try one.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'A review of 25 years of research asked how AA helps people. What stood out?',ask:'Make your best guess.',a:2,
    c:[['Hearing rules about what not to do','Rules were not the standout. Who people spent time with was.'],
       ['Fear of being judged by the group','Fear was not what helped. Changes in who people spent time with stood out.'],
       ['Changes in who people spent time with','Good guess. People swapped some old company for people who supported their change.'],
       ['Nothing, beyond sheer willpower','The review found several real routes, especially changes in who people spent time with.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sparkle'}],
    h:'Groups change who you spend time with, and that helps people change.',
    b:[bP('A group puts people around you who are working on the same thing. That shift in company was one of the main ways groups helped. You do not have to commit to anything: the first time, listening is enough.')]},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Different company','More confidence','Less craving'],i:['dots','star','wave']}],
    h:'Groups helped by changing who people spent time with, and more.',
    b:[bP('Across about 25 years of studies, people in AA dropped heavy drinkers from their social circle and took up with people who did not drink or were in recovery. Other routes: more confidence, coping with bad feelings without drinking, less craving, and for many, more spiritual practice.')],
    so:'Who you spend time with shapes a habit. A group, or one check-in partner, changes that for you.',
    fact:{s:'Review · about 25 years of studies · Kelly, 2017',i:[0]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'chat'}],
    h:'Start small: one meeting, or one check-in partner.',
    b:[bL(['**Listen at one meeting.** Online meetings often let you keep your camera off.','**Ask one person to check in** with you on a schedule.','**A sponsor** is a peer who shares their experience one on one, not a professional counselor.'])],
    fact:{s:'Pamphlet · Alcoholics Anonymous, sponsorship',i:[2]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You are nervous about your first group. What is the best way to start?',ask:'Pick the best move.',a:0,
    c:[['Go once and just listen, camera off if you like','Yes. Listening is enough the first time, and you can leave any time. That is how many people start.'],
       ['Wait until you can share your whole story','You do not have to share anything at first. Listening counts.'],
       ['Skip groups, since they are not for people like you','Groups differ a lot. Try two or three before deciding.'],
       ['Commit to a meeting every day right away','That is a big jump. Start with one meeting and see how it feels.']]}
  ],
  act:{h:'One small step toward people.',p:'Pick the smallest one. Reading a page counts.',mins:2,
   go:[{t:'Look at free groups',a:'help',v:'groups',ic:'dots'},{t:'Copy: ask someone to check in',a:'copy',text:SCRIPTS[9][1],ic:'copy'},{t:'Reach a person',a:'scene',v:'message',ic:'chat'}],ok:'That is a real step toward people.'},
  rc:{q:'You have been doing this alone for months. A friend in recovery offers to check in weekly. What is a good move?',
   c:['Say no. You should handle it yourself','Say yes, and tell them the truth when they ask','Say yes, but tell them everything is fine','Wait until you have quit to accept'],a:1,
   r:'Who you spend time with helps you change.',
   cr:['Not quite. Who you spend time with is one of the main ways people change. Let someone in.','Right. A check-in partner changes who you spend time with, and honesty is what makes it work.','Not quite. A check-in only helps if it is honest.','Not quite. Support helps most while you are still working on it.']},
  scope:'The review was about AA and alcohol, not porn. A study of Sexaholics Anonymous men also found lower compulsive sexual behavior further along in the program, but it compared men at different steps, so it cannot show cause. Groups differ a lot. If one leaves you feeling worse about who you are, try another, or talk with a counselor about what you are looking for.',
  src:[SRC.kelly17,SRC.efrati,SRC.aaspons]},

 /* ---------- unit 8: faith and recovery (lessons 29 to 32). They say God plainly, belong to no one church, and rest on the 12-step tradition and research. ---------- */
 {id:'l29',u:7,v:2,f:1,chk:'October 13, 2026',title:'God and a plan',tag:'Faith helps. In the 12 steps it always comes with action.',ic:'star',mins:3,
  ask:'If I pray about this, why does the pull keep coming back?',
  key:'Faith is a real strength, and it works best with people and a plan. Pray, then do the next small thing.',
  np:'How I want God to be part of my plan',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'star'}],
    h:'You prayed and meant it, and the pull came back anyway. Did your faith fail?',
    b:[bP('Many people of faith know this feeling. This lesson is about how faith fits with the rest of recovery, so prayer leads somewhere.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think the 12 steps pair with faith in God?',ask:'Make your best guess.',a:2,
    c:[['Nothing. Faith is meant to be enough alone','Many people expect that. But nearly every step after the faith step asks you to do something, often with another person.'],
       ['Waiting for the urge to be taken away','The steps do not ask you to wait. They pair faith with action.'],
       ['Action, often with another person','Good guess. Step 3 is the faith step. After it, almost every step asks you to do something, and several involve another person.'],
       ['Keeping it all between you and God','Step 5 includes admitting it “to another human being.” Faith in the steps comes with people.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'sparkle'}],
    h:'Faith is real help, and it works best with people and a plan.',
    b:[bP('Step 3 is the faith step: “Made a decision to turn our will and our lives over to the care of God as we understood Him.” After it, almost every step asks you to do something, and several involve another person. The pull coming back is not your faith failing. It is a sign to pair prayer with a move.')],
    fact:{s:'Program · Alcoholics Anonymous, the Twelve Steps',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['big',{n:'364',s:'adults followed in a study of AA involvement'}],
    h:'More AA involvement went with more spiritual practice.',
    b:[bP('A study that followed 364 adults with alcohol dependence found that more involvement in AA predicted more private religious practice, more daily spiritual experiences, and more forgiveness of others. Private religious practice helped explain why AA involvement went with less drinking.')],
    so:'Faith practice and recovery can grow together, especially alongside people working on the same thing.',
    fact:{s:'Study · 364 adults · Krentzman et al., 2013',i:[2]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'dots'}],
    h:'A review of AA research found that people and faith both matter.',
    b:[bP('A 2017 review of about 25 years of AA research found that AA helps through several routes. For many members, more spiritual practice seems to be one. The review singles out another in particular: changes in who people spend time with.')],
    so:'Prayer and people are not rivals. Recovery tends to use both.',
    fact:{s:'Review · about 25 years of studies · Kelly, 2017',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'plug'}],
    h:'Pair the prayer with a move.',
    b:[bP('Write an if-then plan around prayer:'),bQ('If I am in bed late with my phone, then I say one sentence to God, and I get up and put the phone in the kitchen.'),bP('The prayer is yours. The move changes the next ten minutes.')],
    fact:{s:'Meta-analysis · Gollwitzer & Sheeran, 2006',i:[3]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You prayed for help tonight, and the urge is still there. What is the best next step?',ask:'Pick the best move.',a:1,
    c:[['Decide that prayer does not work for you','The pull coming back does not mean your faith failed. Faith works best paired with a move.'],
       ['Pray, then get up and do something','Yes. Pray, then move. The prayer is yours, and the move changes the next ten minutes.'],
       ['Keep praying until the urge is gone','Prayer matters, but the steps pair it with action. Say your words, then move.'],
       ['Keep it to yourself so no one knows','Faith in the steps comes with people. Telling one safe person can help carry it.']]}
  ],
  act:{h:'Add God to your plan.',p:'Open your urge plan. Pick your hardest line and add a short prayer to the “then,” followed by one move.',mins:2,
   go:[{t:'Open my urge plan',a:'sheet',v:'urge',ic:'shield'},{t:'Add my own steadying words',a:'tab',v:'settings',open:'s-lists',ic:'star'}],ok:'God has a place in your plan.'},
  rc:{q:'It is late, you have said a prayer, and you are still holding your phone in bed. What is the next step?',
   c:['Wait for the urge to be taken away','Get up and put the phone in another room','Pray harder, louder, and longer','Scroll until you feel sleepy'],a:1,
   r:'Pray, then do the next small thing.',
   cr:['Not quite. The steps pair faith with action. Pray, then move.','Right. Pray, then move. The move changes the next ten minutes.','Not quite. Your words matter, but they work best with a move.','Not quite. Scrolling keeps you in the setup for the urge. Move the phone.']},
  scope:'The research was about AA and alcohol, not porn, and neither study proves cause. They support the takeaway of this lesson: faith is a real strength, and it works as one part of a larger plan. Daybook does not speak for any church or group.',
  src:[SRC.aa12,SRC.kelly17,SRC.krentzman,SRC.gollwitzer]},

 {id:'l30',u:7,v:2,f:1,chk:'October 13, 2026',title:'A pause for prayer or quiet',tag:'A short practice for the hard moment: stop, breathe, say your words, move.',ic:'sunrise',mins:3,
  ask:'What can I do in the hard moment, using my faith?',
  key:'In a hard moment: stop, breathe out slowly, say your words, then do the next small thing.',
  np:'The words I will say in a hard moment',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'sunrise'}],
    h:'When the pull is strong, what do you actually do in the next minute?',
    b:[bP('Many people of faith want to pray in a hard moment, but freeze, or say the words and stay put. Prayer is part of the steps themselves: step 11 is to seek “through prayer and meditation” a closer contact with God. This lesson gives the moment a simple shape.')],
    fact:{s:'Program · Alcoholics Anonymous, the Twelve Steps',i:[0]}},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think makes a short pause most useful in a hard moment?',ask:'Make your best guess.',a:3,
    c:[['Making it long, at least half an hour','Long is hard in a hard moment. A pause of a minute or two can be enough.'],
       ['Saying exactly the right words','Any words that steady you are fine. The shape matters more than perfect words.'],
       ['Feeling calm before you start','You do not need to feel calm first. The pause helps you get there.'],
       ['A slow breath, your words, then a move','Good guess. Breathing out slowly, steadying words, and a planned next move each have support of their own.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['chain',{n:['Stop','Breathe out slowly','Say your words','Do the next small thing'],i:['timer','wind','star','check']}],
    h:'Stop, breathe out slowly, say your words, then do the next small thing.',
    b:[bP('Put the phone down. In through the nose, then a long breath out through the mouth. Do three. Say a short prayer, a verse, or a line that steadies you. Then stand up, drink water, step outside, or call someone. Pray, then move.')]},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'chart'}],
    h:'Each part of the pause borrows from something that has been studied.',
    b:[bP('Five minutes a day of slow breathing improved mood in a randomized study. Noticing an urge instead of obeying it led smokers to smoke less. A plan made ahead of time helps people follow through. A prayer can hold all three.')],
    so:'The pause gives your faith a shape that research supports: slow down, steady yourself, then move.',
    fact:{s:'Studies · Balban, Bowen, Gollwitzer',i:[2,3,4]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'heart'}],
    h:'Have your words ready before you need them.',
    b:[bL(['**Your own words:** one short sentence you can say without thinking.','**A line from your faith’s writings** that you know by heart.','**The Serenity Prayer:** “God grant me the serenity to accept the things I cannot change…”','**Quiet:** one long breath out, then the next thing.'])],
    fact:{s:'Prayer · wording and history',i:[1]}},
   {k:'choose',q:1,e:'check',el:'Check it',h:'You said your prayer, but the pull is still strong. What is the best next step?',ask:'Pick the best move.',a:0,
    c:[['Stand up and do the next small thing anyway','Yes. Do not wait to feel better. Say the words, then move. If the urge wins anyway, that does not cancel the practice.'],
       ['Wait until you feel peace before moving','Peace often comes after the move, not before. Pray, then move.'],
       ['Decide the pause does not work for you','One hard moment is not a verdict. The pause is practice, and it gets easier.'],
       ['Say the prayer again and again until it lifts','Your words matter, but they work best followed by a move.']]}
  ],
  act:{h:'Make it yours.',p:'Add your words in My plan, under Lists. Then put the pause on your calm moves, so it shows up when you need it.',b:[['words']],mins:2,
   go:[{t:'Add the pause to my calm moves',a:'addmove',text:'Stop. Breathe out slowly. Say my words. Then stand up and move.',ic:'plus'},{t:'Add a quiet minute to my wind-down',a:'addwind',text:'A few quiet minutes or a prayer, phone in another room',ic:'moon'},{t:'Add my words in My plan',a:'tab',v:'settings',open:'s-lists',ic:'pencil'}],ok:'Your pause is ready.'},
  rc:{q:'The pull hits hard while you are at your desk. What does the four-move pause look like?',
   c:['Stop, breathe out, say your words, then move','Pray, then stay where you are','Scroll first, then pray later','Wait for the feeling to pass on its own'],a:0,
   r:'Stop, breathe out, say your words, then move.',
   cr:['Right. Stop, breathe out slowly, say your words, then do the next small thing.','Not quite. The pause ends with a move. Staying put leaves you in the pull.','Not quite. Scrolling first keeps you in the setup. Pause first.','Not quite. Waiting alone is hard. The pause gives the moment a shape.']},
  scope:'None of the studies in these lessons tested prayer as a way to get through a porn urge, so Daybook does not claim that it works that way. What has been studied is the shape of a good pause: a stop, a slower breath, and a plan made ahead of time. The pause also borrows the shape of the SOBER breathing space. The words are yours.',
  src:[SRC.aa12,SRC.serenity,SRC.balban,SRC.bowen,SRC.gollwitzer,SRC.chawla,SRC.mbrpslides]},

 {id:'l31',u:7,v:2,f:1,care:1,chk:'October 13, 2026',title:'Guilt, shame, and God',tag:'Honesty with God and one person, without punishing yourself.',ic:'heart',mins:3,
  ask:'How do I handle the guilt of feeling I let God down?',
  key:'Write it honestly, then tell God and one safe person. Guilt can point you toward change. Shame says to hide.',
  np:'One honest line about what I am carrying',
  cards:[
   {k:'text',q:1,e:'hook',el:'Sound familiar?',art:['icon',{ic:'heart'}],
    h:'Is the hardest part not the habit, but feeling you let God down, again?',
    b:[bP('For many people of faith, that is the heaviest part. The gap between belief and behavior is real. This lesson is about what to do with it, without hiding and without punishing yourself.')]},
   {k:'choose',e:'predict',el:'Make a guess',h:'What do you think the 12 steps ask you to do with guilt?',ask:'Make your best guess.',a:2,
    c:[['Keep it between you and God alone','God is in it, and so is a person: step 5 is admitting it “to God, to ourselves, and to another human being.”'],
       ['Punish yourself until it fades','Punishment is not one of the steps. An honest inventory is.'],
       ['Write it honestly, then tell God and a person','Good guess. Step 4 is a “searching and fearless moral inventory.” Step 5 is saying it to God, yourself, and another person.'],
       ['Push it down and move on','The steps bring it into the open. Buried guilt tends to stay heavy.']]},
   {k:'text',q:1,e:'answer',el:'The answer',art:['icon',{ic:'book'}],
    h:'Bring it into the open: write it honestly, then tell God and one safe person.',
    b:[bP('Guilt says “I did something I regret,” and it can point you toward change. Shame says “I am bad,” and it says to hide. The steps take the first road: an honest inventory, said out loud. Neither hiding nor punishing yourself is one of the steps.')],
    fact:{s:'Program · Alcoholics Anonymous, the Twelve Steps',i:[3]}},
   {k:'text',e:'proof',el:'The science',art:['chain',{n:['Prone to shame','More substance problems'],i:['heart','chart']}],
    h:'Shame-proneness went with more problems. Guilt-proneness did not.',
    b:[bP('Researchers measured how prone people were to shame (“I am bad”) and to guilt (“I did something I regret”), then asked about alcohol and drug problems. People more prone to shame had more problems. Guilt-proneness was largely unrelated.')],
    so:'Feeling you let God down can stay as guilt that moves you, instead of shame that buries you.',
    fact:{s:'Comparison · students and jail inmates · Dearing et al., 2005',i:[0]}},
   {k:'text',e:'proof',el:'The science',art:['icon',{ic:'lock'}],
    h:'Carrying a secret alone weighs on people, again and again.',
    b:[bP('In ten studies on secrets, people’s minds went back to a secret far more often than they had to hide it, and that predicted lower well-being.')],
    so:'Telling one safe person, a faith leader or a counselor, lets you stop carrying it alone.',
    fact:{s:'Ten studies · 13,000+ secrets · Slepian et al., 2017',i:[1]}},
   {k:'text',q:1,e:'move',el:'What to do',art:['icon',{ic:'pencil'}],
    h:'Take a small, kind inventory, then tell one person.',
    b:[bL(['Write what happened in plain facts: “I looked at porn on Tuesday night.”','Write what you felt and what came right before.','Write one thing to do differently, and one person you could tell.']),bP('A faith leader can offer spiritual support. A licensed therapist can offer treatment. You can have both.')]},
   {k:'choose',q:1,e:'check',el:'Check it',h:'After a slip you think, “God must be so disappointed in me.” What helps most?',ask:'Pick the best move.',a:3,
    c:[['Avoid prayer until you have earned it back','That is shame talking, and it pushes you to hide. You can come as you are.'],
       ['Punish yourself so it never happens again','Punishment is not one of the steps. An honest, kind inventory is.'],
       ['Keep it secret and try harder alone','Carrying it alone weighs on you every time it comes to mind. One safe person can help.'],
       ['Tell God what you did, then tell one safe person','Yes. That is guilt doing its job: honest, out in the open, and pointed toward change.']]}
  ],
  act:{h:'Write one honest line.',p:'Write one honest line about what you are carrying. If it stirs up something heavy, stop and talk to a person.',note:true,btn:'Save it',mins:2,
   go:[{t:'Copy: ask a faith leader or mentor to meet',a:'copy',text:SCRIPTS[7][1],ic:'copy'},{t:'Copy: the first sentence to say',a:'copy',text:SCRIPTS[8][1],ic:'copy'},{t:'Therapy on a small budget',a:'help',v:'therapy',sub:'start',ic:'heart'}],ok:'You wrote it honestly.'},
  rc:{q:'A friend from church confides, “I feel like God is done with me.” What would help them most?',
   c:['Agree it is serious and they should feel ashamed','Help them name what they did, and find one safe person','Tell them to keep it quiet','Tell them to stop thinking about it'],a:1,
   r:'Guilt can point toward change. Shame says to hide.',
   cr:['Not quite. Shame says to hide. Guilt about what they did can point them toward change.','Right. An honest name for what happened, said to God and a person, is the road the steps take.','Not quite. Secrets weigh on people every time they come to mind.','Not quite. Pushing it away keeps it heavy. Bringing it into the open helps.']},
