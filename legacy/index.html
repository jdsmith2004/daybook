  case 'del-event':ui.del=sh.id;render(true);break;
  case 'del-no':ui.del=null;render(true);break;
  case 'del-yes':removeEvent(sh.date,sh.id);ui.del=null;closeSheet();toast('Deleted.');break;
  case 'yn':{const f=getForm(date);f[t.dataset.f]=f[t.dataset.f]===v?null:v;touchForm(date);render(true);break}
  case 'night-so':{
   saveDay(date,d=>{const c=d.checkin||(d.checkin=blankCheckin());c.so=c.so===v?null:v});
   if(!sh)ui.open['path-morning']=true; /* keep the morning questions open while they are being answered */
   render(true);afterAction();break;
  }
  case 'night-sleep':{
   const dd=parseFloat(t.dataset.d);
   saveDay(date,d=>{const c=d.checkin||(d.checkin=blankCheckin());c.h=Math.min(14,Math.max(0,Math.round(((c.h==null?7:c.h)+dd)*2)/2))});
   if(!sh)ui.open['path-morning']=true;
   render(true);afterAction();break;
  }
  case 'morning-done':{
   const tk=todayKey(),mi=morningInfo(Store.days,Store.settings,tk);
   if(mi.so==null&&mi.h==null){toast('Answer at least one, or skip it for now.');break}
   saveDay(tk,d=>{const p=d.p||blankP();p.m=true;d.p=p});
   ui.open['path-morning']=false;
   render(true);afterAction('Thanks for being honest.');break;
  }
  case 'wind':{
   const tk=todayKey(),i=parseInt(t.dataset.i,10),n=Store.settings.wind.length;
   saveDay(tk,d=>{
    const p=d.p||blankP(),k=p.w.indexOf(i);
    if(k>=0)p.w.splice(k,1);else p.w.push(i);
    p.w=p.w.filter(x=>x<n);
    p.wd=p.w.length>=n;
    d.p=p;
   });
   render(true);afterAction();break;
  }
  case 'phone-away':{
   const tk=todayKey(),at=clockOf(Date.now()),b0=G().pts;
   saveDay(tk,d=>{const p=d.p||blankP();p.po=at;d.p=p});
   render(true);openScene('night',{at,gain:Math.max(0,G().pts-b0)});afterAction();break;
  }
  case 'save-checkin':doSaveCheckin(date);break;
  case 'edit-checkin':ui.editing[date]=true;render(true);break;
  case 'cancel-edit':delete ui.drafts[date];saveDrafts();delete ui.forms[date];ui.editing[date]=false;render(true);break;
  case 'range':ui.range=v;render(true);break;
  case 'series':ui.hide[v]=!ui.hide[v];render(true);break;
  case 'days-all':ui.daysAll=true;render(true);break;
  case 'week-nav':{
   const cw=Math.max(0,weekOf(todayKey(),Store.settings)),cur=ui.week==null?cw:ui.week;
   ui.week=Math.min(cw,Math.max(0,cur+parseInt(t.dataset.d,10)));render(true);break;
  }
  case 'open-week':ui.week=parseInt(t.dataset.k,10);goTab('weeks');break;
  case 'day1':
   saveSettings(s=>{
    if(v==='none')s.day1=null;
    else if(v==='later')s.day1=addDays(s.day1||addDays(s.start,7),7);
    else if(v==='today'){if(todayKey()>s.start)s.day1=todayKey()}
    else if(v==='tomorrow')s.day1=addDays(todayKey(),1);
    else if(v==='week')s.day1=addDays(todayKey(),7);
   });
   {const d1=Store.settings.day1;toast(!d1?'Just tracking. Nothing is counted, and you can start a Day 1 any time.':d1<=todayKey()?'Day 1 is today. Days with no slip logged will count.':'Day 1 is '+fmtDate(d1,{weekday:'long',month:'short',day:'numeric'})+'.')}
   render(true);break;
  case 'safety':{const i=+t.dataset.i;saveSettings(s=>{s.safety[i]=!s.safety[i]});render(true);afterAction(Store.settings.safety[i]?'Done. Your safety net is stronger.':'');break}
  case 'helpstep':{const i=+t.dataset.i;saveSettings(s=>{s.help[i]=!s.help[i]});render(true);afterAction(Store.settings.help[i]?'Done. That is a real step toward help.':'');break}
  case 'thr':saveSettings(s=>{const r=+t.dataset.r,c=+t.dataset.c;s.therapist.checks[r][c]=!s.therapist.checks[r][c]});render(true);break;
  case 'theme':setTheme(v);break;
  case 'celebrate':saveSettings(s=>{s.celebrate=v==='on'});render(true);break;
  case 'rt-set':{ /* the usual routine, in Settings */
   const k=t.dataset.k;if(ROUTINE_KEYS.indexOf(k)<0)break;
   saveSettings(s=>{s.routine=normRoutine(s.routine);s.routine[k]=v==='on'});
   ui.focusSel='[data-act="rt-set"][data-k="'+k+'"][data-v="'+v+'"]';
   render(true);break;
  }
  case 'rt-day':{ /* this one day only. A choice that matches the usual routine is not kept. */
   const k=t.dataset.k;if(ROUTINE_KEYS.indexOf(k)<0)break;
   const tk=todayKey(),usual=!!Store.settings.routine[k],want=v==='on';
   saveDay(tk,d=>{const p=d.p||blankP(),ov=Object.assign({},p.ov);if(want===usual)delete ov[k];else ov[k]=want;p.ov=ov;d.p=p});
   ui.open['rt-today']=true;
   ui.focusSel='[data-act="rt-day"][data-k="'+k+'"][data-v="'+v+'"]';
   render(true);break;
  }
  case 'copy':{
   const text=t.dataset.t!=null?t.dataset.t:SCRIPTS[+t.dataset.i][1];
   copyText(text).then(ok=>toast(ok?'Copied.':'Could not copy. Press and hold the text to copy it.'));break;
  }
  case 'export':exportFile(v);break;
  case 'import':{const f=document.getElementById('imp');if(f)f.click();break}
  case 'wipe-ask':ui.wipe=true;render(true);break;
  case 'wipe-no':ui.wipe=false;render(true);break;
  case 'wipe-yes':wipeAll().then(ok=>{ui.wipe=false;if(ok){ui.tab='today';ui.sheets=[];ui.fx={ring:null,pts:null,total:null,wins:{},winsInit:false};toast('Everything was deleted.')}render(true)});break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t||!t.matches)return;
 if(t.dataset&&t.dataset.lg!=null){lessonGuessInput(t);return}
 if(t.dataset&&t.dataset.obr!=null){obRange(t);return}
 if(t.dataset&&t.dataset.ob!=null){const sc=ui.scene;if(sc&&sc.id==='onb')obInput(sc,t);return}
 if(t.dataset&&t.dataset.lw!=null){const sc=ui.scene;if(sc&&sc.id==='lwrite')lwriteSave(sc.n,+t.dataset.lw,t.value);return}
 if(t.matches('input[type=range][data-f]')){setRatingInPlace(t,+t.value);return}
 if(t.matches('input[data-f="n"]')){const f=getForm(t.dataset.date);f.n=t.value;touchForm(t.dataset.date);return}
 if(t.id==='ev-note'){const sh=topSheet();if(sh&&sh.id)patchEvent(sh.date,sh.id,{note:t.value});return}
 if(t.id==='ci-note'){const sc=ui.scene;if(sc&&sc.id==='checkin'&&sc.evId)patchEvent(sc.date,sc.evId,{note:t.value});return}
 if(t.id==='ci-add'){const sc=ui.scene;if(sc)sc.addText=t.value;return}
 if(/^rt-\d$/.test(t.id)){const m=document.getElementById('rt-msg');if(m)m.textContent='';return}
 if(t.id==='ev-add'){const sh=topSheet();if(sh&&sh.add)sh.add.text=t.value;return}
 if(t.dataset.lnote){
  const id=t.dataset.lnote,txt=t.value.slice(0,LNOTE_LEN);
  if(LESSON_IDS.indexOf(id)>=0)saveSettings(s=>{const l=s.learn||(s.learn={notes:{}});if(txt.trim())l.notes[id]=txt;else delete l.notes[id]});
  return;
 }
 if(t.dataset.lrdraft!=null){const sc=ui.scene;if(sc&&sc.rb)sc.rb.draft=t.value;return}
 if(t.dataset.rdraft!=null){ui.r.draft=t.value;const n=document.getElementById('r-edit-n');if(n)n.textContent=t.value.length;return}
 if(t.dataset.radd!=null){
  ui.r.add=t.value;
  const n=document.getElementById('r-add-n');if(n)n.textContent=t.value.length;
  const b=document.getElementById('r-add-btn');if(b)b.disabled=!t.value.trim();
  return;
 }
 if(t.dataset.list){const k=t.dataset.list;saveSettings(s=>{s[k]=t.value.split('\n')});return}
 if(t.dataset.set&&t.tagName!=='SELECT'&&t.type!=='time'){const k=t.dataset.set;saveSettings(s=>{s[k]=t.value});return}
 if(t.dataset.plan){const i=+t.dataset.i,fld=t.dataset.plan;saveSettings(s=>{s.plan[i][fld]=t.value});return}
 if(t.dataset.slip!=null){const i=+t.dataset.slip,rows=slipRows();if(i>=0&&i<rows.length){rows[i]=t.value;slipSave();slipRefresh()}return}
 if(t.dataset.tname!=null&&t.dataset.tname!==''){const c=+t.dataset.tname;saveSettings(s=>{s.therapist.names[c]=t.value});return}
 if(t.dataset.rv){const k=+t.dataset.k,q=t.dataset.rv;saveReview(k,r=>{r.a[q]=t.value.slice(0,1500)});return}
});
document.addEventListener('change',e=>{
 const t=e.target;if(!t||!t.matches)return;
 if(t.id==='ev-time'){
  const sh=topSheet();
  if(sh&&sh.id){patchEvent(sh.date,sh.id,{time:isTime(t.value)?t.value:null});render(true)}
  return;
 }
 if(t.id==='ob-so-time'){
  const sc=ui.scene;
  if(sc&&sc.id==='onb'&&!obBusy(sc)&&isTime(t.value)){
   sc.a.so=t.value;
   const preset=OB_SO.indexOf(t.value)>=0;
   document.querySelectorAll('#lx-card .ob-t').forEach(b=>obToggleIn(b,b.dataset.v===t.value));
   const f=t.closest('.ob-custom');if(f)f.classList.toggle('on',!preset);
   obFootLabel(sc,true);vibe(8);
  }
  return;
 }
 if(t.id==='ci-time'){
  const sc=ui.scene;
  if(sc&&sc.id==='checkin'&&sc.evId){
   sc.time=isTime(t.value)?t.value:null;
   patchEvent(sc.date,sc.evId,{time:sc.time});
   const el=document.getElementById('ci-sum');if(el)el.textContent=ciSumText(sc);
  }
  return;
 }
 if(t.id==='imp'){if(t.files&&t.files[0])importFile(t.files[0]);t.value='';return}
 if(t.dataset.urpin!=null){const v=t.value;saveSettings(s=>{s.urPin=TOOL_IDS.indexOf(v)>=0?v:null});render(true);return}
 if(t.dataset.set&&(t.tagName==='SELECT'||t.type==='time')){
  const k=t.dataset.set;
  if(k==='rollover')saveSettings(s=>{s.rollover=parseInt(t.value,10)});
  else if(isTime(t.value))saveSettings(s=>{s[k]=t.value});
  render(true);return;
 }
 if(t.dataset.dset){
  const k=t.dataset.dset,st=Store.settings;
  if(k==='start'){
   if(!isKey(t.value)){render(true);return}
   saveSettings(s=>{s.start=t.value;if(s.day1&&s.day1<=t.value)s.day1=addDays(t.value,7)});
  }else{
   if(!t.value)saveSettings(s=>{s.day1=null});
   else if(isKey(t.value)&&t.value>st.start)saveSettings(s=>{s.day1=t.value});
   else toast('Day 1 has to come after the tracking start.');
  }
  render(true);
 }
});
document.addEventListener('pointerup',e=>{
 const t=e.target;
 if(t&&t.matches&&t.matches('input[type=range][data-f]')){
  const f=getForm(t.dataset.date);
  if(f[t.dataset.f]==null)setRatingInPlace(t,+t.value);
 }
});
document.addEventListener('focusin',e=>{
 const t=e.target;
 if(t&&t.matches&&t.matches('input[type=text],input[type=date],input[type=time],textarea')){
  setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'})}catch(x){}},300);
 }
});
document.addEventListener('focusout',()=>{
 if(ui.pendingRender)setTimeout(()=>{if(!isTyping())render()},60);
});
document.addEventListener('keydown',e=>{
 if(ui.scene&&ui.scene.id==='reasons'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();reasonStep(e.key==='ArrowRight'?1:-1);return}
 if(ui.scene&&ui.scene.id==='lesson'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return; /* arrow keys belong to the note box while typing */
  e.preventDefault();lessonStep(e.key==='ArrowRight'?1:-1);return;
 }
 /* in the reason boxes, Enter saves (a reason is one line) */
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
  const t=e.target;
  if(t&&t.dataset&&t.dataset.lrdraft!=null){e.preventDefault();lessonReasonSave();return}
  if(t&&t.dataset&&t.dataset.ob!=null){e.preventDefault();const sc=ui.scene;if(sc&&sc.id==='onb')obGo(sc,1);return}
  if(t&&t.dataset&&(t.dataset.radd!=null||t.dataset.rdraft!=null)){e.preventDefault();reasonAction(t.dataset.radd!=null?'r-add':'r-save',t);return}
  /* in the "Add your own" boxes, Enter adds it */
  if(t&&t.id==='ci-add'){e.preventDefault();optSave(ui.scene);return}
  if(t&&t.id==='ev-add'){e.preventDefault();evAddSave(topSheet());return}
 }
 if(e.key!=='Escape')return;
 /* Escape in an "Add your own" box only closes the box */
 const eg=e.target;
 if(eg&&eg.id==='ci-add'&&ui.scene){optClose(ui.scene);return}
 if(eg&&eg.id==='ev-add'){const sh=topSheet();if(sh){sh.add=null;render(true)}return}
 if(document.getElementById('cel-root')&&document.getElementById('cel-root').classList.contains('on')){celClose();return}
 if(ui.scene)sceneExit();
 else if(ui.sheets.length)closeSheet();
 else if(ui.tab==='reasons'&&ui.r.edit!=null)reasonAction('r-cancel',document.body);
});
/* swipe left or right on a reason to move to the next or the one before */
let swipe=null;
document.addEventListener('pointerdown',e=>{const s=e.target&&e.target.closest&&e.target.closest('#rd-stage');swipe=s?{x:e.clientX,y:e.clientY}:null});
document.addEventListener('pointercancel',()=>{swipe=null});
document.addEventListener('pointerup',e=>{
 if(!swipe)return;
 const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;
 if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6&&ui.scene&&ui.scene.id==='reasons')reasonStep(dx<0?1:-1);
});

/* ---------- boot ---------- */
let lastKey=null,lastEarly=false,lastSig='';
const earlyNow=()=>!!Store.settings&&new Date().getHours()<Store.settings.rollover;
/* a short fingerprint of "what the Today screen should be showing right now" so it redraws when a stop opens or a timer ends */
function rhythmSig(){
 const st=Store.settings;if(!st||appState()!=='app')return '';
 const r=rhythm(Store.days,st,todayKey(),Date.now()),t=loadTimer();
 return r.stops.map(s=>s.k+s.state).join(',')+'|'+(t?(Date.now()<t.start+t.dur?'r'+Math.ceil((t.start+t.dur-Date.now())/60000):'d'):'');
}
/* the countdown on the wind-down changes every minute; update that one line in place */
function updateWindLine(){
 const el=document.getElementById('wind-line'),st=Store.settings;
 if(!el||!st||appState()!=='app')return;
 const tk=todayKey(),day=Store.days[tk],t=windLine(rhythm(Store.days,st,tk,Date.now()),day&&day.p);
 if(el.textContent!==t)el.textContent=t;
}
function tick(){
 if(appState()!=='app')return;
 const k=todayKey(),e=earlyNow();
 if(lastKey&&k!==lastKey){ui.editing={};ui.week=null;lastKey=k;lastEarly=e;lastSig=rhythmSig();render()}
 else if(e!==lastEarly){lastEarly=e;lastSig=rhythmSig();render()}
 else{const sg=rhythmSig();if(sg!==lastSig){lastSig=sg;if(!ui.scene&&ui.tab==='today')render()}}
 lastKey=k;lastEarly=e;
 updateWindLine();
 if(Store.mode==='db'&&Object.keys(Store.dirty).length)flushAll();
}
async function start(){
 try{
  if(!window.claude||typeof window.claude.use!=='function')throw new Error('no runtime');
  const get=n=>Promise.resolve().then(()=>window.claude.use(n)).catch(()=>null);
  const r=await Promise.all([get('db'),get('user'),get('downloads')]);
  Store.downloads=r[2]||null;
  let uid=null;
  if(r[1]){try{uid=await r[1].id()}catch(e){uid=null}}
  if(r[0]&&uid)startDb(r[0],uid);else startLocal();
 }catch(e){startLocal()}
}
(function boot(){
 applyTheme();
 const d=readJSON(DK);ui.drafts=d&&typeof d==='object'?d:{};
 hydrate();
 Store.cacheOk=writeJSON('daybook.probe',1);dropKey('daybook.probe');
 ui.enter=true;
 render(true);
 lastKey=appState()==='app'?todayKey():null;lastEarly=earlyNow();lastSig=rhythmSig();
 setTimeout(()=>{if(appState()==='loading'){Store.slow=true;render()}},9000);
 start();
 setInterval(tick,30000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();if(ui.scene)sceneTick()}else persistNow()});
 window.addEventListener('pagehide',persistNow);
 window.addEventListener('hashchange',()=>{ui.sosDone=false;sosAuto(appState())});
 window.addEventListener('online',()=>{if(Store.mode==='db')flushAll()});
})();
</script>
